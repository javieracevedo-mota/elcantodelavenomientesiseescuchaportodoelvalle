<style>

* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  width: 100%;

  min-height: 100%;

  background: #000000;

  color: #00ff66;

  font-family: monospace;

}

/* TERMINAL */

#terminal {

  width: 100%;

  height: 100vh;

  height: 100dvh;

  padding: 12px 24px 24px;

  overflow-y: auto;

  overflow-x: hidden;

  overflow-wrap: anywhere;

  font-size: 22px;

  line-height: 1.45;

  text-align: left;

  overscroll-behavior: contain;

}

/* BARRA SUPERIOR */

.barra-superior {

  display: flex;

  align-items: center;

  justify-content: space-between;

  height: 28px;

  margin-bottom: 0;

}

/* FLECHA DE REGRESO */

.volver {

  display: flex;

  align-items: center;

  height: 28px;

  color: #00ff66;

  font-family: monospace;

  font-size: 24px;

  text-decoration: none;

}

.volver:hover,

.volver:focus-visible {

  color: #80ffad;

}

/* CONTROL DE AUDIO */

.audio-control {

  display: flex;

  align-items: center;

  justify-content: center;

  height: 28px;

  padding: 0;

  border: none;

  background: transparent;

  color: #00ff66;

  cursor: pointer;

}

.audio-control svg {

  display: block;

  width: 25px;

  height: 25px;

}

.audio-control:hover,

.audio-control:focus-visible {

  color: #80ffad;

}

/* TEXTO */

#output {

  display: inline;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  text-align: left;

}

/* CURSOR */

.cursor {

  animation: blink 1s steps(1) infinite;

}

@keyframes blink {

  50% {

    opacity: 0;

  }

}

/* NAVEGACIÓN FINAL */

#nav {

  display: none;

  gap: 24px;

  justify-content: space-between;

  margin: 38px 0 20px;

}

#nav.show {

  display: flex;

}

#nav a {

  color: #00ff66;

  text-decoration: none;

  border: 1px solid #00ff66;

  padding: 10px 14px;

  font-size: 18px;

}

#nav a:hover,

#nav a:focus-visible {

  background: #003319;

}

/* PANTALLAS PEQUEÑAS */

@media (max-width: 640px) {

  #terminal {

    padding: 8px 16px 16px;

    font-size: 18px;

  }

  .barra-superior {

    height: 26px;

  }

  .volver {

    height: 26px;

    font-size: 22px;

  }

  .audio-control {

    height: 26px;

  }

  .audio-control svg {

    width: 23px;

    height: 23px;

  }

  #nav {

    gap: 12px;

  }

  #nav a {

    font-size: 14px;

    padding: 8px 10px;

  }

}

></audio>

<!-- TERMINAL -->

<main id="terminal"><div class="barra-superior"><a

>←</a><button

  aria-label="Activar sonido"

>

  <svg

  >

    <path id="onda1" d="M15 9a5 5 0 0 1 0 6"/>

    <path id="onda2" d="M18 6a9 9 0 0 1 0 12"/>

    <path id="audioTachado" d="m16 9 5 6"/>

  </svg>

</button></div><span id="output"></span><span id="cursor" class="cursor">█</span>

<!-- NAVEGACIÓN FINAL -->

<nav id="nav">

  <a href="cartas.html">← ARCHIVOS</a>

<script>
// ENCABEZADO DEL ARCHIV
const encabezado =`ARCHIVO INTERCEPTADO
registro: 06
asunto: plaga patronal
fecha estimada: 1 de septiembre, 2042
ubicación aproximada: 20°13´21.44´´N / 99°05´27.04´´O
estado de señal: estable
`;

// CONTENIDO DE LA CARTA

const mensaje = `[INICIO DEL MENSAJE]

Llegué al Jardín Botánico 
del Instituto Intercontinental de Adaptación Hidrobiológica.

Un complejo entero dedicado a la reconstrucción genética de plantas.
Habían logrado clonar variedades antiguas de maíz.
También tenían
docenas de especies
de quelites.

Los mismos
que tanto te gustan.

Vi organismos que solo pueden crecer in vitro.
Especies extremófilas.
Diseñadas
para soportar niveles de contaminación
que matarían a cualquier otra forma de vida.

Sus raíces no buscaban agua.
Buscaban metales pesados.
Sus hojas eran casi translúcidas.
Como si hubieran aprendido a absorber lo mínimo posible de un entorno hostil.

Mientras caminaba por los invernaderos sentí algo extraño.
Como si el jardín no estuviera hecho solo de plantas.
Sino de intentos de adaptación.

Formas de vida aprendiendo a sobrevivir a lo que otros no soportarían.
Encontré una pequeña capilla.

Estaba en la sección
dedicada
a plagas biológicas.

Ahí mantenían una variedad de heno motita 
Una bromelia como la que crece en los mezquites.

Una planta epífita que décadas atrás
se extendió por todo el Valle.

Su crecimiento había sido impulsado por la contaminación
de los parques industriales.

No solo cubrió
árboles
y piedras.
Se adhirió a objetos religiosos.
A imágenes de santos.

A cohetes y castillos de fuegos artificiales.
Todo lo tapizó.
Todo lo absorbió. 

Para los investigadores esto fue una crisis.

Una plaga que desplazó flora nativa e invadió
ecosistemas enteros.
Pero lo que no entendieron
fue que no solo invadió el paisaje.
También 
invadió la cultura.

Las comunidades cercanas comenzaron a venerar
a una virgen cubierta
por la planta.

Los investigadores lo llamaron
“simbiosis accidental”.
Pero no vieron lo esencial.

La planta no solo había tomado
la materia.
Había tomado
la fe.
Los rituales cambiaron.

Las festividades dejaron de ser las mismas.
Las plantas no solo recubrían la virgen.

Se entrelazaban con las costumbres.

El pequeño jardín dentro de la capilla
mantenía con vida
reliquias
de esa fusión
entre lo vegetal
y 
lo divino.

Restos de cohetes con pequeños hijuelos creciendo sobre ellos.
Adornos festivos cubiertos por racimos de plantas.
Y la virgen que aún llevaban en procesión.

Mientras observaba esa mezcla de planta y creencia
pensé en algo.
Hay organismos que no viven solos.
Existen
entre otros cuerpos. 
Entre pieles que no son suyas.
Entre ramas
que los sostienen.

Saqué unas fotos de los objetos, 
alguien se acercaba
Tuve que esconderme
casi me descubren.

Con todo lo que he visto he entendido que la historia no es un río
que avanza en línea recta.

Se escurre a los costados.
Se filtra en el suelo.
Se evapora en el aire.

Y me estoy perdiendo
dentro de ella.

Cada viaje deja marcas en mi cuerpo. 

Los músculos tardan más en responder.
A veces olvido palabras en medio de una oración.
Siento como si mis pensamientos estuvieran siendo filtrados
por algo que no comprendo.

No sé cuánto más podré seguir escribiéndote 
antes de no saber como
pronunciar 
tu nombre

[FIN DEL MENSAJE]
..
...
....
......
.
.
.
.
.
.
.
.
.
estado de señal: activo
registro archivado`;
// ELEMENTOS

const output = document.getElementById("output");

const cursor = document.getElementById("cursor");

const nav = document.getElementById("nav");

// CONFIGURACIÓN DE ESCRITURA

const VELOCIDAD = 30;

const DURACION_DESCIFRADO = 3000;

const VELOCIDAD_DESCIFRADO = 55;

const caracteresAleatorios =

  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

  "abcdefghijklmnopqrstuvwxyz" +

  "0123456789#$%&/=?+*<>@";

const cambios = {

  o: "0",

  O: "0",

  a: "4",

  A: "4",

  e: "3",

  E: "3",

  i: "1",

  I: "1"

};

let indice = 0;

let interferenciaMostrada = false;

let salida = "";

let intervaloDescifrado = null;

// GENERAR CARACTERES ALEATORIOS

function caracterAleatorio() {

  const posicion = Math.floor(

    Math.random() * caracteresAleatorios.length

  );

  return caracteresAleatorios[posicion];

}

// ALTERAR ENCABEZADO

function generarEncabezadoAlterado() {

  return Array.from(encabezado).map(caracter => {

    if (/[a-zA-ZáéíóúÁÉÍÓÚñÑ0-9]/.test(caracter)) {

      return caracterAleatorio();

    }

    return caracter;

  }).join("");

}

// DESCIFRADO INICIAL

function iniciarDescifrado() {

  cursor.style.display = "none";

  output.textContent = generarEncabezadoAlterado();

  intervaloDescifrado = setInterval(() => {

    output.textContent = generarEncabezadoAlterado();

  }, VELOCIDAD_DESCIFRADO);

  setTimeout(() => {

    clearInterval(intervaloDescifrado);

    output.textContent = encabezado;

    salida = encabezado;

    cursor.style.display = "inline";

    setTimeout(escribir, 350);

  }, DURACION_DESCIFRADO);

}

// CORRUPCIÓN OCASIONAL

function corromper(caracter) {

  if (cambios[caracter] && Math.random() < 0.04) {

    return cambios[caracter];

  }

  return caracter;

}

// ESCRITURA PROGRESIVA

function escribir() {

  if (indice >= mensaje.length) {

    output.textContent = salida;

    cursor.style.display = "none";

    nav.classList.add("show");

    return;

  }

  // INTERFERENCIA AL 75 % DEL MENSAJE

  if (

    !interferenciaMostrada &&

    indice > mensaje.length * 0.75

  ) {

    interferenciaMostrada = true;

    output.textContent =

      salida + "\n\n[ SEÑAL INESTABLE ]\n";

    setTimeout(() => {

      output.textContent =

        salida + "\n\n[ RECONECTANDO ]\n";

      setTimeout(() => {

        output.textContent = salida;

        escribir();

      }, 2500);

    }, 1500);

    return;

  }

  salida += corromper(mensaje[indice]);

  indice++;

  output.textContent = salida;

  // SIN DESPLAZAMIENTO AUTOMÁTICO

  setTimeout(escribir, VELOCIDAD);

}

// INICIAR ESCRITURA

iniciarDescifrado();

// CONTROL DE AUDIO

const audioCarta = document.getElementById("audioCarta");

const audioControl = document.getElementById("audioControl");

const onda1 = document.getElementById("onda1");

const onda2 = document.getElementById("onda2");

const audioTachado = document.getElementById("audioTachado");

audioCarta.volume = 0.6;

// ACTUALIZAR ICONO

function actualizarIconoAudio() {

  const encendido =

    !audioCarta.paused && !audioCarta.muted;

  onda1.style.display = encendido ? "" : "none";

  onda2.style.display = encendido ? "" : "none";

  audioTachado.style.display = encendido ? "none" : "";

  const etiqueta = encendido

    ? "Apagar sonido"

    : "Activar sonido";

  audioControl.setAttribute("aria-label", etiqueta);

  audioControl.setAttribute("aria-pressed", String(encendido));

  audioControl.title = etiqueta;

}

// ACTIVAR AUDIO

async function activarAudio() {

  try {

    audioCarta.muted = false;

    await audioCarta.play();

  } catch (error) {

    console.warn("No se pudo reproducir el audio:", error);

  }

  actualizarIconoAudio();

}

// BOTÓN DE AUDIO

audioControl.addEventListener("click", async () => {

  if (!audioCarta.paused && !audioCarta.muted) {

    audioCarta.pause();

    actualizarIconoAudio();

  } else {

    await activarAudio();

  }

});

audioCarta.addEventListener("play", actualizarIconoAudio);

audioCarta.addEventListener("pause", actualizarIconoAudio);

audioCarta.addEventListener("volumechange", actualizarIconoAudio);

audioCarta.addEventListener("error", () => {

  console.warn(

    "Error al cargar el archivo:",

    audioCarta.currentSrc

  );

});

// INTENTO DE REPRODUCCIÓN AUTOMÁTICA

actualizarIconoAudio();

activarAudio();

</script>
