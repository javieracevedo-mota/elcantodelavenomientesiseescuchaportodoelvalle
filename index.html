<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>archivo de escucha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #d6ef43;
      --fg: #0b0b0b;
      --ink-soft: rgba(0, 0, 0, 0.12);
      --ink-mid: rgba(0, 0, 0, 0.22);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: 'VT323', monospace;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,0,0,0.05) 0px,
          rgba(0,0,0,0.05) 1px,
          transparent 2px,
          transparent 4px
        );
      opacity: 0.22;
      pointer-events: none;
      z-index: 1;
      animation: flicker 4s infinite;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(0,0,0,0.11) 0.7px, transparent 0.8px);
      background-size: 7px 7px;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: multiply;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
      z-index: 3;
    }

    .title-wrap {
      cursor: pointer;
      user-select: none;
      text-align: left;
      position: relative;
      z-index: 4;
      width: min(92vw, 900px);
    }

    .title {
      font-size: clamp(2.2rem, 6vw, 5.6rem);
      line-height: 0.98;
      letter-spacing: 0.03em;
      white-space: pre-line;
      min-height: 5.8em;
      color: var(--fg);
      text-transform: uppercase;
    }

    .title.idle {
      animation: breathe 2.8s ease-in-out infinite;
    }

    .cursor {
      display: inline-block;
      width: 0.58em;
      animation: blink 0.9s steps(1) infinite;
    }

    .loader {
      margin-top: 18px;
      opacity: 0;
      transition: opacity 0.2s ease;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: flex-start;
      font-size: clamp(1.3rem, 2vw, 1.9rem);
      min-width: 320px;
      color: var(--fg);
      text-transform: uppercase;
    }

    .loader.visible {
      opacity: 1;
    }

    .loader-label {
      white-space: nowrap;
    }

    .loader-percent {
      width: 4ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .loader-bar {
      width: 16ch;
      display: inline-block;
    }

    .glyph-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
      opacity: 0;
    }

    .glyph-layer.visible {
      opacity: 1;
    }

    .glyph {
  position: absolute;
  color: rgba(0,0,0,0.96);
  white-space: nowrap;
  animation: glyphPulse linear forwards;
  line-height: 0.85;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.88; }
    }

    @keyframes flicker {
      0%,100% { opacity: 0.22; }
      48% { opacity: 0.24; }
      49% { opacity: 0.18; }
      50% { opacity: 0.26; }
      51% { opacity: 0.19; }
      52% { opacity: 0.23; }
    }

    @keyframes glyphPulse {
      0% {
        opacity: 0;
        transform: scale(0.82) rotate(0deg);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0.95;
        transform: scale(1.08) rotate(0.6deg);
      }
    }

    @media (max-width: 640px) {
      .title {
        min-height: 6.8em;
      }

      .loader {
        min-width: 0;
        flex-wrap: wrap;
        gap: 8px 12px;
      }

      .loader-bar {
        width: 16ch;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div class="glyph-layer" id="glyphLayer"></div>

  <main class="wrap">
    <div class="title-wrap" id="titleWrap" aria-label="Abrir archivo">
      <div class="title" id="title"></div>
      <div class="loader" id="loader">
        <span class="loader-label">cargando archivo</span>
        <span class="loader-percent" id="loaderPercent">000%</span>
        <span class="loader-bar" id="loaderBar">[··············]</span>
      </div>
    </div>
  </main>

  <script>
    const REPO_BASE = "/elcantodelavenomientesiseescuchaportodoelvalle";

    const finalLines = [
      "el canto",
      "del ave no miente",
      "si se escucha",
      "por todo",
      "el valle"
    ];

    const fullText = finalLines.join("\n");

    const title = document.getElementById("title");
    const titleWrap = document.getElementById("titleWrap");
    const loader = document.getElementById("loader");
    const glyphLayer = document.getElementById("glyphLayer");

    let i = 0;
    let typingDone = false;
    let locked = false;

    const glyphs = [
      "𓅭","𓅯","𓅪","𓅬","𓅫",
      "𓆙","𓆘","𓆚",
      "𓆏","𓆉","𓆌",
      "𓇢","𓇣","𓇩",
      "≈","∿","⌇","○","°","∙",
      "/","\\","|","_","=","+","#","@","0","1",":",";","::","//","[]"
    ];

    function render(text) {
      title.innerHTML = text.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
    }

    function setFinalText() {
      title.innerHTML = fullText.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
      title.classList.add("idle");
      typingDone = true;
    }

    function typeText() {
      if (i < fullText.length) {
        render(fullText.slice(0, i + 1));
        i++;
        setTimeout(typeText, 62);
      } else {
        setFinalText();
      }
    }

    function randomChar() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&/=+*<>~?@";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function scrambleCurrentText() {
      const scrambled = [...finalLines, "_"].join("\n").split("\n").map(line =>
        line.split("").map(c => c === " " ? " " : randomChar()).join("")
      );
      title.innerHTML = scrambled.join("<br>");
    }

    function updateLoader(percent) {
      const percentEl = document.getElementById("loaderPercent");
      const barEl = document.getElementById("loaderBar");

      percentEl.textContent = String(percent).padStart(3, "0") + "%";

      const totalBars = 14;
      const filled = Math.round((percent / 100) * totalBars);

      barEl.textContent =
        "[" + "■".repeat(filled) + "·".repeat(totalBars - filled) + "]";
    }

    function createGlyph(x, y, size = 26) {
  const el = document.createElement("div");
  el.className = "glyph";
  el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];

  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.fontSize = size + "px";
  el.style.animationDuration = (2.2 + Math.random() * 2.2) + "s";

  glyphLayer.appendChild(el);
}

function fillScreenWithGlyphs() {
  glyphLayer.classList.add("visible");

  const spacingX = 24;
  const spacingY = 24;

  // 🧠 relleno estructurado (tipo tapiz)
  for (let y = -10; y < window.innerHeight + 30; y += spacingY) {
    for (let x = -10; x < window.innerWidth + 30; x += spacingX) {
      setTimeout(() => {
        const jitterX = x + (Math.random() * 12 - 6);
        const jitterY = y + (Math.random() * 12 - 6);
        const size = 18 + Math.random() * 18;
        createGlyph(jitterX, jitterY, size);
      }, Math.random() * 1200);
    }
  }

  // 🧠 saturación final (caos)
  setTimeout(() => {
    for (let i = 0; i < 450; i++) {
      setTimeout(() => {
        createGlyph(
          Math.random() * window.innerWidth,
          Math.random() * window.innerHeight,
          18 + Math.random() * 24
        );
      }, i * 4);
    }
  }, 900);
}
    
    function startLoadingSequence() {
      loader.classList.add("visible");
      title.classList.remove("idle");

      let percent = 0;

      function step() {
        scrambleCurrentText();
        updateLoader(percent);

        if (percent < 89) {
          percent += Math.floor(Math.random() * 8) + 4;
          if (percent > 89) percent = 89;
          setTimeout(step, 55);
          return;
        }

        if (percent < 100) {
          percent += 1;
          setTimeout(step, percent < 95 ? 190 : 320);
          return;
        }

        finishSequence();
      }

      step();
    }

    function finishSequence() {
      title.style.opacity = "0";
      loader.style.opacity = "0";
      fillScreenWithGlyphs();

      setTimeout(() => {
        window.location.href = `${REPO_BASE}/cartas.html`;
      }, 7500);
    }

    titleWrap.addEventListener("click", () => {
      if (locked || !typingDone) return;
      locked = true;
      startLoadingSequence();
    });

    typeText();
  </script>
</body>
</html>
