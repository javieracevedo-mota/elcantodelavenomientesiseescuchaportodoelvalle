<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>archivo de escucha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(120, 255, 170, 0.08), transparent 30%),
        linear-gradient(180deg, #030403 0%, #090d09 100%);
      color: #d8ffe1;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
      );
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.18) 0.7px, transparent 0.8px);
      background-size: 8px 8px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 1;
    }

    .frame {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .panel {
      width: 100%;
      max-width: 980px;
      border: 1px solid rgba(117, 255, 157, 0.45);
      background: rgba(0, 0, 0, 0.72);
      box-shadow:
        0 0 18px rgba(117, 255, 157, 0.14),
        inset 0 0 26px rgba(117, 255, 157, 0.06);
      padding: 34px 28px 40px;
      position: relative;
      overflow: hidden;
    }

    .panel::before,
    .panel::after,
    .corners::before,
    .corners::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: rgba(117, 255, 157, 0.9);
    }

    .panel::before {
      top: 10px;
      left: 10px;
      border-top: 1px solid;
      border-left: 1px solid;
    }

    .panel::after {
      top: 10px;
      right: 10px;
      border-top: 1px solid;
      border-right: 1px solid;
    }

    .corners::before {
      bottom: 10px;
      left: 10px;
      border-bottom: 1px solid;
      border-left: 1px solid;
    }

    .corners::after {
      bottom: 10px;
      right: 10px;
      border-bottom: 1px solid;
      border-right: 1px solid;
    }

    .meta {
      color: rgba(192, 255, 209, 0.72);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
      line-height: 1.7;
      margin-bottom: 34px;
    }

    .title-wrap {
      cursor: pointer;
      user-select: none;
      position: relative;
      z-index: 3;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5.4vw, 4.8rem);
      line-height: 1.08;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      color: #ebfff1;
      white-space: pre-line;
      min-height: 6.2em;
      text-shadow: 0 0 8px rgba(117, 255, 157, 0.14);
    }

    .title-wrap:hover .title {
      text-shadow: 0 0 14px rgba(117, 255, 157, 0.28);
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .hint {
      margin-top: 22px;
      color: rgba(216, 255, 225, 0.65);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.88rem;
    }

    .codebar {
      margin-top: 30px;
      color: rgba(154, 230, 174, 0.48);
      font-size: 0.78rem;
      line-height: 1.8;
      word-break: break-word;
    }

    .sky {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .bird {
      position: absolute;
      color: rgba(220, 255, 228, 0.9);
      font-size: 22px;
      animation: fly linear forwards;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(117, 255, 157, 0.18);
    }

    @keyframes fly {
      0% {
        transform: translateX(-15vw) translateY(0) scale(0.9);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateX(120vw) translateY(-40px) scale(1.1);
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      .panel {
        padding: 26px 20px 34px;
      }

      .title {
        min-height: 7.2em;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <main class="frame">
    <section class="panel">
      <div class="corners"></div>

      <div class="meta">
        archivo: protocolo de escucha<br>
        estado: señal cifrada<br>
        acceso: habilitado
      </div>

      <div class="sky" id="sky"></div>

      <div class="title-wrap" id="titleWrap">
        <div class="title" id="title"></div>
        <div class="hint">da click para abrir el archivo</div>
      </div>

      <div class="codebar">
        001011 / valle / escucha / canto / transmisión / decodificación / señal parcial / ave
      </div>
    </section>
  </main>

  <script>
    const finalText = [
      "el canto",
      "del ave no miente",
      "si se escucha",
      "por todo",
      "el valle_"
    ];

    const typingText = finalText.join("\n");
    const title = document.getElementById("title");
    const titleWrap = document.getElementById("titleWrap");
    const sky = document.getElementById("sky");

    let i = 0;
    let isAnimating = false;

    function renderTyping(text) {
      title.innerHTML = text.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
    }

    function typeText() {
      if (i < typingText.length) {
        renderTyping(typingText.slice(0, i + 1));
        i++;
        setTimeout(typeText, 55);
      } else {
        title.innerHTML = typingText.replace(/\n/g, "<br>");
      }
    }

    function randomChar() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&/=+*<>~?@";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function scrambleLines() {
      const lines = finalText.map(line =>
        line.split("").map(ch => {
          if (ch === " " || ch === "\n") return ch;
          return randomChar();
        }).join("")
      );
      title.innerHTML = lines.join("<br>");
    }

    function createBird() {
      const bird = document.createElement("div");
      bird.className = "bird";
      const symbols = ["v", "V", "^", "~", "𓅭", "𓅯", "𓅪"];
      bird.textContent = symbols[Math.floor(Math.random() * symbols.length)];

      bird.style.top = (10 + Math.random() * 70) + "%";
      bird.style.left = "-20vw";
      bird.style.fontSize = (18 + Math.random() * 22) + "px";
      bird.style.animationDuration = (1.6 + Math.random() * 2) + "s";

      sky.appendChild(bird);

      setTimeout(() => {
        bird.remove();
      }, 3800);
    }

    titleWrap.addEventListener("click", () => {
      if (isAnimating) return;
      isAnimating = true;

      let scrambleCount = 0;
      const scrambleInterval = setInterval(() => {
        scrambleLines();
        scrambleCount++;
        if (scrambleCount > 14) {
          clearInterval(scrambleInterval);
        }
      }, 70);

      for (let b = 0; b < 26; b++) {
        setTimeout(createBird, b * 70);
      }

      setTimeout(() => {
        window.location.href = "cartas.html";
      }, 1700);
    });

    typeText();
  </script>
</body>
</html>
