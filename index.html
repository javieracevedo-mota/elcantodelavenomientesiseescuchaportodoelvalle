<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>el canto del ave no miente</title>

  <!-- TIPOGRAFÍA CONSOLA -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(120, 255, 170, 0.06), transparent 30%),
        linear-gradient(180deg, #020302 0%, #070a07 100%);
      color: #eaffee;
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
    }

    /* textura de pantalla */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 2px,
        transparent 4px
      );
      opacity: 0.12;
      pointer-events: none;
    }

    /* ruido */
    .noise {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.15) 0.7px, transparent 0.8px);
      background-size: 8px 8px;
      opacity: 0.04;
      pointer-events: none;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .title-wrap {
      cursor: pointer;
      user-select: none;
    }

    .title {
      font-size: clamp(2rem, 6vw, 5rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      white-space: pre-line;
      text-shadow: 0 0 6px rgba(117,255,157,0.2);
      min-height: 6em;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* cielo de aves */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bird {
      position: absolute;
      color: rgba(235,255,241,0.95);
      white-space: nowrap;
      animation: fly linear forwards;
      text-shadow: 0 0 8px rgba(117,255,157,0.25);
    }

    @keyframes fly {
      0% {
        transform: translateX(-25vw) translateY(0) scale(0.8);
        opacity: 0;
      }
      10% { opacity: 1; }
      100% {
        transform: translateX(120vw) translateY(-60px) scale(1.1);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div class="sky" id="sky"></div>

  <main class="wrap">
    <div class="title-wrap" id="titleWrap">
      <div class="title" id="title"></div>
    </div>
  </main>

  <script>
    const finalLines = [
      "el canto",
      "del ave no miente",
      "si se escucha",
      "por todo",
      "el valle_"
    ];

    const fullText = finalLines.join("\n");

    const title = document.getElementById("title");
    const sky = document.getElementById("sky");
    const titleWrap = document.getElementById("titleWrap");

    let i = 0;
    let locked = false;

    function render(text) {
      title.innerHTML = text.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
    }

    function typeText() {
      if (i < fullText.length) {
        render(fullText.slice(0, i + 1));
        i++;
        setTimeout(typeText, 55);
      } else {
        title.innerHTML = fullText.replace(/\n/g, "<br>");
      }
    }

    function randomChar() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&/=+*<>~?@";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function scramble() {
      const scrambled = finalLines.map(line =>
        line.split("").map(c => c === " " ? " " : randomChar()).join("")
      );
      title.innerHTML = scrambled.join("<br>");
    }

    function createBird() {
      const bird = document.createElement("div");
      bird.className = "bird";

      const symbols = [
        "v","V","^","~",
        "𓅭","𓅯","𓅪","𓅬","𓅫",
        "vv","^^","v~v","~v~",
        "𓅭𓅯","𓅪𓅪","v v v"
      ];

      bird.textContent = symbols[Math.floor(Math.random() * symbols.length)];

      bird.style.top = (Math.random() * 90) + "%";
      bird.style.left = "-25vw";
      bird.style.fontSize = (14 + Math.random() * 36) + "px";
      bird.style.animationDuration = (1.2 + Math.random() * 2.2) + "s";

      sky.appendChild(bird);

      setTimeout(() => bird.remove(), 4000);
    }

    titleWrap.addEventListener("click", () => {
      if (locked) return;
      locked = true;

      let count = 0;
      const interval = setInterval(() => {
        scramble();
        count++;
        if (count > 20) clearInterval(interval);
      }, 60);

      for (let i = 0; i < 150; i++) {
        setTimeout(createBird, i * 15);
      }

      setTimeout(() => {
        window.location.href = "cartas.html";
      }, 2000);
    });

    typeText();
  </script>
</body>
</html>
