

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El canto del ave no miente si se escucha por todo el valle</title>

<style>

/* CONFIGURACIÓN GENERAL */

* {

  box-sizing: border-box;

}

:root {

  --verde: #00ff66;

  --verde-oscuro: #164b29;

  --verde-suave: #8bd9a2;

}

html, body {

  margin: 0;

  min-height: 100%;

  background: #000;

  color: var(--verde);

  font-family: monospace;

}

body {

  min-height: 100vh;

  min-height: 100dvh;

}

/* EFECTO CRT */

body::before {

  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: 10;

  background: repeating-linear-gradient(

    to bottom,

    transparent 0px,

    transparent 3px,

    rgba(0,255,102,0.035) 4px

  );

}

/* TERMINAL */

.terminal {

  width: min(100%, 950px);

  min-height: 100vh;

  min-height: 100dvh;

  margin: auto;

  padding: 26px 24px 50px;

  display: flex;

  flex-direction: column;

  justify-content: center;

}

/* PANTALLA INICIAL */

.intro {

  cursor: pointer;

  user-select: none;

  -webkit-tap-highlight-color: transparent;

}

.intro:focus-visible {

  outline: 1px solid var(--verde);

  outline-offset: 8px;

}

/* TÍTULO */

.title {

  margin: 0;

  font-size: clamp(24px, 5vw, 48px);

  font-weight: normal;

  line-height: 1.15;

  text-transform: uppercase;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  text-decoration: none;

}

/* CURSOR PARPADEANTE */

.cursor {

  display: inline-block;

  width: 0.6em;

  height: 0.85em;

  margin-left: 2px;

  vertical-align: -0.08em;

  background: var(--verde);

  border: 0;

  text-decoration: none;

  animation: blink 1s steps(1) infinite;

}

@keyframes blink {

  50% {

    opacity: 0;

  }

}

/* INDICACIÓN PARA ACCEDER */

.hint {

  margin-top: 32px;

  font-size: 15px;

  color: var(--verde-suave);

  animation: hintBlink 1.8s infinite;

}

@keyframes hintBlink {

  50% {

    opacity: 0.3;

  }

}

[hidden] {

  display: none !important;

}

/* TRANSICIÓN AL ACCEDER */

.intro.exit {

  animation: disappear 0.45s ease forwards;

}

@keyframes disappear {

  to {

    opacity: 0;

    transform: translateY(-12px);

  }

}

/* PANTALLAS PEQUEÑAS */

@media (max-width: 640px) {

  .terminal {

    padding: 24px 16px 40px;

  }

  .title {

    font-size: clamp(24px, 6vw, 36px);

  }

}

/* ACCESIBILIDAD */

@media (prefers-reduced-motion: reduce) {

  .intro.exit {

    animation-duration: 0.01ms;

  }

}

</style>

</head>

<body>

<main class="terminal">

  <!-- PANTALLA INICIAL: TÍTULO -->

  <div

    class="intro"

    id="intro"

    role="button"

    tabindex="0"

    aria-label="Acceder a los archivos"

  >

    <h1 class="title" id="title"></h1>

    <div class="hint" id="hint" hidden>

      [ TOCA PARA ACCEDER ]

    </div>

  </div>

</main>

<script>

// =====================================

// CONFIGURACIÓN DEL TÍTULO

// =====================================

const TITULO = [

  "EL CANTO",

  "DEL AVE NO MIENTE",

  "SI SE ESCUCHA",

  "POR TODO",

  "EL VALLE"

].join("\n");

const intro = document.getElementById("intro");

const title = document.getElementById("title");

const hint = document.getElementById("hint");

let escrituraTerminada = false;

let transicionIniciada = false;

// =====================================

// ESCRITURA PROGRESIVA DEL TÍTULO

// =====================================

let titleIndex = 0;

function renderizarTitulo() {

  title.textContent = TITULO.slice(0, titleIndex);

  const cursor = document.createElement("span");

  cursor.className = "cursor";

  cursor.setAttribute("aria-hidden", "true");

  title.appendChild(cursor);

}

function escribirTitulo() {

  if (titleIndex < TITULO.length) {

    titleIndex++;

    renderizarTitulo();

    setTimeout(escribirTitulo, 62);

  } else {

    escrituraTerminada = true;

    renderizarTitulo();

    hint.hidden = false;

  }

}

// =====================================

// ACCESO DIRECTO A LAS NUEVE CARTAS

// =====================================

function accederArchivos() {

  if (

    !escrituraTerminada ||

    transicionIniciada

  ) {

    return;

  }

  transicionIniciada = true;

  // Ocultar indicación

  hint.hidden = true;

  // Desvanecer el título

  intro.classList.add("exit");

  // Abrir página de archivos

  setTimeout(() => {

    window.location.href = "cartas.html";

  }, 450);

}

// =====================================

// INTERACCIÓN TÁCTIL Y CON RATÓN

// =====================================

intro.addEventListener("click", accederArchivos);

// =====================================

// ACCESIBILIDAD CON TECLADO

// =====================================

intro.addEventListener("keydown", event => {

  if (

    event.key === "Enter" ||

    event.key === " "

  ) {

    event.preventDefault();

    accederArchivos();

  }

});

// =====================================

// INICIAR SISTEMA

// =====================================

renderizarTitulo();

escribirTitulo();

</script>

</body>

</html>
