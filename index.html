<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El canto del ave no miente si se escucha por todo el valle</title>

<style>

* {

  box-sizing: border-box;

}

:root {

  --verde: #00ff66;

  --verde-oscuro: #164b29;

  --fondo: #000000;

  --verde-suave: #8bd9a2;

}

html, body {

  margin: 0;

  min-height: 100%;

  background: var(--fondo);

  color: var(--verde);

  font-family: monospace;

}

body {

  min-height: 100vh;

  min-height: 100dvh;

}

body::before {

  content: "";

  position: fixed;

  inset: 0;

  background: repeating-linear-gradient(

    to bottom,

    transparent 0px,

    transparent 3px,

    rgba(0, 255, 102, 0.035) 4px

  );

  pointer-events: none;

  z-index: 10;

}

.terminal {

  width: min(100%, 950px);

  min-height: 100vh;

  min-height: 100dvh;

  margin: auto;

  padding: 26px 24px 50px;

  display: flex;

  flex-direction: column;

  justify-content: center;

}

.title-wrap {

  cursor: pointer;

  user-select: none;

  -webkit-tap-highlight-color: transparent;

}

.title-wrap:focus-visible {

  outline: 1px solid var(--verde);

  outline-offset: 8px;

}

.title {

  margin: 0;

  font-size: clamp(24px, 5vw, 48px);

  font-weight: normal;

  line-height: 1.15;

  text-transform: uppercase;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  text-decoration: none;

}

.cursor {

  display: inline;

  animation: blink 1s steps(1) infinite;

  text-decoration: none;

}

@keyframes blink {

  50% {

    opacity: 0;

  }

}

.hint {

  margin-top: 30px;

  font-size: 15px;

  color: var(--verde-suave);

  animation: hintBlink 1.8s infinite;

}

@keyframes hintBlink {

  50% {

    opacity: 0.35;

  }

}

[hidden] {

  display: none !important;

}

/* SEGUNDA PANTALLA */

.interface {

  display: none;

  margin-top: 38px;

  animation: appear 0.5s ease-out;

}

.interface.visible {

  display: block;

}

@keyframes appear {

  from {

    opacity: 0;

    transform: translateY(12px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

.screen {

  border: 1px solid var(--verde-oscuro);

  padding: 20px;

  margin-bottom: 22px;

}

#wave {

  width: 100%;

  height: 140px;

  display: block;

}

.signal-label {

  margin-top: 14px;

  font-size: 12px;

  text-align: center;

  letter-spacing: 0.08em;

  color: var(--verde-suave);

}

.tuner {

  margin-top: 28px;

}

.tuner-title {

  font-size: 14px;

  margin-bottom: 16px;

}

.tuner-row {

  display: flex;

  align-items: center;

  gap: 16px;

}

input[type="range"] {

  width: 100%;

  accent-color: var(--verde);

  cursor: pointer;

}

input[type="range"]:disabled {

  opacity: 0.6;

}

.frequency {

  min-width: 65px;

  font-size: 17px;

  text-align: right;

}

.tuner-status {

  min-height: 38px;

  margin-top: 16px;

  color: var(--verde-suave);

  font-size: 13px;

  line-height: 1.6;

}

.audio-control {

  margin-top: 14px;

  display: flex;

  justify-content: flex-end;

}

.audio-control button {

  border: 1px solid var(--verde-oscuro);

  color: var(--verde-suave);

  background: transparent;

  padding: 7px 10px;

  font: inherit;

  font-size: 12px;

  cursor: pointer;

}

.audio-control button:hover,

.audio-control button:focus-visible {

  border-color: var(--verde);

}

.system-log {

  display: none;

  border: 1px solid var(--verde-oscuro);

  padding: 20px;

  margin-bottom: 20px;

}

.system-log.visible {

  display: block;

}

.screen-heading {

  margin: 0 0 20px;

  font-size: 14px;

  font-weight: normal;

  letter-spacing: 0.08em;

}

.log {

  min-height: 80px;

  white-space: pre-wrap;

  font-size: 14px;

  line-height: 1.8;

}

.access {

  display: none;

  margin-top: 24px;

}

.access.visible {

  display: block;

}

.access a {

  display: block;

  border: 1px solid var(--verde);

  color: var(--verde);

  text-decoration: none;

  padding: 15px 18px;

  font-size: 16px;

  text-align: center;

}

.access a:hover,

.access a:focus-visible {

  background: #003319;

}

@media (max-width: 640px) {

  .terminal {

    padding: 25px 16px 40px;

  }

  .title {

    font-size: clamp(24px, 6vw, 36px);

  }

  .interface {

    margin-top: 30px;

  }

  .screen,

  .system-log {

    padding: 14px;

  }

  #wave {

    height: 110px;

  }

  .tuner-title {

    font-size: 12px;

  }

  .frequency {

    font-size: 15px;

    min-width: 55px;

  }

}

</style>

</head>

<body>

<main class="terminal">

  <!-- PRIMER MOMENTO: TÍTULO -->

  <div

    class="title-wrap"

    id="titleWrap"

    role="button"

    tabindex="0"

    aria-label="Acceder al sistema"

    aria-expanded="false"

  >

    <h1 class="title" id="title"></h1>

    <div class="hint" id="hint" hidden>

      [ TOCA PARA ACCEDER ]

    </div>

  </div>

  <!-- SEGUNDO MOMENTO: SINTONIZADOR -->

  <div class="interface" id="interface">

    <section class="screen">

      <canvas id="wave"></canvas>

      <div class="signal-label" id="signalLabel">

        FRECUENCIA NO IDENTIFICADA

      </div>

      <div class="tuner">

        <div class="tuner-title">

          [ SINTONIZAR FRECUENCIA ]

        </div>

        <div class="tuner-row">

          <input

            id="frequency"

            type="range"

            min="0"

            max="100"

            value="12"

            step="1"

            aria-label="Sintonizar frecuencia"

          >

          <span class="frequency" id="frequencyValue">

            12.0

          </span>

        </div>

        <div class="tuner-status" id="tunerStatus">

          &gt; BUSCANDO TRANSMISIÓN...

        </div>

        <div class="audio-control">

          <button id="audioButton" type="button">

            SONIDO: ACTIVADO

          </button>

        </div>

      </div>

    </section>

    <!-- REGISTRO DEL SISTEMA -->

    <section class="system-log" id="systemLog">

      <h2 class="screen-heading">

        [ REGISTRO DEL SISTEMA ]

      </h2>

      <div class="log" id="log" aria-live="polite"></div>

      <div class="access" id="access">

        <a href="cartas.html">

          [ ACCEDER A LOS ARCHIVOS → ]

        </a>

      </div>

    </section>

  </div>

</main>

<script>

// ====================================

// CONFIGURACIÓN

// ====================================

const TITULO = [

  "EL CANTO",

  "DEL AVE NO MIENTE",

  "SI SE ESCUCHA",

  "POR TODO",

  "EL VALLE"

].join("\n");

const FRECUENCIA_SECRETA = 73;

const title = document.getElementById("title");

const titleWrap = document.getElementById("titleWrap");

const hint = document.getElementById("hint");

const interfaceElement = document.getElementById("interface");

const frequency = document.getElementById("frequency");

const frequencyValue = document.getElementById("frequencyValue");

const tunerStatus = document.getElementById("tunerStatus");

const signalLabel = document.getElementById("signalLabel");

const systemLog = document.getElementById("systemLog");

const log = document.getElementById("log");

const access = document.getElementById("access");

const audioButton = document.getElementById("audioButton");

let escrituraTerminada = false;

let interfazAbierta = false;

let señalEncontrada = false;

let signalStrength = 0;

let sonidoActivado = true;

let audioContext = null;

let ultimoCanto = 0;

// ====================================

// ESCRITURA DEL TÍTULO

// ====================================

let titleIndex = 0;

function renderizarTitulo() {

  title.textContent = TITULO.slice(0, titleIndex);

  // CURSOR DE BLOQUE, SIN GUIONES BAJOS

  const cursor = document.createElement("span");

  cursor.className = "cursor";

  cursor.textContent = "█";

  title.appendChild(cursor);

}

function escribirTitulo() {

  if (titleIndex < TITULO.length) {

    titleIndex++;

    renderizarTitulo();

    setTimeout(escribirTitulo, 62);

  } else {

    // EL CURSOR PERMANECE AL FINAL

    renderizarTitulo();

    escrituraTerminada = true;

    hint.hidden = false;

  }

}

// ====================================

// ABRIR INTERFAZ

// ====================================

function abrirInterfaz() {

  if (!escrituraTerminada || interfazAbierta) return;

  interfazAbierta = true;

  hint.hidden = true;

  interfaceElement.classList.add("visible");

  titleWrap.setAttribute("aria-expanded", "true");

  titleWrap.removeAttribute("role");

  titleWrap.removeAttribute("tabindex");

  titleWrap.style.cursor = "default";

  activarAudio();

  setTimeout(() => {

    interfaceElement.scrollIntoView({

      behavior: "smooth",

      block: "nearest"

    });

  }, 200);

}

titleWrap.addEventListener("click", abrirInterfaz);

titleWrap.addEventListener("keydown", event => {

  if (event.key === "Enter" || event.key === " ") {

    event.preventDefault();

    abrirInterfaz();

  }

});

// ====================================

// AUDIO DE AVES SINTETIZADO

// ====================================

function activarAudio() {

  if (!sonidoActivado) return;

  const AudioContextClass =

    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) return;

  if (!audioContext) {

    audioContext = new AudioContextClass();

  }

  if (audioContext.state === "suspended") {

    audioContext.resume();

  }

}

function cantarAve(intensidad = 0.5) {

  if (!sonidoActivado || !audioContext) return;

  if (audioContext.state !== "running") return;

  const ahora = audioContext.currentTime;

  const oscilador = audioContext.createOscillator();

  const volumen = audioContext.createGain();

  oscilador.type = "sine";

  const frecuenciaBase = 950 + intensidad * 900;

  oscilador.frequency.setValueAtTime(

    frecuenciaBase,

    ahora

  );

  oscilador.frequency.exponentialRampToValueAtTime(

    frecuenciaBase * 1.6,

    ahora + 0.08

  );

  oscilador.frequency.exponentialRampToValueAtTime(

    frecuenciaBase * 0.8,

    ahora + 0.2

  );

  volumen.gain.setValueAtTime(0.0001, ahora);

  volumen.gain.exponentialRampToValueAtTime(

    0.045,

    ahora + 0.02

  );

  volumen.gain.exponentialRampToValueAtTime(

    0.0001,

    ahora + 0.23

  );

  oscilador.connect(volumen);

  volumen.connect(audioContext.destination);

  oscilador.start(ahora);

  oscilador.stop(ahora + 0.24);

}

// ====================================

// SINTONIZAR FRECUENCIA

// ====================================

function actualizarFrecuencia() {

  if (señalEncontrada) return;

  activarAudio();

  const valor = Number(frequency.value);

  frequencyValue.textContent = valor.toFixed(1);

  const distancia = Math.abs(

    valor - FRECUENCIA_SECRETA

  );

  signalStrength = Math.max(

    0,

    1 - distancia / 35

  );

  const ahora = performance.now();

  const intervalo = 550 - signalStrength * 400;

  if (ahora - ultimoCanto > intervalo) {

    ultimoCanto = ahora;

    cantarAve(signalStrength);

  }

  if (distancia <= 3) {

    signalStrength = 1;

    señalEncontrada = true;

    frequency.disabled = true;

    tunerStatus.textContent =

      "> SEÑAL ESTABLE / TRANSMISIÓN IDENTIFICADA";

    signalLabel.textContent =

      "CANTO DE AVE DETECTADO";

    cantarAve(1);

    setTimeout(() => cantarAve(0.9), 250);

    setTimeout(() => cantarAve(1), 550);

    iniciarDescifrado();

  } else if (distancia < 15) {

    tunerStatus.textContent =

      "> SEÑAL PARCIAL / INTERFERENCIA REDUCIDA";

    signalLabel.textContent =

      "TRANSMISIÓN FRAGMENTADA";

  } else {

    tunerStatus.textContent =

      "> INTERFERENCIA / BUSCANDO TRANSMISIÓN";

    signalLabel.textContent =

      "FRECUENCIA NO IDENTIFICADA";

  }

}

// ====================================

// REGISTRO DEL SISTEMA

// ====================================

function esperar(ms) {

  return new Promise(resolve => setTimeout(resolve, ms));

}

async function iniciarDescifrado() {

  systemLog.classList.add("visible");

  log.textContent = "";

  const mensajes = [

    "> SEÑAL BIOLÓGICA CONFIRMADA",

    "> INTERCEPTANDO TRANSMISIÓN...",

    "> ANALIZANDO PATRONES DE AVES...",

    "> RECUPERANDO MEMORIA TERRITORIAL...",

    "> DESCIFRANDO ARCHIVOS TEMPORALES...",

    "> 09 REGISTROS ENCONTRADOS",

    "> ACCESO AUTORIZADO"

  ];

  for (const mensaje of mensajes) {

    log.textContent += mensaje + "\n";

    await esperar(550);

  }

  await esperar(450);

  access.classList.add("visible");

}

// ====================================

// CONTROL DE SONIDO

// ====================================

audioButton.addEventListener("click", () => {

  sonidoActivado = !sonidoActivado;

  audioButton.textContent = sonidoActivado

    ? "SONIDO: ACTIVADO"

    : "SONIDO: DESACTIVADO";

  if (sonidoActivado) {

    activarAudio();

  }

});

// ====================================

// ONDA ANIMADA

// ====================================

const canvas = document.getElementById("wave");

const ctx = canvas.getContext("2d");

let tiempo = 0;

function dibujarOnda() {

  if (!interfazAbierta) {

    requestAnimationFrame(dibujarOnda);

    return;

  }

  const rect = canvas.getBoundingClientRect();

  const dpr = window.devicePixelRatio || 1;

  const ancho = Math.max(1, rect.width);

  const alto = Math.max(1, rect.height);

  const pixelWidth = Math.round(ancho * dpr);

  const pixelHeight = Math.round(alto * dpr);

  if (

    canvas.width !== pixelWidth ||

    canvas.height !== pixelHeight

  ) {

    canvas.width = pixelWidth;

    canvas.height = pixelHeight;

  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.clearRect(0, 0, ancho, alto);

  // CUADRÍCULA

  ctx.strokeStyle = "#164b29";

  ctx.lineWidth = 0.5;

  for (let x = 0; x < ancho; x += 35) {

    ctx.beginPath();

    ctx.moveTo(x, 0);

    ctx.lineTo(x, alto);

    ctx.stroke();

  }

  for (let y = 0; y < alto; y += 25) {

    ctx.beginPath();

    ctx.moveTo(0, y);

    ctx.lineTo(ancho, y);

    ctx.stroke();

  }

  // ONDA

  ctx.beginPath();

  ctx.strokeStyle = "#00ff66";

  ctx.lineWidth = 1.8;

  for (let x = 0; x < ancho; x++) {

    const centro = alto / 2;

    const amplitud = 3 + signalStrength * 40;

    const onda1 = Math.sin(x * 0.08 + tiempo);

    const onda2 = Math.sin(x * 0.21 - tiempo * 1.5);

    const envolvente =

      0.35 + 0.65 * Math.pow(

        Math.sin(x * 0.017),

        2

      );

    const y =

      centro +

      (onda1 * 0.7 + onda2 * 0.3) *

      amplitud *

      envolvente;

    if (x === 0) {

      ctx.moveTo(x, y);

    } else {

      ctx.lineTo(x, y);

    }

  }

  ctx.stroke();

  tiempo += 0.035;

  requestAnimationFrame(dibujarOnda);

}

// ====================================

// INICIAR

// ====================================

frequency.addEventListener("input", actualizarFrecuencia);

renderizarTitulo();

escribirTitulo();

dibujarOnda();

</script>

</body>

</html>
