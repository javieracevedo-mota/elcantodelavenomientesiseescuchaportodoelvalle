<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El canto del ave no miente si se escucha por todo el valle</title>

<style>

* {

  box-sizing: border-box;

}

:root {

  --verde: #00ff66;

  --verde-oscuro: #164b29;

  --verde-suave: #8bd9a2;

}

html, body {

  margin: 0;

  min-height: 100%;

  background: #000;

  color: var(--verde);

  font-family: monospace;

}

body {

  min-height: 100vh;

  min-height: 100dvh;

}

body::before {

  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: 10;

  background: repeating-linear-gradient(

    to bottom,

    transparent 0px,

    transparent 3px,

    rgba(0,255,102,0.035) 4px

  );

}

.terminal {

  width: min(100%, 950px);

  min-height: 100vh;

  min-height: 100dvh;

  margin: auto;

  padding: 26px 24px 50px;

  display: flex;

  flex-direction: column;

  justify-content: center;

}

/* PANTALLA DEL TÍTULO */

.intro {

  cursor: pointer;

  user-select: none;

  -webkit-tap-highlight-color: transparent;

}

.intro:focus-visible {

  outline: 1px solid var(--verde);

  outline-offset: 8px;

}

.title {

  margin: 0;

  font-size: clamp(24px, 5vw, 48px);

  font-weight: normal;

  line-height: 1.15;

  text-transform: uppercase;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  text-decoration: none !important;

}

/* CURSOR ANCHO SIN GUION */

.cursor {

  display: inline-block;

  width: 0.6em;

  height: 0.85em;

  margin-left: 2px;

  vertical-align: -0.08em;

  background: var(--verde);

  border: 0;

  text-decoration: none !important;

  animation: blink 1s steps(1) infinite;

}

@keyframes blink {

  50% { opacity: 0; }

}

.hint {

  margin-top: 32px;

  font-size: 15px;

  color: var(--verde-suave);

  animation: hintBlink 1.8s infinite;

}

@keyframes hintBlink {

  50% { opacity: 0.3; }

}

[hidden] {

  display: none !important;

}

/* TRANSICIONES */

.intro.exit {

  animation: disappear 0.45s ease forwards;

}

@keyframes disappear {

  to {

    opacity: 0;

    transform: translateY(-12px);

  }

}

.interface {

  display: none;

  animation: appear 0.6s ease forwards;

}

.interface.visible {

  display: block;

}

@keyframes appear {

  from {

    opacity: 0;

    transform: translateY(12px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

/* SINTONIZADOR */

.screen {

  border: 1px solid var(--verde-oscuro);

  padding: 22px;

  margin-bottom: 22px;

}

#wave {

  display: block;

  width: 100%;

  height: 150px;

}

.signal-label {

  margin-top: 14px;

  font-size: 12px;

  text-align: center;

  letter-spacing: 0.08em;

  color: var(--verde-suave);

}

.tuner {

  margin-top: 32px;

}

.tuner-title {

  font-size: 15px;

  margin-bottom: 18px;

}

.tuner-row {

  display: flex;

  align-items: center;

  gap: 16px;

}

input[type="range"] {

  width: 100%;

  accent-color: var(--verde);

  cursor: pointer;

  touch-action: pan-x;

}

input[type="range"]:disabled {

  opacity: 0.65;

}

.frequency {

  min-width: 65px;

  font-size: 18px;

  text-align: right;

}

.tuner-status {

  min-height: 40px;

  margin-top: 18px;

  color: var(--verde-suave);

  font-size: 13px;

  line-height: 1.6;

}

/* CONTROL DE AUDIO */

.audio-control {

  display: flex;

  justify-content: flex-end;

  margin-top: 16px;

}

.audio-control button {

  border: 1px solid var(--verde-oscuro);

  color: var(--verde-suave);

  background: transparent;

  padding: 10px 12px;

  font: inherit;

  font-size: 12px;

  cursor: pointer;

}

.audio-control button:hover,

.audio-control button:focus-visible {

  border-color: var(--verde);

}

/* REGISTRO DEL SISTEMA */

.system-log {

  display: none;

  border: 1px solid var(--verde-oscuro);

  padding: 22px;

}

.system-log.visible {

  display: block;

}

.screen-heading {

  margin: 0 0 20px;

  font-size: 14px;

  font-weight: normal;

}

.log {

  min-height: 80px;

  white-space: pre-wrap;

  font-size: 14px;

  line-height: 1.8;

}

.access {

  display: none;

  margin-top: 24px;

}

.access.visible {

  display: block;

}

.access a {

  display: block;

  border: 1px solid var(--verde);

  color: var(--verde);

  text-decoration: none;

  padding: 15px 18px;

  font-size: 16px;

  text-align: center;

}

.access a:hover,

.access a:focus-visible {

  background: #003319;

}

@media (max-width: 640px) {

  .terminal {

    padding: 24px 16px 40px;

  }

  .title {

    font-size: clamp(24px, 6vw, 36px);

  }

  .screen,

  .system-log {

    padding: 15px;

  }

  #wave {

    height: 120px;

  }

  .tuner-title {

    font-size: 13px;

  }

  .frequency {

    min-width: 55px;

    font-size: 16px;

  }

}

@media (prefers-reduced-motion: reduce) {

  .intro.exit,

  .interface.visible {

    animation-duration: 0.01ms;

  }

}

</style>

</head>

<body>

<main class="terminal">

  <!-- PANTALLA 1 -->

  <div

    class="intro"

    id="intro"

    role="button"

    tabindex="0"

    aria-label="Acceder al sistema"

  >

    <h1 class="title" id="title"></h1>

    <div class="hint" id="hint" hidden>

      [ TOCA PARA ACCEDER ]

    </div>

  </div>

  <!-- PANTALLA 2 -->

  <div class="interface" id="interface">

    <section class="screen">

      <canvas

        id="wave"

        aria-label="Visualización de señal"

        role="img"

      ></canvas>

      <div class="signal-label" id="signalLabel">

        FRECUENCIA NO IDENTIFICADA

      </div>

      <div class="tuner">

        <div class="tuner-title">

          [ SINTONIZAR FRECUENCIA ]

        </div>

        <div class="tuner-row">

          <input

            id="frequency"

            type="range"

            min="0"

            max="100"

            value="12"

            step="1"

            aria-label="Sintonizar frecuencia"

          >

          <span class="frequency" id="frequencyValue">

            12.0

          </span>

        </div>

        <div class="tuner-status" id="tunerStatus">

          &gt; BUSCANDO TRANSMISIÓN...

        </div>

        <div class="audio-control">

          <button

            id="audioButton"

            type="button"

            aria-pressed="true"

          >

            SONIDO: ACTIVADO

          </button>

        </div>

      </div>

    </section>

    <section class="system-log" id="systemLog">

      <h2 class="screen-heading">

        [ REGISTRO DEL SISTEMA ]

      </h2>

      <div class="log" id="log" aria-live="polite"></div>

      <div class="access" id="access">

        <a href="cartas.html">

          [ ACCEDER A LOS ARCHIVOS → ]

        </a>

      </div>

    </section>

  </div>

</main>

<script>

// ========================================

// CONFIGURACIÓN

// ========================================

const TITULO = [

  "EL CANTO",

  "DEL AVE NO MIENTE",

  "SI SE ESCUCHA",

  "POR TODO",

  "EL VALLE"

].join("\n");

const FRECUENCIA_SECRETA = 73;

const intro = document.getElementById("intro");

const title = document.getElementById("title");

const hint = document.getElementById("hint");

const interfaz = document.getElementById("interface");

const frequency = document.getElementById("frequency");

const frequencyValue = document.getElementById("frequencyValue");

const tunerStatus = document.getElementById("tunerStatus");

const signalLabel = document.getElementById("signalLabel");

const systemLog = document.getElementById("systemLog");

const log = document.getElementById("log");

const access = document.getElementById("access");

const audioButton = document.getElementById("audioButton");

let escrituraTerminada = false;

let transicionIniciada = false;

let interfazAbierta = false;

let senalEncontrada = false;

let signalStrength = 0;

let sonidoActivado = true;

let audioContext = null;

let masterGain = null;

let ultimoCanto = 0;

let temporizadorAves = null;

// ========================================

// ESCRITURA DEL TÍTULO

// ========================================

let titleIndex = 0;

function renderizarTitulo() {

  title.textContent = TITULO.slice(0, titleIndex);

  const cursor = document.createElement("span");

  cursor.className = "cursor";

  cursor.setAttribute("aria-hidden", "true");

  // Sin caracteres ni guiones

  title.appendChild(cursor);

}

function escribirTitulo() {

  if (titleIndex < TITULO.length) {

    titleIndex++;

    renderizarTitulo();

    setTimeout(escribirTitulo, 62);

  } else {

    escrituraTerminada = true;

    renderizarTitulo();

    hint.hidden = false;

  }

}

// ========================================

// SISTEMA DE AUDIO

// ========================================

// IMPORTANTE:

// Crear y reanudar el AudioContext directamente

// desde una interacción del usuario.

function activarAudio() {

  if (!sonidoActivado) {

    return Promise.resolve(false);

  }

  const AudioContextClass =

    window.AudioContext ||

    window.webkitAudioContext;

  if (!AudioContextClass) {

    tunerStatus.textContent =

      "> AUDIO NO COMPATIBLE CON ESTE NAVEGADOR";

    return Promise.resolve(false);

  }

  try {

    if (!audioContext || audioContext.state === "closed") {

      audioContext = new AudioContextClass();

      masterGain = audioContext.createGain();

      masterGain.gain.value = 0.8;

      masterGain.connect(audioContext.destination);

    }

    if (audioContext.state === "running") {

      return Promise.resolve(true);

    }

    return audioContext.resume()

      .then(() => audioContext.state === "running")

      .catch(error => {

        console.warn("No se pudo iniciar audio:", error);

        return false;

      });

  } catch (error) {

    console.warn("Error de audio:", error);

    return Promise.resolve(false);

  }

}

// ========================================

// GENERADOR DE CANTOS DE AVES

// ========================================

function notaAve(

  inicio,

  duracion,

  frecuenciaInicial,

  frecuenciaFinal,

  volumen

) {

  if (

    !audioContext ||

    !masterGain ||

    !sonidoActivado ||

    audioContext.state !== "running"

  ) {

    return;

  }

  const oscilador = audioContext.createOscillator();

  const ganancia = audioContext.createGain();

  oscilador.type = "sine";

  oscilador.frequency.setValueAtTime(

    frecuenciaInicial,

    inicio

  );

  oscilador.frequency.exponentialRampToValueAtTime(

    frecuenciaFinal,

    inicio + duracion

  );

  ganancia.gain.setValueAtTime(0.0001, inicio);

  ganancia.gain.exponentialRampToValueAtTime(

    Math.max(volumen, 0.0002),

    inicio + duracion * 0.18

  );

  ganancia.gain.exponentialRampToValueAtTime(

    0.0001,

    inicio + duracion

  );

  oscilador.connect(ganancia);

  ganancia.connect(masterGain);

  oscilador.start(inicio);

  oscilador.stop(inicio + duracion + 0.02);

  oscilador.onended = () => {

    oscilador.disconnect();

    ganancia.disconnect();

  };

}

function cantarAve(intensidad = 0.5) {

  if (

    !sonidoActivado ||

    !audioContext ||

    audioContext.state !== "running"

  ) {

    return;

  }

  const t = audioContext.currentTime + 0.025;

  // Mayor intensidad = sonido más definido

  const volumen = 0.045 + intensidad * 0.09;

  const base = 850 + intensidad * 650;

  notaAve(

    t,

    0.14,

    base,

    base * 1.5,

    volumen

  );

  notaAve(

    t + 0.16,

    0.12,

    base * 1.35,

    base * 0.95,

    volumen * 0.85

  );

  notaAve(

    t + 0.31,

    0.19,

    base * 1.05,

    base * 1.7,

    volumen

  );

}

// Canto breve de prueba al acceder

function cantoDeBienvenida() {

  if (!audioContext || !sonidoActivado) return;

  cantarAve(0.85);

  // Segunda llamada para que sea perceptible

  setTimeout(() => {

    if (sonidoActivado) {

      cantarAve(0.65);

    }

  }, 600);

}

// Sonidos intermitentes al sintonizar

function iniciarAmbienteSonoro() {

  if (temporizadorAves) return;

  temporizadorAves = setInterval(() => {

    if (

      !interfazAbierta ||

      !sonidoActivado ||

      senalEncontrada

    ) {

      return;

    }

    const probabilidad =

      0.25 + signalStrength * 0.7;

    if (Math.random() < probabilidad) {

      cantarAve(signalStrength);

    }

  }, 850);

}

// Canto al encontrar la frecuencia

function cantoFinal() {

  if (

    !audioContext ||

    !sonidoActivado ||

    audioContext.state !== "running"

  ) {

    return;

  }

  const t = audioContext.currentTime + 0.03;

  const notas = [

    [0.00, 1200, 1800],

    [0.18, 1600, 2300],

    [0.37, 1400, 2100],

    [0.60, 1800, 2700],

    [0.84, 1500, 2200],

    [1.08, 2100, 3000]

  ];

  notas.forEach(([desfase, inicial, final]) => {

    notaAve(

      t + desfase,

      0.16,

      inicial,

      final,

      0.14

    );

  });

}

// ========================================

// TRANSICIÓN ENTRE PANTALLAS

// ========================================

function abrirInterfaz() {

  if (!escrituraTerminada || transicionIniciada) {

    return;

  }

  transicionIniciada = true;

  // La activación ocurre dentro del clic.

  // Esto es importante para Safari.

  const audioListo = activarAudio();

  hint.hidden = true;

  intro.classList.add("exit");

  setTimeout(() => {

    intro.hidden = true;

    interfaz.classList.add("visible");

    interfazAbierta = true;

    iniciarAmbienteSonoro();

  }, 450);

  audioListo.then(funciona => {

    if (funciona) {

      cantoDeBienvenida();

    } else {

      // El botón de sonido permite

      // volver a intentar la activación.

      audioButton.textContent = "TOCAR PARA ACTIVAR SONIDO";

      audioButton.setAttribute("aria-pressed", "false");

    }

  });

}

intro.addEventListener("click", abrirInterfaz);

intro.addEventListener("keydown", event => {

  if (event.key === "Enter" || event.key === " ") {

    event.preventDefault();

    abrirInterfaz();

  }

});

// ========================================

// CONTROL DE SONIDO

// ========================================

audioButton.addEventListener("click", () => {

  // Si el contexto no está funcionando,

  // el toque intenta iniciarlo.

  if (

    !audioContext ||

    audioContext.state !== "running"

  ) {

    sonidoActivado = true;

    audioButton.textContent = "ACTIVANDO SONIDO...";

    activarAudio().then(funciona => {

      if (funciona) {

        audioButton.textContent = "SONIDO: ACTIVADO";

        audioButton.setAttribute("aria-pressed", "true");

        cantarAve(1);

      } else {

        audioButton.textContent =

          "TOCAR PARA ACTIVAR SONIDO";

        audioButton.setAttribute("aria-pressed", "false");

      }

    });

    return;

  }

  sonidoActivado = !sonidoActivado;

  audioButton.textContent = sonidoActivado

    ? "SONIDO: ACTIVADO"

    : "SONIDO: DESACTIVADO";

  audioButton.setAttribute(

    "aria-pressed",

    String(sonidoActivado)

  );

  if (sonidoActivado) {

    masterGain.gain.value = 0.8;

    cantarAve(1);

  } else {

    masterGain.gain.value = 0;

  }

});

// ========================================

// SINTONIZADOR

// ========================================

function actualizarFrecuencia() {

  if (senalEncontrada) return;

  const valor = Number(frequency.value);

  frequencyValue.textContent =

    valor.toFixed(1);

  const distancia = Math.abs(

    valor - FRECUENCIA_SECRETA

  );

  signalStrength = Math.max(

    0,

    1 - distancia / 35

  );

  // Reintentar desbloqueo desde

  // la interacción con el deslizador.

  if (

    sonidoActivado &&

    (!audioContext ||

     audioContext.state !== "running")

  ) {

    activarAudio();

  }

  const ahora = performance.now();

  if (ahora - ultimoCanto > 280) {

    ultimoCanto = ahora;

    cantarAve(signalStrength);

  }

  if (distancia <= 3) {

    signalStrength = 1;

    senalEncontrada = true;

    frequency.disabled = true;

    tunerStatus.textContent =

      "> SEÑAL ESTABLE / TRANSMISIÓN IDENTIFICADA";

    signalLabel.textContent =

      "CANTO DE AVE DETECTADO";

    if (temporizadorAves) {

      clearInterval(temporizadorAves);

      temporizadorAves = null;

    }

    cantoFinal();

    iniciarDescifrado();

  } else if (distancia < 15) {

    tunerStatus.textContent =

      "> SEÑAL PARCIAL / INTERFERENCIA REDUCIDA";

    signalLabel.textContent =

      "TRANSMISIÓN FRAGMENTADA";

  } else {

    tunerStatus.textContent =

      "> INTERFERENCIA / BUSCANDO TRANSMISIÓN";

    signalLabel.textContent =

      "FRECUENCIA NO IDENTIFICADA";

  }

}

// ========================================

// DESCIFRADO DE ARCHIVOS

// ========================================

function esperar(ms) {

  return new Promise(resolve => setTimeout(resolve, ms));

}

async function iniciarDescifrado() {

  systemLog.classList.add("visible");

  log.textContent = "";

  const mensajes = [

    "> SEÑAL BIOLÓGICA CONFIRMADA",

    "> INTERCEPTANDO TRANSMISIÓN...",

    "> ANALIZANDO PATRONES DE AVES...",

    "> RECUPERANDO MEMORIA TERRITORIAL...",

    "> DESCIFRANDO ARCHIVOS TEMPORALES...",

    "> 09 REGISTROS ENCONTRADOS",

    "> ACCESO AUTORIZADO"

  ];

  for (const mensaje of mensajes) {

    log.textContent += mensaje + "\n";

    await esperar(550);

  }

  await esperar(450);

  access.classList.add("visible");

}

// ========================================

// VISUALIZACIÓN DE ONDA

// ========================================

const canvas = document.getElementById("wave");

const ctx = canvas.getContext("2d");

let tiempo = 0;

function dibujarOnda() {

  if (!interfazAbierta) {

    requestAnimationFrame(dibujarOnda);

    return;

  }

  const rect = canvas.getBoundingClientRect();

  const dpr = Math.min(

    window.devicePixelRatio || 1,

    2

  );

  const ancho = Math.max(1, rect.width);

  const alto = Math.max(1, rect.height);

  const pixelWidth = Math.round(ancho * dpr);

  const pixelHeight = Math.round(alto * dpr);

  if (

    canvas.width !== pixelWidth ||

    canvas.height !== pixelHeight

  ) {

    canvas.width = pixelWidth;

    canvas.height = pixelHeight;

  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.clearRect(0, 0, ancho, alto);

  // CUADRÍCULA

  ctx.strokeStyle = "#164b29";

  ctx.lineWidth = 0.5;

  for (let x = 0; x < ancho; x += 35) {

    ctx.beginPath();

    ctx.moveTo(x, 0);

    ctx.lineTo(x, alto);

    ctx.stroke();

  }

  for (let y = 0; y < alto; y += 25) {

    ctx.beginPath();

    ctx.moveTo(0, y);

    ctx.lineTo(ancho, y);

    ctx.stroke();

  }

  // ONDA

  ctx.beginPath();

  ctx.strokeStyle = "#00ff66";

  ctx.lineWidth = 1.8;

  for (let x = 0; x < ancho; x++) {

    const centro = alto / 2;

    const amplitud = 3 + signalStrength * 40;

    const onda1 = Math.sin(

      x * 0.08 + tiempo

    );

    const onda2 = Math.sin(

      x * 0.21 - tiempo * 1.5

    );

    const envolvente =

      0.35 + 0.65 * Math.pow(

        Math.sin(x * 0.017),

        2

      );

    const y =

      centro +

      (onda1 * 0.7 + onda2 * 0.3) *

      amplitud *

      envolvente;

    if (x === 0) {

      ctx.moveTo(x, y);

    } else {

      ctx.lineTo(x, y);

    }

  }

  ctx.stroke();

  tiempo += 0.035;

  requestAnimationFrame(dibujarOnda);

}

// ========================================

// INICIAR

// ========================================

frequency.addEventListener(

  "input",

  actualizarFrecuencia

);

renderizarTitulo();

escribirTitulo();

dibujarOnda();

</script>

</body>

</html>
