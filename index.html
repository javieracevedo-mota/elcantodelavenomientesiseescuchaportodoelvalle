<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>archivo de escucha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --fg: #dfffe7;
      --green: #39ff88;
      --green-soft: rgba(57, 255, 136, 0.22);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.028) 0px,
          rgba(255,255,255,0.028) 1px,
          transparent 2px,
          transparent 4px
        );
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
      animation: flicker 4s infinite;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.12) 0.7px, transparent 0.8px);
      background-size: 8px 8px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 1;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      z-index: 3;
    }

    .title-wrap {
      cursor: pointer;
      user-select: none;
      text-align: left;
      position: relative;
      z-index: 4;
    }

    .title {
      font-size: clamp(2rem, 6vw, 5rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      white-space: pre-line;
      text-shadow: 0 0 8px var(--green-soft);
      min-height: 6em;
    }

    .title.idle {
      animation: breathe 2.8s ease-in-out infinite;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      animation: blink 0.9s steps(1) infinite;
    }

    .loader {
      margin-top: 22px;
      opacity: 0;
      transition: opacity 0.2s ease;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: flex-start;
      font-size: clamp(0.9rem, 1.3vw, 1.1rem);
      text-shadow: 0 0 8px var(--green-soft);
      min-width: 320px;
    }

    .loader.visible {
      opacity: 1;
    }

    .loader-label {
      white-space: nowrap;
    }

    .loader-percent {
      width: 4ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .loader-bar {
      width: 16ch;
      display: inline-block;
    }

    .glyph-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
      opacity: 0;
    }

    .glyph-layer.visible {
      opacity: 1;
    }

    .glyph {
      position: absolute;
      color: rgba(57,255,136,0.95);
      text-shadow:
        0 0 8px rgba(57,255,136,0.28),
        0 0 18px rgba(57,255,136,0.12);
      white-space: nowrap;
      animation: glyphPulse linear forwards;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes breathe {
      0%, 100% { text-shadow: 0 0 6px rgba(57,255,136,0.18); }
      50% { text-shadow: 0 0 14px rgba(57,255,136,0.34); }
    }

    @keyframes flicker {
      0%,100% { opacity: 0.12; }
      48% { opacity: 0.13; }
      49% { opacity: 0.08; }
      50% { opacity: 0.14; }
      51% { opacity: 0.10; }
      52% { opacity: 0.13; }
    }

    @keyframes glyphPulse {
      0% {
        opacity: 0;
        transform: scale(0.85) rotate(0deg);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0.88;
        transform: scale(1.08) rotate(0.8deg);
      }
    }

    @media (max-width: 640px) {
      .title {
        min-height: 7em;
      }

      .loader {
        min-width: 0;
        flex-wrap: wrap;
        gap: 8px 12px;
      }

      .loader-bar {
        width: 16ch;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div class="glyph-layer" id="glyphLayer"></div>

  <main class="wrap">
    <div class="title-wrap" id="titleWrap" aria-label="Abrir archivo">
      <div class="title" id="title"></div>
      <div class="loader" id="loader">
        <span class="loader-label">cargando archivo</span>
        <span class="loader-percent" id="loaderPercent">000%</span>
        <span class="loader-bar" id="loaderBar">[··············]</span>
      </div>
    </div>
  </main>

  <script>
    const REPO_BASE = "/elcantodelavenomientesiseescuchaportodoelvalle";

    const finalLines = [
      "el canto",
      "del ave no miente",
      "si se escucha",
      "por todo",
      "el valle"
    ];

    const fullText = finalLines.join("\n");

    const title = document.getElementById("title");
    const titleWrap = document.getElementById("titleWrap");
    const loader = document.getElementById("loader");
    const glyphLayer = document.getElementById("glyphLayer");

    let i = 0;
    let typingDone = false;
    let locked = false;

    const glyphs = [
      "𓅭","𓅯","𓅪","𓅬","𓅫",
      "𓆙","𓆘","𓆚",
      "𓆏","𓆉","𓆌",
      "𓇢","𓇣","𓇩",
      "≈","∿","⌇","○","°","∙",
      "/","\\","|","_","=","+","#","@","0","1",":",";","::","//","[]"
    ];

    function render(text) {
      title.innerHTML = text.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
    }

    function setFinalText() {
      title.innerHTML = fullText.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
      title.classList.add("idle");
      typingDone = true;
    }

    function typeText() {
      if (i < fullText.length) {
        render(fullText.slice(0, i + 1));
        i++;
        setTimeout(typeText, 58);
      } else {
        setFinalText();
      }
    }

    function randomChar() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&/=+*<>~?@";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function scrambleCurrentText() {
      const scrambled = [...finalLines, "_"].join("\n").split("\n").map(line =>
        line.split("").map(c => c === " " ? " " : randomChar()).join("")
      );
      title.innerHTML = scrambled.join("<br>");
    }

    function updateLoader(percent) {
      const percentEl = document.getElementById("loaderPercent");
      const barEl = document.getElementById("loaderBar");

      percentEl.textContent = String(percent).padStart(3, "0") + "%";

      const totalBars = 14;
      const filled = Math.round((percent / 100) * totalBars);

      barEl.textContent =
        "[" + "■".repeat(filled) + "·".repeat(totalBars - filled) + "]";
    }

    function createGlyph() {
      const el = document.createElement("div");
      el.className = "glyph";
      el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];

      el.style.left = Math.random() * 100 + "vw";
      el.style.top = Math.random() * 100 + "vh";
      el.style.fontSize = (12 + Math.random() * 34) + "px";
      el.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";

      glyphLayer.appendChild(el);
    }

    function fillScreenWithGlyphs() {
      glyphLayer.classList.add("visible");

      for (let i = 0; i < 260; i++) {
        setTimeout(createGlyph, i * 8);
      }

      setTimeout(() => {
        for (let i = 0; i < 140; i++) {
          setTimeout(createGlyph, i * 12);
        }
      }, 900);
    }

    function startLoadingSequence() {
      loader.classList.add("visible");
      title.classList.remove("idle");

      let percent = 0;

      function step() {
        scrambleCurrentText();
        updateLoader(percent);

        if (percent < 89) {
          percent += Math.floor(Math.random() * 8) + 4;
          if (percent > 89) percent = 89;
          setTimeout(step, 55);
          return;
        }

        if (percent < 100) {
          percent += 1;
          setTimeout(step, percent < 95 ? 190 : 320);
          return;
        }

        finishSequence();
      }

      step();
    }

    function finishSequence() {
      title.style.opacity = "0";
      loader.style.opacity = "0";
      fillScreenWithGlyphs();

      setTimeout(() => {
        window.location.href = `${REPO_BASE}/cartas.html`;
      }, 7500);
    }

    titleWrap.addEventListener("click", () => {
      if (locked || !typingDone) return;
      locked = true;
      startLoadingSequence();
    });

    typeText();
  </script>
</body>
</html>
