<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El canto del ave no miente si se escucha por todo el valle</title>

<style>

  * {

    box-sizing: border-box;

  }

  html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    background: #000000;

    color: #00ff66;

    font-family: monospace;

  }

  body {

    min-height: 100vh;

    min-height: 100dvh;

  }

  .wrap {

    min-height: 100vh;

    min-height: 100dvh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 24px;

  }

  .title-wrap {

    width: min(92vw, 900px);

    cursor: pointer;

    user-select: none;

    -webkit-tap-highlight-color: transparent;

  }

  .title {

    font-size: clamp(24px, 4.5vw, 52px);

    line-height: 1.2;

    letter-spacing: 0.02em;

    white-space: pre-wrap;

    overflow-wrap: break-word;

    text-transform: uppercase;

    color: #00ff66;

  }

  .cursor {

    animation: blink 1s steps(1) infinite;

  }

  @keyframes blink {

    50% {

      opacity: 0;

    }

  }

  .loader {

    display: none;

    margin-top: 28px;

    font-size: clamp(18px, 2.5vw, 24px);

    line-height: 1.5;

    color: #00ff66;

  }

  .loader.visible {

    display: block;

  }

  .loader-bar {

    display: block;

    margin-top: 10px;

    white-space: nowrap;

  }

  .hint {

    margin-top: 30px;

    font-size: 16px;

    opacity: 0.65;

    animation: blink 1.8s infinite;

  }

  @media (max-width: 640px) {

    .title {

      font-size: clamp(24px, 6vw, 36px);

    }

    .loader {

      font-size: 18px;

    }

  }

</style>

</head>

<body>

<main class="wrap">

  <div

    class="title-wrap"

    id="titleWrap"

    role="button"

    tabindex="0"

    aria-label="Abrir archivo"

  >

    <div class="title" id="title"></div>

    <div class="hint" id="hint" hidden>

      [ TOCA PARA ACCEDER AL ARCHIVO ]

    </div>

    <div class="loader" id="loader">

      <div>ACCEDIENDO AL ARCHIVO...</div>

      <div id="loaderPercent">000%</div>

      <span class="loader-bar" id="loaderBar">

        [··············]

      </span>

    </div>

  </div>

</main>

<script>

  const REPO_BASE =

    "/elcantodelavenomientesiseescuchaportodoelvalle";

  const finalLines = [

    "el canto",

    "del ave no miente",

    "si se escucha",

    "por todo",

    "el valle"

  ];

  const fullText = finalLines.join("\n");

  const title = document.getElementById("title");

  const titleWrap = document.getElementById("titleWrap");

  const loader = document.getElementById("loader");

  const hint = document.getElementById("hint");

  const loaderPercent =

    document.getElementById("loaderPercent");

  const loaderBar =

    document.getElementById("loaderBar");

  let index = 0;

  let typingDone = false;

  let locked = false;

  function renderTitle(text, cursor = true) {

    title.textContent = text;

    if (cursor) {

      const span = document.createElement("span");

      span.className = "cursor";

      span.textContent = "█";

      title.appendChild(span);

    }

  }

  function typeText() {

    if (index < fullText.length) {

      index++;

      renderTitle(fullText.slice(0, index));

      setTimeout(typeText, 62);

    } else {

      renderTitle(fullText);

      typingDone = true;

      hint.hidden = false;

    }

  }

  function updateLoader(percent) {

    loaderPercent.textContent =

      String(percent).padStart(3, "0") + "%";

    const total = 14;

    const filled = Math.round(percent / 100 * total);

    loaderBar.textContent =

      "[" +

      "■".repeat(filled) +

      "·".repeat(total - filled) +

      "]";

  }

  function startLoadingSequence() {

    if (locked || !typingDone) return;

    locked = true;

    hint.hidden = true;

    title.style.display = "none";

    loader.classList.add("visible");

    let percent = 0;

    updateLoader(percent);

    const interval = setInterval(() => {

      percent = Math.min(percent + 5, 100);

      updateLoader(percent);

      if (percent >= 100) {

        clearInterval(interval);

        setTimeout(() => {

          window.location.href =

            REPO_BASE + "/cartas.html";

        }, 500);

      }

    }, 65);

  }

  titleWrap.addEventListener(

    "click",

    startLoadingSequence

  );

  titleWrap.addEventListener("keydown", (event) => {

    if (event.key === "Enter" || event.key === " ") {

      event.preventDefault();

      startLoadingSequence();

    }

  });

  typeText();

</script>

</body>

</html>
