<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>archivo de escucha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #020302;
      --bg2: #071008;
      --fg: #dfffe7;
      --green: #39ff88;
      --green-soft: rgba(57, 255, 136, 0.22);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at center, rgba(57,255,136,0.08), transparent 34%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--fg);
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 1px,
          transparent 2px,
          transparent 4px
        );
      opacity: 0.13;
      pointer-events: none;
      z-index: 1;
      animation: flicker 4s infinite;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.12) 0.7px, transparent 0.8px);
      background-size: 8px 8px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 1;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(57,255,136,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,136,0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.22;
      pointer-events: none;
      z-index: 1;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      z-index: 3;
    }

    .title-wrap {
      cursor: pointer;
      user-select: none;
      text-align: left;
      position: relative;
      z-index: 4;
    }

    .title {
      font-size: clamp(2rem, 6vw, 5rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      white-space: pre-line;
      text-shadow: 0 0 8px var(--green-soft);
      min-height: 6em;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }

    .title.idle {
      animation: breathe 2.8s ease-in-out infinite;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      animation: blink 0.9s steps(1) infinite;
    }

    .loader {
      margin-top: 22px;
      font-size: clamp(0.95rem, 1.4vw, 1.1rem);
      opacity: 0;
      transition: opacity 0.2s ease;
      min-height: 1.5em;
      text-shadow: 0 0 8px var(--green-soft);
    }

    .loader.visible {
      opacity: 1;
    }

    .loader-line {
      display: inline-block;
      min-width: 18ch;
    }

    .loader-bar {
      display: inline-block;
      margin-left: 12px;
      min-width: 18ch;
    }

    .rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .rain.visible {
      opacity: 1;
    }

    .column {
      position: absolute;
      top: -120px;
      color: rgba(57,255,136,0.95);
      text-shadow: 0 0 8px rgba(57,255,136,0.28);
      white-space: pre;
      line-height: 0.9;
      animation: codefall linear forwards;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .access-box {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      border: 4px solid var(--green);
      padding: 18px 30px;
      color: var(--green);
      font-size: clamp(1.4rem, 4vw, 3.2rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(0, 20, 6, 0.55);
      box-shadow:
        0 0 20px rgba(57,255,136,0.25),
        inset 0 0 16px rgba(57,255,136,0.12);
      opacity: 0;
      z-index: 8;
      text-align: center;
      min-width: 60vw;
    }

    .access-box.show {
      animation: accessIn 0.45s ease forwards;
    }

    .flash {
      position: fixed;
      inset: 0;
      background: rgba(210, 255, 223, 0.08);
      opacity: 0;
      pointer-events: none;
      z-index: 7;
    }

    .flash.on {
      animation: flashPulse 0.35s ease;
    }

    .fadeout {
      animation: fadeToBlack 0.5s ease forwards;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes breathe {
      0%, 100% { text-shadow: 0 0 6px rgba(57,255,136,0.18); }
      50% { text-shadow: 0 0 14px rgba(57,255,136,0.34); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.12; }
      48% { opacity: 0.13; }
      49% { opacity: 0.08; }
      50% { opacity: 0.14; }
      51% { opacity: 0.10; }
      52% { opacity: 0.13; }
    }

    @keyframes codefall {
      0% {
        transform: translateY(-20vh);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(130vh);
        opacity: 0;
      }
    }

    @keyframes flashPulse {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes accessIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes fadeToBlack {
      to {
        opacity: 0;
        filter: blur(3px);
      }
    }

    @media (max-width: 640px) {
      .title {
        min-height: 7em;
      }

      .loader-bar {
        display: block;
        margin-left: 0;
        margin-top: 8px;
      }

      .access-box {
        min-width: 82vw;
        padding: 16px 18px;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div class="grid"></div>
  <div class="rain" id="rain"></div>
  <div class="flash" id="flash"></div>
  <div class="access-box" id="accessBox">acceso concedido</div>

  <main class="wrap">
    <div class="title-wrap" id="titleWrap" aria-label="Abrir archivo">
      <div class="title" id="title"></div>
      <div class="loader" id="loader">
        <span class="loader-line" id="loaderText"></span>
        <span class="loader-bar" id="loaderBar"></span>
      </div>
    </div>
  </main>

  <script>
    const finalLines = [
      "el canto",
      "del ave no miente",
      "si se escucha",
      "por todo",
      "el valle"
    ];

    const REPO_BASE = "/elcantodelavenomientesiseescuchaportodoelvalle";
    const fullText = finalLines.join("\n");

    const title = document.getElementById("title");
    const titleWrap = document.getElementById("titleWrap");
    const loader = document.getElementById("loader");
    const loaderText = document.getElementById("loaderText");
    const loaderBar = document.getElementById("loaderBar");
    const rain = document.getElementById("rain");
    const flash = document.getElementById("flash");
    const accessBox = document.getElementById("accessBox");

    let i = 0;
    let locked = false;
    let typingDone = false;

    function render(text) {
      title.innerHTML = text.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
    }

    function setFinalText() {
      title.innerHTML = fullText.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
      title.classList.add("idle");
      typingDone = true;
    }

    function typeText() {
      if (i < fullText.length) {
        render(fullText.slice(0, i + 1));
        i++;
        setTimeout(typeText, 58);
      } else {
        setFinalText();
      }
    }

    function randomChar() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&/=+*<>~?@";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function scramble() {
      const scrambled = [...finalLines, "_"].join("\n").split("\n").map(line =>
        line.split("").map(c => c === " " ? " " : randomChar()).join("")
      );
      title.innerHTML = scrambled.join("<br>");
    }

    function updateLoader(percent) {
      loaderText.textContent = `cargando archivo ${String(percent).padStart(3, "0")}%`;

      const totalBars = 14;
      const filled = Math.round((percent / 100) * totalBars);
      loaderBar.textContent = "[" + "■".repeat(filled) + "·".repeat(totalBars - filled) + "]";
    }

    function createColumn() {
      const col = document.createElement("div");
      col.className = "column";

      const glyphs = ["v","^","~","𓅭","𓅯","𓅪","𓅬","𓅫","𓆏","𓆙","𓆌","/","\\","|","_","=","+","*"];
      let content = "";

      const length = Math.floor(Math.random() * 20) + 12;
      for (let n = 0; n < length; n++) {
        content += glyphs[Math.floor(Math.random() * glyphs.length)];
      }

      col.textContent = content;
      col.style.left = Math.random() * 100 + "vw";
      col.style.fontSize = (14 + Math.random() * 18) + "px";
      col.style.animationDuration = (1.6 + Math.random() * 2.2) + "s";
      col.style.opacity = (0.45 + Math.random() * 0.5).toFixed(2);

      rain.appendChild(col);
      setTimeout(() => col.remove(), 4500);
    }

    function startLoadingSequence() {
      loader.classList.add("visible");
      title.classList.remove("idle");
      title.innerHTML = title.innerHTML.replace('<span class="cursor">_</span>', '');

      let percent = 0;

      function step() {
        updateLoader(percent);

        if (percent < 89) {
          percent += Math.floor(Math.random() * 8) + 4;
          if (percent > 89) percent = 89;
          setTimeout(step, 45);
          return;
        }

        if (percent < 100) {
          percent += 1;
          setTimeout(step, percent < 95 ? 180 : 320);
          return;
        }

        finishSequence();
      }

      step();
    }

    function finishSequence() {
      flash.classList.remove("on");
      void flash.offsetWidth;
      flash.classList.add("on");

      let count = 0;
      const interval = setInterval(() => {
        scramble();
        count++;
        if (count > 24) clearInterval(interval);
      }, 55);

      rain.classList.add("visible");

      for (let j = 0; j < 160; j++) {
        setTimeout(createColumn, j * 18);
      }

      setTimeout(() => {
        accessBox.classList.add("show");
      }, 950);

      setTimeout(() => {
        document.querySelector(".wrap").classList.add("fadeout");
        loader.classList.add("fadeout");
      }, 1900);

      setTimeout(() => {
        window.location.href = `${REPO_BASE}/cartas.html`;
      }, 2600);
    }

    titleWrap.addEventListener("click", () => {
      if (locked || !typingDone) return;
      locked = true;
      startLoadingSequence();
    });

    typeText();
  </script>
</body>
</html>
