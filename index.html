<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>archivo de escucha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --fg: #dfffe7;
      --green: #39ff88;
      --green-soft: rgba(57, 255, 136, 0.22);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 1px,
          transparent 2px,
          transparent 4px
        );
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
      animation: flicker 4s infinite;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.12) 0.7px, transparent 0.8px);
      background-size: 8px 8px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 1;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      z-index: 3;
    }

    .title-wrap {
      cursor: pointer;
      user-select: none;
      text-align: left;
      position: relative;
      z-index: 4;
    }

    .title {
      font-size: clamp(2rem, 6vw, 5rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      white-space: pre-line;
      text-shadow: 0 0 8px var(--green-soft);
      min-height: 6em;
    }

    .title.idle {
      animation: breathe 2.8s ease-in-out infinite;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      animation: blink 0.9s steps(1) infinite;
    }

    .loader {
      margin-top: 22px;
      font-size: clamp(0.95rem, 1.4vw, 1.1rem);
      opacity: 0;
      transition: opacity 0.2s ease;
      min-height: 1.5em;
      text-shadow: 0 0 8px var(--green-soft);
    }

    .loader.visible {
      opacity: 1;
    }

    .rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
      opacity: 0;
    }

    .rain.visible {
      opacity: 1;
    }

    .column {
      position: absolute;
      top: -140px;
      color: rgba(57,255,136,0.95);
      text-shadow:
        0 0 8px rgba(57,255,136,0.3),
        0 0 20px rgba(57,255,136,0.15);
      writing-mode: vertical-rl;
      font-size: 14px;
      animation: codefall linear forwards;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes breathe {
      0%,100% { text-shadow: 0 0 6px rgba(57,255,136,0.2); }
      50% { text-shadow: 0 0 16px rgba(57,255,136,0.4); }
    }

    @keyframes flicker {
      0%,100% { opacity: 0.12; }
      50% { opacity: 0.08; }
    }

    @keyframes codefall {
      0% {
        transform: translateY(-20vh);
        opacity: 0;
      }
      10% { opacity: 1; }
      100% {
        transform: translateY(140vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div class="rain" id="rain"></div>

  <main class="wrap">
    <div class="title-wrap" id="titleWrap">
      <div class="title" id="title"></div>
      <div class="loader" id="loader"></div>
    </div>
  </main>

  <script>
    const REPO_BASE = "/elcantodelavenomientesiseescuchaportodoelvalle";

    const lines = [
      "el canto",
      "del ave no miente",
      "si se escucha",
      "por todo",
      "el valle"
    ];

    const title = document.getElementById("title");
    const rain = document.getElementById("rain");
    const loader = document.getElementById("loader");

    let i = 0;
    let done = false;
    let locked = false;

    function render(text){
      title.innerHTML = text.replace(/\n/g,"<br>") + '<span class="cursor">_</span>';
    }

    function type(){
      const full = lines.join("\n");
      if(i < full.length){
        render(full.slice(0,i+1));
        i++;
        setTimeout(type,60);
      } else {
        done = true;
        title.classList.add("idle");
      }
    }

    function createColumn(){
      const el = document.createElement("div");
      el.className = "column";

      const glyphs = [
        "𓅭","𓅯","𓅪","𓅬","𓅫",
        "𓆏","𓆙","𓆉",
        "v","^","~","/","\\","|","=","+","*","#","@","0","1"
      ];

      let str = "";
      const len = Math.floor(Math.random()*25)+20;

      for(let i=0;i<len;i++){
        str += glyphs[Math.floor(Math.random()*glyphs.length)];
      }

      el.textContent = str;
      el.style.left = Math.random()*100 + "vw";
      el.style.animationDuration = (2 + Math.random()*4) + "s";

      rain.appendChild(el);
      setTimeout(()=>el.remove(),6000);
    }

    function chaos(){
      rain.classList.add("visible");

      for(let i=0;i<350;i++){
        setTimeout(createColumn, i*15);
      }

      setTimeout(()=>{
        window.location.href = `${REPO_BASE}/cartas.html`;
      }, 7500);
    }

    document.getElementById("titleWrap").onclick = ()=>{
      if(!done || locked) return;
      locked = true;
      title.innerHTML = "";
      loader.classList.add("visible");
      chaos();
    };

    type();
  </script>
</body>
</html>
