<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>el canto del ave no miente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(120, 255, 170, 0.07), transparent 30%),
        linear-gradient(180deg, #020302 0%, #080b08 100%);
      color: #eaffee;
      overflow: hidden;
      position: relative;
      font-family: 'Share Tech Mono', monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 2px,
        transparent 4px
      );
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.16) 0.7px, transparent 0.8px);
      background-size: 8px 8px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 1;
    }

    .wrap {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .title-wrap {
      cursor: pointer;
      user-select: none;
      text-align: left;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5.8vw, 5.4rem);
      line-height: 1.05;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      white-space: pre-line;
      min-height: 6em;
      text-shadow: 0 0 10px rgba(117, 255, 157, 0.12);
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .bird {
      position: absolute;
      color: rgba(235, 255, 241, 0.95);
      white-space: nowrap;
      animation: fly linear forwards;
      text-shadow: 0 0 10px rgba(117, 255, 157, 0.22);
    }

    @keyframes fly {
      0% {
        transform: translateX(-20vw) translateY(0) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      8% {
        opacity: 1;
      }
      100% {
        transform: translateX(120vw) translateY(-60px) scale(1.15) rotate(4deg);
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      .title {
        min-height: 7em;
        letter-spacing: 0.04em;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="sky" id="sky"></div>

  <main class="wrap">
    <div class="title-wrap" id="titleWrap">
      <div class="title" id="title"></div>
    </div>
  </main>

  <script>
    const finalLines = [
      "el canto",
      "del ave no miente",
      "si se escucha",
      "por todo",
      "el valle_"
    ];

    const fullText = finalLines.join("\n");
    const title = document.getElementById("title");
    const titleWrap = document.getElementById("titleWrap");
    const sky = document.getElementById("sky");

    let i = 0;
    let locked = false;

    function renderTyped(text) {
      title.innerHTML = text.replace(/\n/g, "<br>") + '<span class="cursor">_</span>';
    }

    function typeText() {
      if (i < fullText.length) {
        renderTyped(fullText.slice(0, i + 1));
        i++;
        setTimeout(typeText, 55);
      } else {
        title.innerHTML = fullText.replace(/\n/g, "<br>");
      }
    }

    function randomChar() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&/=+*<>~?@";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function scrambleText() {
      const scrambled = finalLines.map(line =>
        line.split("").map(ch => ch === " " ? " " : randomChar()).join("")
      );
      title.innerHTML = scrambled.join("<br>");
    }

    function createBird() {
      const bird = document.createElement("div");
      bird.className = "bird";

      const symbols = [
        "v", "V", "^", "~", "𓅭", "𓅯", "𓅪", "𓅬", "𓅫",
        "vv", "^^", "~v~", "v~v", "𓅭𓅯", "𓅪𓅪", "v v v"
      ];

      bird.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      bird.style.top = (Math.random() * 90) + "%";
      bird.style.left = "-25vw";
      bird.style.fontSize = (14 + Math.random() * 34) + "px";
      bird.style.animationDuration = (1.3 + Math.random() * 2.4) + "s";

      sky.appendChild(bird);

      setTimeout(() => {
        bird.remove();
      }, 4200);
    }

    titleWrap.addEventListener("click", () => {
      if (locked) return;
      locked = true;

      let scrambleCount = 0;
      const scrambleInterval = setInterval(() => {
        scrambleText();
        scrambleCount++;
        if (scrambleCount > 22) {
          clearInterval(scrambleInterval);
        }
      }, 60);

      for (let b = 0; b < 120; b++) {
        setTimeout(createBird, b * 18);
      }

      setTimeout(() => {
        window.location.href = "cartas.html";
      }, 2100);
    });

    typeText();
  </script>
</body>
</html>
