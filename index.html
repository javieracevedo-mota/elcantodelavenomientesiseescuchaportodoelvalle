<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El canto del ave no miente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #d8ffd8;
      font-family: Georgia, serif;
      padding: 24px;
      overflow: hidden;
    }

    .portada {
      text-align: center;
      max-width: 900px;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: normal;
      line-height: 1.15;
      letter-spacing: 0.02em;
      text-transform: lowercase;
    }

    .entrar {
      margin-top: 24px;
      font-size: 1rem;
      opacity: 0.8;
    }

    .cielo {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .ave {
      position: absolute;
      color: rgba(216, 255, 216, 0.75);
      font-size: 24px;
      animation: volar 3s linear forwards;
      white-space: pre;
    }

    @keyframes volar {
      0% {
        transform: translateX(-10vw) translateY(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateX(110vw) translateY(-40px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="cielo" id="cielo"></div>

  <main class="portada" id="portada">
    <h1>el canto del ave no miente si se escucha por todo el valle</h1>
    <div class="entrar">toca para entrar al archivo</div>
  </main>

  <script>
    const portada = document.getElementById("portada");
    const cielo = document.getElementById("cielo");

    const caracteres = ["v", "~", "^", "𓅭", "𓅯", "𓅪"];

    function crearAve() {
      const ave = document.createElement("div");
      ave.className = "ave";
      ave.textContent = caracteres[Math.floor(Math.random() * caracteres.length)];
      ave.style.top = Math.random() * 80 + "%";
      ave.style.left = "-10vw";
      ave.style.fontSize = (18 + Math.random() * 20) + "px";
      ave.style.animationDuration = (1.8 + Math.random() * 1.8) + "s";
      cielo.appendChild(ave);

      setTimeout(() => {
        ave.remove();
      }, 3200);
    }

    portada.addEventListener("click", () => {
      for (let i = 0; i < 24; i++) {
        setTimeout(crearAve, i * 70);
      }

      setTimeout(() => {
        window.location.href = "cartas.html";
      }, 2200);
    });
  </script>
</body>
</html>
