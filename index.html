<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El canto del ave no miente si se escucha por todo el valle</title>

<style>

* {

  box-sizing: border-box;

}

:root {

  --verde: #00ff66;

  --verde-oscuro: #164b29;

  --verde-suave: #8bd9a2;

}

html, body {

  margin: 0;

  min-height: 100%;

  background: #000;

  color: var(--verde);

  font-family: monospace;

}

body {

  min-height: 100vh;

  min-height: 100dvh;

}

body::before {

  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: 10;

  background: repeating-linear-gradient(

    to bottom,

    transparent 0px,

    transparent 3px,

    rgba(0,255,102,0.035) 4px

  );

}

.terminal {

  width: min(100%, 950px);

  min-height: 100vh;

  min-height: 100dvh;

  margin: auto;

  padding: 26px 24px 50px;

  display: flex;

  flex-direction: column;

  justify-content: center;

}

/* PANTALLA INICIAL */

.intro {

  cursor: pointer;

  user-select: none;

  -webkit-tap-highlight-color: transparent;

}

.intro:focus-visible {

  outline: 1px solid var(--verde);

  outline-offset: 8px;

}

.title {

  margin: 0;

  font-size: clamp(24px, 5vw, 48px);

  font-weight: normal;

  line-height: 1.15;

  text-transform: uppercase;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  text-decoration: none;

}

/* CURSOR ANCHO SIN GUION */

.cursor {

  display: inline-block;

  width: 0.6em;

  height: 0.85em;

  margin-left: 2px;

  vertical-align: -0.08em;

  background: var(--verde);

  border: 0;

  text-decoration: none;

  animation: blink 1s steps(1) infinite;

}

@keyframes blink {

  50% { opacity: 0; }

}

.hint {

  margin-top: 32px;

  font-size: 15px;

  color: var(--verde-suave);

  animation: hintBlink 1.8s infinite;

}

@keyframes hintBlink {

  50% { opacity: 0.3; }

}

[hidden] {

  display: none !important;

}

/* TRANSICIONES */

.intro.exit {

  animation: disappear 0.45s ease forwards;

}

@keyframes disappear {

  to {

    opacity: 0;

    transform: translateY(-12px);

  }

}

.interface {

  display: none;

  animation: appear 0.6s ease forwards;

}

.interface.visible {

  display: block;

}

@keyframes appear {

  from {

    opacity: 0;

    transform: translateY(12px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

/* SINTONIZADOR */

.screen {

  border: 1px solid var(--verde-oscuro);

  padding: 22px;

  margin-bottom: 22px;

}

#wave {

  display: block;

  width: 100%;

  height: 150px;

}

.signal-label {

  margin-top: 14px;

  font-size: 12px;

  text-align: center;

  letter-spacing: 0.08em;

  color: var(--verde-suave);

}

.tuner {

  margin-top: 32px;

}

.tuner-title {

  font-size: 15px;

  margin-bottom: 18px;

}

.tuner-row {

  display: flex;

  align-items: center;

  gap: 16px;

}

input[type="range"] {

  width: 100%;

  accent-color: var(--verde);

  cursor: pointer;

  touch-action: pan-x;

}

input[type="range"]:disabled {

  opacity: 0.65;

}

.frequency {

  min-width: 65px;

  font-size: 18px;

  text-align: right;

}

.tuner-status {

  min-height: 40px;

  margin-top: 18px;

  color: var(--verde-suave);

  font-size: 13px;

  line-height: 1.6;

}

/* SONIDO */

.audio-control {

  display: flex;

  justify-content: flex-end;

  margin-top: 16px;

}

.audio-control button {

  border: 1px solid var(--verde-oscuro);

  color: var(--verde-suave);

  background: transparent;

  padding: 10px 12px;

  font: inherit;

  font-size: 12px;

  cursor: pointer;

}

.audio-control button:hover,

.audio-control button:focus-visible {

  border-color: var(--verde);

}

/* REGISTRO DEL SISTEMA */

.system-log {

  display: none;

  border: 1px solid var(--verde-oscuro);

  padding: 22px;

}

.system-log.visible {

  display: block;

}

.screen-heading {

  margin: 0 0 20px;

  font-size: 14px;

  font-weight: normal;

}

.log {

  min-height: 80px;

  white-space: pre-wrap;

  font-size: 14px;

  line-height: 1.8;

}

.access {

  display: none;

  margin-top: 24px;

}

.access.visible {

  display: block;

}

.access a {

  display: block;

  border: 1px solid var(--verde);

  color: var(--verde);

  text-decoration: none;

  padding: 15px 18px;

  font-size: 16px;

  text-align: center;

}

.access a:hover,

.access a:focus-visible {

  background: #003319;

}

@media (max-width: 640px) {

  .terminal {

    padding: 24px 16px 40px;

  }

  .title {

    font-size: clamp(24px, 6vw, 36px);

  }

  .screen,

  .system-log {

    padding: 15px;

  }

  #wave {

    height: 120px;

  }

  .tuner-title {

    font-size: 13px;

  }

  .frequency {

    min-width: 55px;

    font-size: 16px;

  }

}

@media (prefers-reduced-motion: reduce) {

  .intro.exit,

  .interface.visible {

    animation-duration: 0.01ms;

  }

}

</style>

</head>

<body>

<main class="terminal">

  <!-- PANTALLA 1: TÍTULO -->

  <div

    class="intro"

    id="intro"

    role="button"

    tabindex="0"

    aria-label="Acceder al sistema"

  >

    <h1 class="title" id="title"></h1>

    <div class="hint" id="hint" hidden>

      [ TOCA PARA ACCEDER ]

    </div>

  </div>

  <!-- PANTALLA 2: SINTONIZADOR -->

  <div class="interface" id="interface">

    <section class="screen">

      <canvas

        id="wave"

        aria-label="Visualización de señal"

        role="img"

      ></canvas>

      <div class="signal-label" id="signalLabel">

        FRECUENCIA NO IDENTIFICADA

      </div>

      <div class="tuner">

        <div class="tuner-title">

          [ SINTONIZAR FRECUENCIA ]

        </div>

        <div class="tuner-row">

          <input

            id="frequency"

            type="range"

            min="0"

            max="100"

            value="12"

            step="1"

            aria-label="Sintonizar frecuencia"

          >

          <span class="frequency" id="frequencyValue">

            12.0

          </span>

        </div>

        <div class="tuner-status" id="tunerStatus">

          &gt; BUSCANDO TRANSMISIÓN...

        </div>

        <div class="audio-control">

          <button

            id="audioButton"

            type="button"

            aria-pressed="true"

          >

            SONIDO: ACTIVADO

          </button>

        </div>

      </div>

    </section>

    <!-- DESCIFRADO -->

    <section class="system-log" id="systemLog">

      <h2 class="screen-heading">

        [ REGISTRO DEL SISTEMA ]

      </h2>

      <div class="log" id="log" aria-live="polite"></div>

      <div class="access" id="access">

        <a href="cartas.html">

          [ ACCEDER A LOS ARCHIVOS → ]

        </a>

      </div>

    </section>

  </div>

</main>

<script>

// =====================================

// CONFIGURACIÓN GENERAL

// =====================================

const TITULO = [

  "EL CANTO",

  "DEL AVE NO MIENTE",

  "SI SE ESCUCHA",

  "POR TODO",

  "EL VALLE"

].join("\n");

const FRECUENCIA_SECRETA = 73;

const intro = document.getElementById("intro");

const title = document.getElementById("title");

const hint = document.getElementById("hint");

const interfaz = document.getElementById("interface");

const frequency = document.getElementById("frequency");

const frequencyValue = document.getElementById("frequencyValue");

const tunerStatus = document.getElementById("tunerStatus");

const signalLabel = document.getElementById("signalLabel");

const systemLog = document.getElementById("systemLog");

const log = document.getElementById("log");

const access = document.getElementById("access");

const audioButton = document.getElementById("audioButton");

let escrituraTerminada = false;

let transicionIniciada = false;

let interfazAbierta = false;

let senalEncontrada = false;

let signalStrength = 0;

let sonidoActivado = true;

let ultimoCanto = 0;

let temporizadorAves = null;

// =====================================

// ESCRITURA DEL TÍTULO

// =====================================

let titleIndex = 0;

function renderizarTitulo() {

  title.textContent = TITULO.slice(0, titleIndex);

  const cursor = document.createElement("span");

  cursor.className = "cursor";

  cursor.setAttribute("aria-hidden", "true");

  title.appendChild(cursor);

}

function escribirTitulo() {

  if (titleIndex < TITULO.length) {

    titleIndex++;

    renderizarTitulo();

    setTimeout(escribirTitulo, 62);

  } else {

    escrituraTerminada = true;

    renderizarTitulo();

    hint.hidden = false;

  }

}

// =====================================

// AUDIO WAV

// =====================================

// Genera archivos WAV válidos directamente

// en el navegador, sin Web Audio API.

const SAMPLE_RATE = 22050;

function escribirTexto(view, offset, texto) {

  for (let i = 0; i < texto.length; i++) {

    view.setUint8(

      offset + i,

      texto.charCodeAt(i)

    );

  }

}

function crearWAV(muestras) {

  const cantidad = muestras.length;

  const buffer = new ArrayBuffer(

    44 + cantidad * 2

  );

  const view = new DataView(buffer);

  escribirTexto(view, 0, "RIFF");

  view.setUint32(

    4,

    36 + cantidad * 2,

    true

  );

  escribirTexto(view, 8, "WAVE");

  escribirTexto(view, 12, "fmt ");

  view.setUint32(16, 16, true);

  view.setUint16(20, 1, true);

  view.setUint16(22, 1, true);

  view.setUint32(24, SAMPLE_RATE, true);

  view.setUint32(28, SAMPLE_RATE * 2, true);

  view.setUint16(32, 2, true);

  view.setUint16(34, 16, true);

  escribirTexto(view, 36, "data");

  view.setUint32(

    40,

    cantidad * 2,

    true

  );

  for (let i = 0; i < cantidad; i++) {

    const muestra = Math.max(

      -1,

      Math.min(1, muestras[i])

    );

    view.setInt16(

      44 + i * 2,

      Math.round(muestra * 32767),

      true

    );

  }

  return new Blob(

    [buffer],

    { type: "audio/wav" }

  );

}

// =====================================

// SÍNTESIS DE CANTOS DIGITALES

// =====================================

function crearCantoAve(intensidad = 0.5) {

  const duracion = 0.9;

  const cantidad = Math.floor(

    SAMPLE_RATE * duracion

  );

  const muestras = new Float32Array(cantidad);

  const base = 700 + intensidad * 850;

  const volumen = 0.18 + intensidad * 0.20;

  const notas = [

    { inicio: 0.04, fin: 0.18, f1: 1.0, f2: 1.65 },

    { inicio: 0.23, fin: 0.36, f1: 1.45, f2: 0.90 },

    { inicio: 0.43, fin: 0.67, f1: 1.10, f2: 1.85 },

    { inicio: 0.70, fin: 0.84, f1: 1.50, f2: 1.15 }

  ];

  for (const nota of notas) {

    const inicio = Math.floor(

      nota.inicio * SAMPLE_RATE

    );

    const fin = Math.floor(

      nota.fin * SAMPLE_RATE

    );

    let fase = 0;

    for (let i = inicio; i < fin; i++) {

      const progreso =

        (i - inicio) / (fin - inicio);

      const frecuencia =

        base *

        (

          nota.f1 +

          (nota.f2 - nota.f1) *

          progreso

        );

      fase +=

        2 * Math.PI *

        frecuencia / SAMPLE_RATE;

      // Envolvente para evitar clics

      const envolvente = Math.pow(

        Math.sin(Math.PI * progreso),

        1.3

      );

      const vibrato =

        Math.sin(progreso * Math.PI * 18) *

        0.12;

      muestras[i] +=

        Math.sin(fase + vibrato) *

        envolvente *

        volumen;

    }

  }

  return crearWAV(muestras);

}

// Canto especial al encontrar la señal

function crearCantoFinal() {

  const duracion = 2.3;

  const cantidad = Math.floor(

    SAMPLE_RATE * duracion

  );

  const muestras = new Float32Array(cantidad);

  const notas = [

    [0.05, 0.28, 950, 1450],

    [0.36, 0.56, 1250, 1900],

    [0.67, 0.91, 1100, 1700],

    [1.02, 1.27, 1450, 2250],

    [1.40, 1.65, 1300, 1950],

    [1.80, 2.17, 1650, 2600]

  ];

  for (const nota of notas) {

    const [inicio, fin, f1, f2] = nota;

    const iInicio = Math.floor(

      inicio * SAMPLE_RATE

    );

    const iFin = Math.floor(

      fin * SAMPLE_RATE

    );

    let fase = 0;

    for (let i = iInicio; i < iFin; i++) {

      const progreso =

        (i - iInicio) / (iFin - iInicio);

      const frecuencia =

        f1 + (f2 - f1) * progreso;

      fase +=

        2 * Math.PI *

        frecuencia / SAMPLE_RATE;

      const envolvente = Math.sin(

        Math.PI * progreso

      );

      muestras[i] +=

        Math.sin(fase) *

        envolvente *

        0.4;

    }

  }

  return crearWAV(muestras);

}

// =====================================

// REPRODUCTOR HTML

// =====================================

// Un único elemento de audio evita

// acumular reproductores en el navegador.

const reproductor = document.createElement("audio");

reproductor.preload = "auto";

reproductor.playsInline = true;

reproductor.setAttribute("playsinline", "");

let urlAudioActual = null;

let generacionAudio = 0;

function detenerAudio() {

  generacionAudio++;

  reproductor.pause();

  if (urlAudioActual) {

    URL.revokeObjectURL(urlAudioActual);

    urlAudioActual = null;

  }

  reproductor.removeAttribute("src");

  reproductor.load();

}

function reproducirWAV(blob) {

  if (!sonidoActivado) return;

  const generacion = ++generacionAudio;

  reproductor.pause();

  if (urlAudioActual) {

    URL.revokeObjectURL(urlAudioActual);

  }

  urlAudioActual = URL.createObjectURL(blob);

  reproductor.src = urlAudioActual;

  reproductor.volume = 1;

  const resultado = reproductor.play();

  if (resultado && typeof resultado.catch === "function") {

    resultado.catch(error => {

      if (generacion !== generacionAudio) return;

      console.warn(

        "No se pudo reproducir el canto:",

        error

      );

      audioButton.textContent =

        "TOCAR PARA ACTIVAR SONIDO";

    });

  }

}

// Preparamos tres variaciones para

// no generar archivos en cada intervalo.

const cantos = [

  crearCantoAve(0.15),

  crearCantoAve(0.55),

  crearCantoAve(1)

];

const cantoDescifrado = crearCantoFinal();

function cantarAve(intensidad = 0.5) {

  if (!sonidoActivado || senalEncontrada) {

    return;

  }

  let indice = 0;

  if (intensidad >= 0.75) {

    indice = 2;

  } else if (intensidad >= 0.35) {

    indice = 1;

  }

  reproducirWAV(cantos[indice]);

}

function cantoFinal() {

  if (!sonidoActivado) return;

  reproducirWAV(cantoDescifrado);

}

// =====================================

// AMBIENTE SONORO

// =====================================

function iniciarAmbienteSonoro() {

  if (temporizadorAves) return;

  temporizadorAves = setInterval(() => {

    if (

      !interfazAbierta ||

      !sonidoActivado ||

      senalEncontrada

    ) {

      return;

    }

    // Evitar interrumpir cantos

    // que todavía se están reproduciendo.

    if (!reproductor.paused &&

        !reproductor.ended) {

      return;

    }

    const probabilidad =

      0.24 + signalStrength * 0.70;

    if (Math.random() < probabilidad) {

      cantarAve(signalStrength);

    }

  }, 1100);

}

// =====================================

// TRANSICIÓN DE PANTALLAS

// =====================================

function abrirInterfaz() {

  if (

    !escrituraTerminada ||

    transicionIniciada

  ) {

    return;

  }

  transicionIniciada = true;

  // Iniciamos el WAV durante el toque,

  // tal como en la prueba que funcionó.

  cantarAve(0.85);

  hint.hidden = true;

  intro.classList.add("exit");

  setTimeout(() => {

    intro.hidden = true;

    interfaz.classList.add("visible");

    interfazAbierta = true;

    iniciarAmbienteSonoro();

  }, 450);

}

intro.addEventListener("click", abrirInterfaz);

intro.addEventListener("keydown", event => {

  if (

    event.key === "Enter" ||

    event.key === " "

  ) {

    event.preventDefault();

    abrirInterfaz();

  }

});

// =====================================

// BOTÓN DE SONIDO

// =====================================

audioButton.addEventListener("click", () => {

  if (sonidoActivado) {

    sonidoActivado = false;

    detenerAudio();

    audioButton.textContent =

      "SONIDO: DESACTIVADO";

    audioButton.setAttribute(

      "aria-pressed",

      "false"

    );

  } else {

    sonidoActivado = true;

    audioButton.textContent =

      "SONIDO: ACTIVADO";

    audioButton.setAttribute(

      "aria-pressed",

      "true"

    );

    if (senalEncontrada) {

      cantoFinal();

    } else {

      cantarAve(signalStrength);

    }

  }

});

// =====================================

// SINTONIZADOR

// =====================================

function actualizarFrecuencia() {

  if (senalEncontrada) return;

  const valor = Number(frequency.value);

  frequencyValue.textContent =

    valor.toFixed(1);

  const distancia = Math.abs(

    valor - FRECUENCIA_SECRETA

  );

  signalStrength = Math.max(

    0,

    1 - distancia / 35

  );

  const ahora = performance.now();

  // Sonido durante la búsqueda.

  // Se limita la frecuencia de reproducción.

  if (

    sonidoActivado &&

    ahora - ultimoCanto > 1100 &&

    (reproductor.paused || reproductor.ended)

  ) {

    ultimoCanto = ahora;

    cantarAve(signalStrength);

  }

  if (distancia <= 3) {

    signalStrength = 1;

    senalEncontrada = true;

    frequency.disabled = true;

    tunerStatus.textContent =

      "> SEÑAL ESTABLE / TRANSMISIÓN IDENTIFICADA";

    signalLabel.textContent =

      "CANTO DE AVE DETECTADO";

    if (temporizadorAves) {

      clearInterval(temporizadorAves);

      temporizadorAves = null;

    }

    cantoFinal();

    iniciarDescifrado();

  } else if (distancia < 15) {

    tunerStatus.textContent =

      "> SEÑAL PARCIAL / INTERFERENCIA REDUCIDA";

    signalLabel.textContent =

      "TRANSMISIÓN FRAGMENTADA";

  } else {

    tunerStatus.textContent =

      "> INTERFERENCIA / BUSCANDO TRANSMISIÓN";

    signalLabel.textContent =

      "FRECUENCIA NO IDENTIFICADA";

  }

}

// =====================================

// REGISTRO DEL SISTEMA

// =====================================

function esperar(ms) {

  return new Promise(resolve => setTimeout(resolve, ms));

}

async function iniciarDescifrado() {

  systemLog.classList.add("visible");

  log.textContent = "";

  const mensajes = [

    "> SEÑAL BIOLÓGICA CONFIRMADA",

    "> INTERCEPTANDO TRANSMISIÓN...",

    "> ANALIZANDO PATRONES DE AVES...",

    "> RECUPERANDO MEMORIA TERRITORIAL...",

    "> DESCIFRANDO ARCHIVOS TEMPORALES...",

    "> 09 REGISTROS ENCONTRADOS",

    "> ACCESO AUTORIZADO"

  ];

  for (const mensaje of mensajes) {

    log.textContent += mensaje + "\n";

    await esperar(550);

  }

  await esperar(450);

  access.classList.add("visible");

}

// =====================================

// ONDA ANIMADA

// =====================================

const canvas = document.getElementById("wave");

const ctx = canvas.getContext("2d");

let tiempo = 0;

function dibujarOnda() {

  if (!interfazAbierta) {

    requestAnimationFrame(dibujarOnda);

    return;

  }

  const rect = canvas.getBoundingClientRect();

  const dpr = Math.min(

    window.devicePixelRatio || 1,

    2

  );

  const ancho = Math.max(1, rect.width);

  const alto = Math.max(1, rect.height);

  const pixelWidth = Math.round(ancho * dpr);

  const pixelHeight = Math.round(alto * dpr);

  if (

    canvas.width !== pixelWidth ||

    canvas.height !== pixelHeight

  ) {

    canvas.width = pixelWidth;

    canvas.height = pixelHeight;

  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.clearRect(0, 0, ancho, alto);

  // CUADRÍCULA

  ctx.strokeStyle = "#164b29";

  ctx.lineWidth = 0.5;

  for (let x = 0; x < ancho; x += 35) {

    ctx.beginPath();

    ctx.moveTo(x, 0);

    ctx.lineTo(x, alto);

    ctx.stroke();

  }

  for (let y = 0; y < alto; y += 25) {

    ctx.beginPath();

    ctx.moveTo(0, y);

    ctx.lineTo(ancho, y);

    ctx.stroke();

  }

  // ONDA DE SEÑAL

  ctx.beginPath();

  ctx.strokeStyle = "#00ff66";

  ctx.lineWidth = 1.8;

  for (let x = 0; x < ancho; x++) {

    const centro = alto / 2;

    const amplitud = 3 + signalStrength * 40;

    const onda1 = Math.sin(

      x * 0.08 + tiempo

    );

    const onda2 = Math.sin(

      x * 0.21 - tiempo * 1.5

    );

    const envolvente =

      0.35 + 0.65 * Math.pow(

        Math.sin(x * 0.017),

        2

      );

    const y =

      centro +

      (onda1 * 0.7 + onda2 * 0.3) *

      amplitud *

      envolvente;

    if (x === 0) {

      ctx.moveTo(x, y);

    } else {

      ctx.lineTo(x, y);

    }

  }

  ctx.stroke();

  tiempo += 0.035;

  requestAnimationFrame(dibujarOnda);

}

// =====================================

// INICIAR

// =====================================

frequency.addEventListener(

  "input",

  actualizarFrecuencia

);

renderizarTitulo();

escribirTitulo();

dibujarOnda();

</script>

</body>

</html>
