<script>
// ENCABEZADO DEL ARCHIVO
const encabezado =`ARCHIVO INTERCEPTADO

// CONTENIDO DE LA CARTA

const mensaje = `[INICIO DEL MENSAJE]

Me infiltré en una empresa de nanotecnología

empieza a disolverse.

No me cura.

no es natural.

Como se siembra
una

cruel 
en ver cómo una mente 
se deshace lentamente.

Después los rostros.
Después los lugares.
Tus caricias

lo único que queda es una sensación vaga de haber amado algo.

El valle también está perdiendo la memoria.
Sus cerros ya no se reconocen.

Sus ríos ya no saben por dónde corrían.
Eso fue el desmantelamiento silencioso del territorio.
Le arrancaron las neuronas a un cerebro sin dueño.

Una lobotomía hecha con ductos, refinerías y aguas negras.

nosotros también nos estamos olvidando. 

Por eso decidí dejar de escribirte.
No porque no quiera encontrarte.
Sino porque creo que mis mensajes
llegaron 
demasiado 
tarde.

Quizá ya me olvidaste.

ya empezaste a olvidarme.

A veces recuerdo
cuando buscábamos lugares
para sentarnos lejos de todos.
Y pensar que podríamos escapar a tu pasado 
En Miami
Irnos al norte y cuidarnos 
uno al otro al pasar por el desierto

Recuerdo los atardeceres que veíamos

Voy a quedarme aquí.
Entre archivos, códigos y bacterias robadas.

Voy a convertirme
en a 
un espía.

Siendo travesti de noche para besar a mis víctimas
Uno que se mueve entre tiempos sin dejar rastro.

Alguien que guarda secretos para que algún día
alguien más pueda encontrarlos.

Por eso
escondí todos mis mensajes
en los patrones
de las aves.

Ellas siempre llegaban
a tus milpas.

Sin pedir permiso.

Se posaban

Espero que esos cantos me mantengan en ti

Te mantengan en mi

verte

.
.

.

.

)

// ELEMENTOS DE LA PÁGINA

const output = document.getElementById("output");

const cursor = document.getElementById("cursor");

const nav = document.getElementById("nav");

// CONFIGURACIÓN

const VELOCIDAD = 30;

const DURACION_DESCIFRADO = 3000;

const VELOCIDAD_DESCIFRADO = 55;

const caracteresAleatorios =

  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

  "abcdefghijklmnopqrstuvwxyz" +

  "0123456789#$%&/=?+*<>@";

const cambios = {

  o: "0",

  O: "0",

  a: "4",

  A: "4",

  e: "3",

  E: "3",

  i: "1",

  I: "1"

};

let indice = 0;

let interferenciaMostrada = false;

let salida = "";

let intervaloDescifrado = null;

// GENERAR UN CARÁCTER ALEATORIO

function caracterAleatorio() {

  const posicion = Math.floor(

    Math.random() * caracteresAleatorios.length

  );

  return caracteresAleatorios[posicion];

}

// ALTERAR LAS LETRAS DEL ENCABEZADO

function generarEncabezadoAlterado() {

  return Array.from(encabezado).map(caracter => {

    if (/[a-zA-ZáéíóúÁÉÍÓÚñÑ0-9]/.test(caracter)) {

      return caracterAleatorio();

    }

    return caracter;

  }).join("");

}

// DESCIFRAR EL ENCABEZADO DURANTE 3 SEGUNDOS

function iniciarDescifrado() {

  cursor.style.display = "none";

  output.textContent = generarEncabezadoAlterado();

  intervaloDescifrado = setInterval(() => {

    output.textContent = generarEncabezadoAlterado();

  }, VELOCIDAD_DESCIFRADO);

  setTimeout(() => {

    clearInterval(intervaloDescifrado);

    output.textContent = encabezado;

    salida = encabezado;

    cursor.style.display = "inline";

    setTimeout(escribir, 350);

  }, DURACION_DESCIFRADO);

}

// CORRUPCIÓN OCASIONAL DEL MENSAJE

function corromper(caracter) {

  if (

    cambios[caracter] &&

    Math.random() < 0.04

  ) {

    return cambios[caracter];

  }

  return caracter;

}

// ESCRITURA PROGRESIVA DE LA CARTA

function escribir() {

  if (indice >= mensaje.length) {

    output.textContent = salida;

    cursor.style.display = "none";

    nav.classList.add("show");

    return;

  }

  // INTERFERENCIA AL 75 % DEL MENSAJE

  if (

    !interferenciaMostrada &&

    indice > mensaje.length * 0.75

  ) {

    interferenciaMostrada = true;

    output.textContent =

      salida + "\n\n[ SEÑAL INESTABLE ]\n";

    setTimeout(() => {

      output.textContent =

        salida + "\n\n[ RECONECTANDO ]\n";

      setTimeout(() => {

        output.textContent = salida;

        escribir();

      }, 2500);

    }, 1500);

    return;

  }

  salida += corromper(mensaje[indice]);

  indice++;

  output.textContent = salida;

  // SIN DESPLAZAMIENTO AUTOMÁTICO

  setTimeout(escribir, VELOCIDAD);

}

// INICIAR EL SISTEMA

iniciarDescifrado();

</script>
