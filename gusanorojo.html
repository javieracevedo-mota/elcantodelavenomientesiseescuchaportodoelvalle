<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Prueba de sonido WAV</title>

<style>

  body {

    background: #000;

    color: #00ff66;

    font-family: monospace;

    min-height: 100dvh;

    margin: 0;

    padding: 24px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 20px;

    text-align: center;

  }

  button {

    background: #000;

    color: #00ff66;

    border: 1px solid #00ff66;

    padding: 18px 24px;

    font: inherit;

    cursor: pointer;

  }

  audio {

    width: min(100%, 340px);

  }

</style>

</head>

<body>

<h2>[ PRUEBA DE TRANSMISIÓN ]</h2>

<button id="play">

  [ REPRODUCIR TONO WAV ]

</button>

<audio id="audio" controls playsinline></audio>

<p id="estado">ESPERANDO SEÑAL...</p>

<script>

const audio = document.getElementById("audio");

const estado = document.getElementById("estado");

function crearWAV() {

  const sampleRate = 44100;

  const duracion = 2;

  const cantidad = sampleRate * duracion;

  const buffer = new ArrayBuffer(44 + cantidad * 2);

  const view = new DataView(buffer);

  function texto(offset, valor) {

    for (let i = 0; i < valor.length; i++) {

      view.setUint8(offset + i, valor.charCodeAt(i));

    }

  }

  texto(0, "RIFF");

  view.setUint32(4, 36 + cantidad * 2, true);

  texto(8, "WAVE");

  texto(12, "fmt ");

  view.setUint32(16, 16, true);

  view.setUint16(20, 1, true);

  view.setUint16(22, 1, true);

  view.setUint32(24, sampleRate, true);

  view.setUint32(28, sampleRate * 2, true);

  view.setUint16(32, 2, true);

  view.setUint16(34, 16, true);

  texto(36, "data");

  view.setUint32(40, cantidad * 2, true);

  for (let i = 0; i < cantidad; i++) {

    const t = i / sampleRate;

    const fade = Math.min(

      1,

      t * 15,

      (duracion - t) * 15

    );

    const muestra =

      Math.sin(2 * Math.PI * 440 * t) *

      0.5 *

      Math.max(0, fade);

    view.setInt16(

      44 + i * 2,

      Math.round(muestra * 32767),

      true

    );

  }

  return new Blob([buffer], {type: "audio/wav"});

}

const url = URL.createObjectURL(crearWAV());

audio.src = url;

document.getElementById("play").addEventListener("click", async () => {

  try {

    audio.currentTime = 0;

    await audio.play();

    estado.textContent = "REPRODUCIENDO TRANSMISIÓN...";

  } catch (error) {

    estado.textContent = "ERROR: " + error.message;

  }

});

audio.addEventListener("ended", () => {

  estado.textContent = "TRANSMISIÓN FINALIZADA";

});

</script>

</body>

</html>
