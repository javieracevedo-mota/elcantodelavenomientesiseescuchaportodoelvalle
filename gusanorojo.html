<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Prueba de audio</title>

<style>

  body {

    background: #000;

    color: #00ff66;

    font-family: monospace;

    min-height: 100dvh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    gap: 20px;

  }

  button {

    background: #000;

    color: #00ff66;

    border: 1px solid #00ff66;

    font: inherit;

    padding: 20px;

    cursor: pointer;

  }

</style>

</head>

<body>

<h2>[ PRUEBA DE AUDIO ]</h2>

<button id="play">

  [ REPRODUCIR SONIDO ]

</button>

<p id="estado">ESPERANDO INTERACCIÓN...</p>

<script>

let audio;

document.getElementById("play").onclick = async () => {

  const estado = document.getElementById("estado");

  try {

    const AudioContextClass =

      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {

      estado.textContent = "AUDIO NO COMPATIBLE";

      return;

    }

    if (!audio || audio.state === "closed") {

      audio = new AudioContextClass();

    }

    // Programar el sonido directamente

    // durante el toque del usuario.

    const osc = audio.createOscillator();

    const gain = audio.createGain();

    osc.type = "sine";

    osc.frequency.value = 440;

    gain.gain.value = 0.5;

    osc.connect(gain);

    gain.connect(audio.destination);

    const t = audio.currentTime;

    osc.start(t);

    osc.stop(t + 1.5);

    await audio.resume();

    estado.textContent =

      "ESTADO DEL AUDIO: " + audio.state;

  } catch (error) {

    estado.textContent =

      "ERROR: " + error.message;

  }

};

</script>

</body>

</html>
