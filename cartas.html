<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archivos interceptados</title>

<style>

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

:root {

  --bg: #000;

  --fg: #00ff66;

}

html, body {

  width: 100%;

  height: 100%;

  background: var(--bg);

  color: var(--fg);

  font-family: monospace;

  overflow: hidden;

}

/* EFECTO CRT */

body::before {

  content: "";

  position: fixed;

  inset: 0;

  background: repeating-linear-gradient(

    to bottom,

    rgba(0,255,102,0.04) 0px,

    rgba(0,255,102,0.04) 1px,

    transparent 2px,

    transparent 4px

  );

  pointer-events: none;

  opacity: 0.18;

  z-index: 40;

}

.noise {

  position: fixed;

  inset: 0;

  background-image: radial-gradient(

    rgba(0,255,102,0.09) 0.7px,

    transparent 0.8px

  );

  background-size: 8px 8px;

  opacity: 0.08;

  pointer-events: none;

  z-index: 39;

}

/* PANEL SUPERIOR IZQUIERDO */

.left-panel {

  position: fixed;

  left: 16px;

  top: 16px;

  z-index: 50;

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  gap: 24px;

}

.top-left {

  color: var(--fg);

  text-decoration: none;

  font-size: clamp(12px, 1.5vw, 20px);

  border: 2px solid var(--fg);

  padding: 8px 12px;

  background: #000;

  display: inline-flex;

  align-items: center;

}

.top-left:hover,

.top-left:focus-visible {

  background: #003319;

}

.sector-info {

  font-size: clamp(12px, 1.3vw, 18px);

  line-height: 1.5;

  color: var(--fg);

  text-shadow: 0 1px 3px #000;

}

/* PANEL SUPERIOR DERECHO */

.status-block {

  position: fixed;

  top: 16px;

  right: 16px;

  z-index: 50;

  text-align: right;

  font-size: clamp(12px, 1.4vw, 18px);

  line-height: 1.3;

  display: flex;

  flex-direction: column;

  gap: 2px;

  color: var(--fg);

  text-shadow: 0 1px 3px #000;

}

.status-line {

  white-space: nowrap;

}

.radio-bars {

  letter-spacing: 0.08em;

}

/* PAISAJE A PANTALLA COMPLETA */

.landscape-screen {

  position: fixed;

  inset: 0;

  width: 100vw;

  height: 100vh;

  height: 100dvh;

  overflow: hidden;

  background: #020b05;

}

.landscape-image {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  object-position: center center;

  image-rendering: pixelated;

}

/* CAPA INTERACTIVA */

.points {

  position: absolute;

  inset: 0;

  z-index: 10;

}

/* NÚMEROS DE LAS CARTAS */

.point {

  position: absolute;

  width: 34px;

  height: 34px;

  transform: translate(-50%, -50%);

  display: grid;

  place-items: center;

  background: #001b09;

  color: var(--fg);

  border: 2px solid var(--fg);

  font-family: monospace;

  font-size: 13px;

  font-weight: bold;

  text-decoration: none;

  cursor: pointer;

  border-radius: 0;

  box-shadow: 0 0 0 4px rgba(0,255,102,0.1);

  animation: pulse 2s steps(2) infinite;

  z-index: 12;

  -webkit-tap-highlight-color: transparent;

  touch-action: manipulation;

}

.point:hover,

.point:focus-visible {

  background: var(--fg);

  color: #000;

  animation: none;

  box-shadow: 0 0 0 6px rgba(0,255,102,0.25);

}

@keyframes pulse {

  50% {

    opacity: 0.65;

  }

}

/* NOMBRE EMERGENTE */

.tooltip {

  position: fixed;

  display: none;

  width: max-content;

  max-width: min(300px, 75vw);

  padding: 12px 15px;

  background: #000;

  border: 2px solid var(--fg);

  color: var(--fg);

  font-family: monospace;

  font-size: 14px;

  line-height: 1.5;

  overflow-wrap: anywhere;

  pointer-events: none;

  z-index: 60;

  box-shadow: 0 0 20px rgba(0,255,102,0.15);

}

.tooltip.visible {

  display: block;

}

/* AVES ANIMADAS */

.bird {

  position: absolute;

  width: 15px;

  height: 8px;

  z-index: 5;

  pointer-events: none;

  animation: fly linear infinite;

}

.bird::before,

.bird::after {

  content: "";

  position: absolute;

  width: 8px;

  height: 3px;

  background: #00ff66;

  top: 2px;

}

.bird::before {

  left: 0;

  transform: rotate(20deg);

  transform-origin: right center;

  animation: flapLeft 0.5s infinite alternate;

}

.bird::after {

  right: 0;

  transform: rotate(-20deg);

  transform-origin: left center;

  animation: flapRight 0.5s infinite alternate;

}

@keyframes flapLeft {

  from { transform: rotate(25deg); }

  to { transform: rotate(-30deg); }

}

@keyframes flapRight {

  from { transform: rotate(-25deg); }

  to { transform: rotate(30deg); }

}

@keyframes fly {

  from {

    transform: translateX(-15vw) translateY(0);

  }

  to {

    transform: translateX(115vw) translateY(-25px);

  }

}

/* PANTALLAS PEQUEÑAS */

@media (max-width: 700px) {

  .left-panel {

    left: 10px;

    top: 10px;

    max-width: 51%;

    gap: 6px;

  }

  .top-left {

    padding: 7px 9px;

    font-size: 10px;

    overflow-wrap: anywhere;

  }

  .sector-info {

    font-size: 10px;

  }

  .status-block {

    right: 10px;

    top: 10px;

    font-size: 10px;

    max-width: 45%;

  }

  .status-line {

    white-space: normal;

  }

  .radio-bars {

    font-size: 9px;

    letter-spacing: 0;

  }

  .point {

    width: 29px;

    height: 29px;

    font-size: 11px;

  }

  .tooltip {

    font-size: 11px;

    max-width: 190px;

  }

}

</style>

</head>

<body>

<div class="noise"></div>

<!-- COORDENADAS Y SECTOR -->

<div class="left-panel">

  <a class="top-left" href="index.html">

    ← 20°07'40.65"N 99°17'51.44"W

  </a>

  <div class="sector-info">

    <div>sector xicuca</div>

    <div>09 señales detectadas</div>

  </div>

</div>

<!-- COORDENADAS CAMBIANTES -->

<div class="status-block">

  <div class="status-line" id="signalLine">

    conexión IP 000%

  </div>

  <div class="status-line" id="coordLine">--</div>

  <div class="status-line" id="placeLine">--</div>

  <div class="radio-bars" id="radioLine">

    ▁▂▃▅▇

  </div>

</div>

<!-- PAISAJE -->

<main class="landscape-screen" id="landscapeScreen">

  <img

    class="landscape-image"

    src="paisaje-xicuco.png"

    alt="Paisaje pixelado del cerro del Xicuco"

  >

  <!-- AVES ANIMADAS -->

  <div class="bird"

       style="top:20%; left:-10%;

              animation-duration:18s;">

  </div>

  <div class="bird"

       style="top:24%; left:-20%;

              animation-duration:22s;

              animation-delay:-6s;">

  </div>

  <div class="bird"

       style="top:18%; left:-30%;

              animation-duration:26s;

              animation-delay:-12s;">

  </div>

  <div class="bird"

       style="top:28%; left:-15%;

              animation-duration:20s;

              animation-delay:-9s;">

  </div>

  <div class="bird"

       style="top:22%; left:-25%;

              animation-duration:24s;

              animation-delay:-16s;">

  </div>

  <!-- NUEVE CARTAS -->

  <div class="points" id="points"></div>

</main>

<!-- NOMBRE EMERGENTE DE LA CARTA -->

<div

  class="tooltip"

  id="tooltip"

  role="status"

  aria-live="polite"

></div>

<script>

// =====================================

// MUNICIPIOS DEL VALLE DEL MEZQUITAL

// =====================================

const municipalities = [

  { coords: "20.1609, -98.5634", place: "actopan, hidalgo" },

  { coords: "20.0533, -99.0719", place: "ajacuba, hidalgo" },

  { coords: "20.2435, -99.2058", place: "alfajayucan, hidalgo" },

  { coords: "20.0332, -99.1316", place: "atitalaquia, hidalgo" },

  { coords: "20.0027, -99.1312", place: "atotonilco de tula, hidalgo" },

  { coords: "20.1707, -99.2447", place: "chapantongo, hidalgo" },

  { coords: "20.1951, -99.1354", place: "chilcuautla, hidalgo" },

  { coords: "20.1317, -98.5439", place: "el arenal, hidalgo" },

  { coords: "20.1442, -99.0520", place: "francisco i. madero, hidalgo" },

  { coords: "20.2231, -99.3904", place: "huichapan, hidalgo" },

  { coords: "20.2905, -99.1307", place: "ixmiquilpan, hidalgo" },

  { coords: "20.1345, -99.1249", place: "mixquiahuala de juárez, hidalgo" },

  { coords: "20.1506, -99.3839", place: "nopala de villagrán, hidalgo" },

  { coords: "20.1453, -99.1121", place: "progreso de obregón, hidalgo" },

  { coords: "20.0656, -98.5312", place: "san agustín tlaxiaca, hidalgo" },

  { coords: "20.1704, -99.0056", place: "san salvador, hidalgo" },

  { coords: "20.2257, -98.5750", place: "santiago de anaya, hidalgo" },

  { coords: "20.3306, -99.1845", place: "tasquillo, hidalgo" },

  { coords: "20.3201, -99.3805", place: "tecozautla, hidalgo" },

  { coords: "19.5418, -99.2030", place: "tepeji del río de ocampo, hidalgo" },

  { coords: "20.1113, -99.2249", place: "tepetitlán, hidalgo" },

  { coords: "20.0609, -99.0922", place: "tetepango, hidalgo" },

  { coords: "20.1133, -99.1621", place: "tezontepec de aldama, hidalgo" },

  { coords: "20.0750, -99.1404", place: "tlahuelilpan, hidalgo" },

  { coords: "20.0529, -99.1317", place: "tlaxcoapan, hidalgo" },

  { coords: "20.0318, -99.2035", place: "tula de allende, hidalgo" }

];

const signalLine = document.getElementById("signalLine");

const coordLine = document.getElementById("coordLine");

const placeLine = document.getElementById("placeLine");

const radioLine = document.getElementById("radioLine");

let ipPercent = 0;

let municipalityIndex = 0;

function makeBars(p) {

  const levels = [

    "▁", "▂", "▃", "▄",

    "▅", "▆", "▇", "█"

  ];

  let bars = "";

  for (let i = 0; i < 16; i++) {

    const v = Math.abs(

      Math.sin((p / 10) + i * 0.5)

    );

    const idx = Math.min(

      7,

      Math.floor(v * 8)

    );

    bars += levels[idx];

  }

  return bars;

}

function updateStatus() {

  signalLine.textContent =

    "conexión IP " +

    String(ipPercent).padStart(3, "0") +

    "%";

  const current = municipalities[municipalityIndex];

  coordLine.textContent = current.coords;

  placeLine.textContent = current.place;

  radioLine.textContent = makeBars(ipPercent);

  ipPercent += 3;

  if (ipPercent > 100) {

    ipPercent = 0;

  }

  municipalityIndex++;

  if (municipalityIndex >= municipalities.length) {

    municipalityIndex = 0;

  }

}

updateStatus();

setInterval(updateStatus, 1000);

// =====================================

// NUEVE CARTAS

// =====================================

const registros = [

  {

    id: 1,

    nombre: "la noche del tsuru blanco.xic",

    x: 46,

    y: 27

  },

  {

    id: 2,

    nombre: "explosión planta agroquímica.xic",

    x: 74,

    y: 62

  },

  {

    id: 3,

    nombre: "refinería miguel hidalgo.xic",

    x: 85.4,

    y: 44.5

  },

  {

    id: 4,

    nombre: "misión gusano rojo.xic",

    x: 19,

    y: 73

  },

  {

    id: 5,

    nombre: "experimento biotecnológico territorial.xic",

    x: 40,

    y: 76

  },

  {

    id: 6,

    nombre: "plaga patronal.xic",

    x: 46,

    y: 57

  },

  {

    id: 7,

    nombre: "culebra tormenta.xic",

    x: 31,

    y: 42

  },

  {

    id: 8,

    nombre: "diablito robot.xic",

    x: 56,

    y: 43

  },

  {

    id: 9,

    nombre: "las máquinas interceptan frecuencias digitales, pero nadie intercepta el canto de un ave.xic",

    x: 95,

    y: 78

  }

];

// =====================================

// NÚMEROS INTERACTIVOS

// =====================================

const points = document.getElementById("points");

const tooltip = document.getElementById("tooltip");

function mostrarNombre(registro, enlace) {

  tooltip.textContent = registro.nombre;

  tooltip.classList.add("visible");

  const punto = enlace.getBoundingClientRect();

  const centroX = punto.left + punto.width / 2;

  const centroY = punto.top + punto.height / 2;

  const ancho = tooltip.offsetWidth;

  const alto = tooltip.offsetHeight;

  const margen = 8;

  let izquierda = centroX + 24;

  let arriba = centroY - alto / 2;

  if (izquierda + ancho > window.innerWidth - margen) {

    izquierda = centroX - ancho - 24;

  }

  izquierda = Math.max(

    margen,

    Math.min(

      izquierda,

      window.innerWidth - ancho - margen

    )

  );

  arriba = Math.max(

    margen,

    Math.min(

      arriba,

      window.innerHeight - alto - margen

    )

  );

  tooltip.style.left = izquierda + "px";

  tooltip.style.top = arriba + "px";

}

function ocultarNombre() {

  tooltip.classList.remove("visible");

}

registros.forEach(registro => {

  const enlace = document.createElement("a");

  enlace.className = "point";

  enlace.href = "carta" + registro.id + ".html";

  enlace.textContent =

    String(registro.id).padStart(2, "0");

  enlace.style.left = registro.x + "%";

  enlace.style.top = registro.y + "%";

  enlace.setAttribute(

    "aria-label",

    "Abrir carta " +

    registro.id +

    ": " +

    registro.nombre

  );

  // Mostrar nombre al pasar el cursor

  enlace.addEventListener("mouseenter", () => {

    mostrarNombre(registro, enlace);

  });

  enlace.addEventListener("mouseleave", () => {

    ocultarNombre();

  });

  // Accesibilidad con teclado

  enlace.addEventListener("focus", () => {

    mostrarNombre(registro, enlace);

  });

  enlace.addEventListener("blur", () => {

    ocultarNombre();

  });

  // No se intercepta el clic.

  // Un solo toque abre directamente la carta.

  points.appendChild(enlace);

});

</script>

</body>

</html>
