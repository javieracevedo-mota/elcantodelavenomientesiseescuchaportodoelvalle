<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archivos interceptados</title>

<style>

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

:root {

  --bg: #000000;

  --fg: #00ff66;

}

html, body {

  min-height: 100%;

  background: var(--bg);

  color: var(--fg);

  font-family: monospace;

}

body {

  min-height: 100vh;

  min-height: 100dvh;

  overflow-x: hidden;

  position: relative;

}

/* EFECTO CRT */

body::before {

  content: "";

  position: fixed;

  inset: 0;

  background: repeating-linear-gradient(

    to bottom,

    rgba(0,255,102,0.04) 0px,

    rgba(0,255,102,0.04) 1px,

    transparent 2px,

    transparent 4px

  );

  pointer-events: none;

  opacity: 0.18;

  z-index: 20;

}

.noise {

  position: fixed;

  inset: 0;

  background-image: radial-gradient(

    rgba(0,255,102,0.09) 0.7px,

    transparent 0.8px

  );

  background-size: 8px 8px;

  opacity: 0.08;

  pointer-events: none;

  z-index: 19;

}

/* PANEL SUPERIOR IZQUIERDO */

.top-left {

  position: fixed;

  left: 16px;

  top: 16px;

  z-index: 30;

  color: var(--fg);

  text-decoration: none;

  font-size: clamp(14px, 1.8vw, 22px);

  border: 2px solid var(--fg);

  padding: 8px 12px;

  background: #000;

  display: inline-flex;

  align-items: center;

  gap: 10px;

}

.top-left:hover,

.top-left:focus-visible {

  background: #003319;

}

/* PANEL SUPERIOR DERECHO */

.status-block {

  position: fixed;

  top: 16px;

  right: 16px;

  z-index: 30;

  text-align: right;

  font-size: clamp(13px, 1.6vw, 20px);

  line-height: 1.3;

  display: flex;

  flex-direction: column;

  gap: 2px;

  color: var(--fg);

}

.status-line {

  white-space: nowrap;

}

.radio-bars {

  letter-spacing: 0.08em;

}

/* PAISAJE */

.page {

  width: 100%;

  min-height: 100vh;

  min-height: 100dvh;

  padding: 165px 20px 50px;

  display: flex;

  align-items: center;

  justify-content: center;

}

.map-stage {

  position: relative;

  width: min(100%, 1100px);

  aspect-ratio: 900 / 540;

  background: #020b05;

  border: 1px solid #176536;

  overflow: hidden;

}

#landscape {

  display: block;

  width: 100%;

  height: 100%;

  image-rendering: pixelated;

}

/* PUNTOS DE LAS CARTAS */

.points {

  position: absolute;

  inset: 0;

}

.point {

  position: absolute;

  width: 34px;

  height: 34px;

  transform: translate(-50%, -50%);

  display: grid;

  place-items: center;

  background: #001b09;

  color: var(--fg);

  border: 2px solid var(--fg);

  font-family: monospace;

  font-size: 13px;

  font-weight: bold;

  text-decoration: none;

  cursor: pointer;

  border-radius: 0;

  box-shadow: 0 0 0 4px rgba(0,255,102,0.1);

  animation: pulse 2s steps(2) infinite;

  z-index: 2;

  -webkit-tap-highlight-color: transparent;

}

.point:hover,

.point:focus-visible,

.point.active {

  background: var(--fg);

  color: #000;

  animation: none;

  box-shadow: 0 0 0 6px rgba(0,255,102,0.25);

}

@keyframes pulse {

  50% {

    opacity: 0.65;

  }

}

/* RECUADRO CON EL NOMBRE */

.tooltip {

  position: absolute;

  display: none;

  width: max-content;

  max-width: min(280px, 70vw);

  padding: 11px 14px;

  background: #000;

  border: 2px solid var(--fg);

  color: var(--fg);

  font-family: monospace;

  font-size: 13px;

  line-height: 1.5;

  overflow-wrap: anywhere;

  pointer-events: none;

  z-index: 10;

  box-shadow: 0 0 18px rgba(0,255,102,0.15);

}

.tooltip.visible {

  display: block;

}

/* AJUSTES MÓVILES */

@media (max-width: 700px) {

  .top-left {

    left: 10px;

    top: 10px;

    padding: 7px 9px;

    font-size: 11px;

    max-width: 52%;

    overflow-wrap: anywhere;

  }

  .status-block {

    right: 10px;

    top: 10px;

    font-size: 10px;

    max-width: 45%;

  }

  .status-line {

    white-space: normal;

  }

  .radio-bars {

    font-size: 9px;

    letter-spacing: 0;

  }

  .page {

    padding: 135px 10px 30px;

  }

  .map-stage {

    aspect-ratio: 4 / 5;

  }

  .point {

    width: 30px;

    height: 30px;

    font-size: 11px;

  }

  .tooltip {

    font-size: 11px;

    max-width: 190px;

  }

}

</style>

</head>

<script>

// =====================================

// MUNICIPIOS Y COORDENADAS

// =====================================

const municipalities = [

  { coords: "20.1609, -98.5634", place: "actopan, hidalgo" },

  { coords: "20.0533, -99.0719", place: "ajacuba, hidalgo" },

const signalLine = document.getElementById("signalLine");

const coordLine = document.getElementById("coordLine");

const radioLine = document.getElementById("radioLine");

let ipPercent = 0;

let municipalityIndex = 0;

function makeBars(p) {

  const levels = ["▁","▂","▃","▄","▅","▆","▇","█"];

  let bars = "";

  for (let i = 0; i < 16; i++) {

    const v = Math.abs(Math.sin((p / 10) + i * 0.5));

    const idx = Math.min(7, Math.floor(v * 8));

    bars += levels[idx];

  }

  return bars;

}

function updateStatus() {

  signalLine.textContent =

    "conexión IP " +

    "%";

  coordLine.textContent = current.coords;

  placeLine.textContent = current.place;

  radioLine.textContent = makeBars(ipPercent);

  ipPercent += 3;

  if (ipPercent > 100) {

    ipPercent = 0;

  }

  municipalityIndex++;

  if (municipalityIndex >= municipalities.length) {

    municipalityIndex = 0;

}

// =====================================

// PAISAJE PIXELADO ORIGINAL

// =====================================

const canvas = document.getElementById("landscape");

const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = canvas.width;

const H = canvas.height;

function rect(x, y, w, h, color) {

  ctx.fillStyle = color;

  ctx.fillRect(

    Math.round(x),

    Math.round(y),

    Math.round(w),

    Math.round(h)

  );

}

function dibujarCielo() {

  rect(0, 0, W, H, "#020b05");

  for (let i = 0; i < 65; i++) {

    const x = (i * 79 + 17) % W;

    const y = (i * 37 + 11) % 115;

    rect(

      x, y, 1, 1,

      i % 3 === 0 ? "#00ff66" : "#185d33"

    );

  }

  // Luna fragmentada

  rect(346, 20, 22, 22, "#124a28");

  rect(350, 16, 14, 30, "#176c35");

  rect(354, 20, 10, 22, "#00a846");

  rect(360, 16, 13, 30, "#020b05");

}

function dibujarCerros() {

  const montanas = [

    [0,160], [25,144], [50,130],

    [70,102], [90,92], [110,118],

    [137,147], [165,156],

    [190,137], [215,112],

    [238,130], [265,153],

    [295,139], [320,112],

    [350,123], [380,145],

    [410,128], [450,151]

  ];

  ctx.fillStyle = "#06351a";

  ctx.beginPath();

  ctx.moveTo(0, H);

  montanas.forEach(p => {

    ctx.lineTo(p[0], p[1]);

  });

  ctx.lineTo(W, H);

  ctx.fill();

  for (let i = 0; i < 38; i++) {

    const x = (i * 41) % W;

    const y = 135 + (i * 19) % 65;

    rect(x, y, 10, 2, "#0d4a25");

  }

}

function dibujarTerreno() {

  rect(0, 205, W, 65, "#082a15");

  for (let i = 0; i < 90; i++) {

    const x = (i * 53) % W;

    const y = 205 + (i * 23) % 65;

    rect(x, y, 5, 2, "#15552d");

  }

}

function dibujarAgua() {

  const puntos = [

    [0,225], [50,218], [100,230],

    [160,220], [220,237],

    [275,230], [335,242],

    [390,233], [450,248]

  ];

  ctx.beginPath();

  ctx.moveTo(0, 225);

  puntos.forEach(p => {

    ctx.lineTo(p[0], p[1]);

  });

  ctx.lineTo(450, 270);

  ctx.lineTo(0, 270);

  ctx.closePath();

  ctx.fillStyle = "#0a5530";

  ctx.fill();

  for (let i = 0; i < 26; i++) {

    const x = (i * 47) % W;

    const y = 240 + (i * 11) % 25;

    rect(x, y, 14, 2, "#00a852");

  }

  rect(250, 206, 125, 5, "#176c35");

  rect(250, 212, 125, 4, "#003d20");

}

function maguey(x, y, escala = 1) {

  const s = escala;

  rect(x, y - 12*s, 3*s, 15*s, "#00a846");

  rect(x - 6*s, y - 8*s, 4*s, 9*s, "#176c35");

  rect(x + 5*s, y - 9*s, 4*s, 10*s, "#176c35");

  rect(x - 11*s, y - 4*s, 6*s, 3*s, "#00a846");

  rect(x + 8*s, y - 5*s, 6*s, 3*s, "#00a846");

  rect(x - 3*s, y, 9*s, 4*s, "#0d5e2e");

}

function dibujarVegetacion() {

  maguey(35, 207, 1.2);

  maguey(83, 215, 0.8);

  maguey(139, 205, 1.1);

  maguey(202, 216, 0.8);

  maguey(408, 218, 1.3);

  maguey(438, 207, 0.7);

  // Mezquite pixelado

  rect(168, 179, 5, 35, "#176c35");

  rect(153, 174, 33, 8, "#0d5e2e");

  rect(148, 181, 43, 8, "#176c35");

  rect(157, 165, 25, 10, "#0d5e2e");

}

function dibujarRefineria() {

  const x = 315;

  const y = 168;

  rect(x, y, 104, 48, "#0a321b");

  rect(x + 7, y - 32, 11, 78, "#176c35");

  rect(x + 11, y - 42, 4, 10, "#00a846");

  rect(x + 33, y - 17, 13, 62, "#0d5e2e");

  rect(x + 38, y - 30, 4, 13, "#00a846");

  rect(x + 65, y - 50, 9, 95, "#176c35");

  rect(x + 68, y - 58, 3, 8, "#00ff66");

  rect(x + 84, y - 10, 13, 55, "#0d5e2e");

  rect(x, y + 19, 104, 5, "#00a846");

  rect(x + 25, y + 8, 5, 35, "#176c35");

  rect(x + 51, y + 6, 5, 37, "#176c35");

  for (let i = 0; i < 6; i++) {

    rect(

      x + 8 + i * 16,

      y + 32,

      5, 5,

      "#00ff66"

    );

  }

}

function dibujarAves(t) {

  const desplazamiento = Math.sin(t * 0.001) * 8;

  for (let i = 0; i < 5; i++) {

    const x = 90 + i * 36 + desplazamiento;

    const y = 38 + (i % 3) * 13;

    rect(x, y, 3, 2, "#00ff66");

    rect(x - 4, y - 2, 4, 2, "#00a846");

    rect(x + 3, y - 2, 4, 2, "#00a846");

  }

}

function dibujar(t = 0) {

  ctx.clearRect(0, 0, W, H);

  dibujarCielo();

  dibujarCerros();

  dibujarTerreno();

  dibujarAgua();

  dibujarVegetacion();

  dibujarRefineria();

  dibujarAves(t);

  requestAnimationFrame(dibujar);

}

// =====================================

// NÚMEROS INTERACTIVOS

// =====================================

const points = document.getElementById("points");

const tooltip = document.getElementById("tooltip");

const mapStage = document.getElementById("mapStage");

let puntoSeleccionado = null;

function mostrarNombre(registro, boton) {

  tooltip.textContent = registro.nombre;

  tooltip.classList.add("visible");

  const mapa = mapStage.getBoundingClientRect();

  const punto = boton.getBoundingClientRect();

  const centroX =

    punto.left - mapa.left + punto.width / 2;

  const centroY =

    punto.top - mapa.top + punto.height / 2;

  // Primero medimos el recuadro

  // para impedir que salga del paisaje.

  const ancho = tooltip.offsetWidth;

  const alto = tooltip.offsetHeight;

  const margen = 8;

  let izquierda = centroX + 22;

  let arriba = centroY - alto / 2;

  if (izquierda + ancho > mapa.width - margen) {

    izquierda = centroX - ancho - 22;

  }

  izquierda = Math.max(

    margen,

    Math.min(

      izquierda,

      mapa.width - ancho - margen

    )

  );

  arriba = Math.max(

    margen,

    Math.min(

      arriba,

      mapa.height - alto - margen

    )

  );

  tooltip.style.left = izquierda + "px";

  tooltip.style.top = arriba + "px";

}

function ocultarNombre() {

  tooltip.classList.remove("visible");

}

registros.forEach(registro => {

  const enlace = document.createElement("a");

  enlace.className = "point";

  enlace.href = "carta" + registro.id + ".html";

  enlace.textContent =

    String(registro.id).padStart(2, "0");

  enlace.style.left = registro.x + "%";

  enlace.style.top = registro.y + "%";

  enlace.setAttribute(

    "aria-label",

    "Abrir carta " +

    registro.id +

    ": " +

    registro.nombre

  );

  // En computadora: mostrar el nombre

  // cuando el cursor pasa por encima.

  enlace.addEventListener("mouseenter", () => {

    mostrarNombre(registro, enlace);

  });

  enlace.addEventListener("mouseleave", () => {

    if (puntoSeleccionado !== enlace) {

      ocultarNombre();

    }

  });

  enlace.addEventListener("focus", () => {

    mostrarNombre(registro, enlace);

  });

  enlace.addEventListener("blur", () => {

    if (puntoSeleccionado !== enlace) {

      ocultarNombre();

    }

  });

  // En pantallas táctiles:

  // primer toque = nombre

  // segundo toque = abrir carta.

  enlace.addEventListener("click", event => {

    if (

      window.matchMedia("(hover: none)").matches &&

      puntoSeleccionado !== enlace

    ) {

      event.preventDefault();

      if (puntoSeleccionado) {

        puntoSeleccionado.classList.remove("active");

      }

      puntoSeleccionado = enlace;

      enlace.classList.add("active");

      mostrarNombre(registro, enlace);

    }

  });

  points.appendChild(enlace);

});

// =====================================

// SONIDOS DIGITALES DE AVES

// SISTEMA WAV COMPATIBLE CON SAFARI

// =====================================

const SAMPLE_RATE = 22050;

function escribirTexto(view, offset, texto) {

  for (let i = 0; i < texto.length; i++) {

    view.setUint8(

      offset + i,

      texto.charCodeAt(i)

    );

  }

}

function crearWAV(muestras) {

  const cantidad = muestras.length;

  const buffer = new ArrayBuffer(

    44 + cantidad * 2

  );

  const view = new DataView(buffer);

  escribirTexto(view, 0, "RIFF");

  view.setUint32(4, 36 + cantidad * 2, true);

  escribirTexto(view, 8, "WAVE");

  escribirTexto(view, 12, "fmt ");

  view.setUint32(16, 16, true);

  view.setUint16(20, 1, true);

  view.setUint16(22, 1, true);

  view.setUint32(24, SAMPLE_RATE, true);

  view.setUint32(28, SAMPLE_RATE * 2, true);

  view.setUint16(32, 2, true);

  view.setUint16(34, 16, true);

  escribirTexto(view, 36, "data");

  view.setUint32(40, cantidad * 2, true);

  for (let i = 0; i < cantidad; i++) {

    const muestra = Math.max(

      -1,

      Math.min(1, muestras[i])

    );

    view.setInt16(

      44 + i * 2,

      Math.round(muestra * 32767),

      true

    );

  }

  return new Blob(

    [buffer],

    { type: "audio/wav" }

  );

}

function crearCantoAve(variacion = 0) {

  const duracion = 1.25;

  const cantidad = Math.floor(

    SAMPLE_RATE * duracion

  );

  const muestras = new Float32Array(cantidad);

  const base = 850 + variacion * 180;

  const notas = [

    [0.08, 0.28, 1.0, 1.5],

    [0.36, 0.56, 1.4, 0.95],

    [0.68, 0.91, 1.1, 1.75],

    [1.00, 1.17, 1.5, 1.2]

  ];

  for (const nota of notas) {

    const [inicio, fin, f1, f2] = nota;

    const iInicio = Math.floor(

      inicio * SAMPLE_RATE

    );

    const iFin = Math.floor(

      fin * SAMPLE_RATE

    );

    let fase = 0;

    for (let i = iInicio; i < iFin; i++) {

      const progreso =

        (i - iInicio) / (iFin - iInicio);

      const frecuencia =

        base * (f1 + (f2 - f1) * progreso);

      fase +=

        2 * Math.PI *

        frecuencia / SAMPLE_RATE;

      const envolvente = Math.pow(

        Math.sin(Math.PI * progreso),

        1.4

      );

      // Volumen suave directamente

      // en las muestras WAV.

      muestras[i] +=

        Math.sin(fase) *

        envolvente *

        0.10;

    }

  }

  return crearWAV(muestras);

}

const cantos = [

  crearCantoAve(0),

  crearCantoAve(1),

  crearCantoAve(2),

  crearCantoAve(3)

];

const reproductor = document.createElement("audio");

reproductor.preload = "auto";

reproductor.playsInline = true;

reproductor.setAttribute("playsinline", "");

let audioIniciado = false;

let urlActual = null;

let indiceCanto = 0;

let intervaloAves = null;

function reproducirCanto() {

  if (!audioIniciado) return;

  // No interrumpir un canto en reproducción.

  if (

    !reproductor.paused &&

    !reproductor.ended

  ) {

    return;

  }

  if (urlActual) {

    URL.revokeObjectURL(urlActual);

  }

  const canto = cantos[indiceCanto % cantos.length];

  indiceCanto++;

  urlActual = URL.createObjectURL(canto);

  reproductor.src = urlActual;

  // El volumen suave está incorporado

  // en el WAV para funcionar en iOS.

  const resultado = reproductor.play();

  if (

    resultado &&

    typeof resultado.catch === "function"

  ) {

    resultado.catch(error => {

      console.warn(

        "Audio pendiente de interacción:",

        error

      );

    });

  }

}

function iniciarSonidos() {

  if (audioIniciado) return;

  audioIniciado = true;

  // El primer canto comienza durante

  // una interacción directa del usuario.

  reproducirCanto();

  // Cantos espaciados para crear

  // un ambiente discreto.

  intervaloAves = setInterval(() => {

    if (document.hidden) return;

    reproducirCanto();

  }, 2800);

}

// Safari y otros navegadores móviles

// requieren una interacción inicial.

document.addEventListener(

  "pointerdown",

  iniciarSonidos,

  { once: true }

);

document.addEventListener(

  "keydown",

  iniciarSonidos,

  { once: true }

);

// Pausar cuando la pestaña no esté visible.

document.addEventListener(

  "visibilitychange",

  () => {

    if (document.hidden) {

      reproductor.pause();

    } else if (audioIniciado) {

      reproducirCanto();

    }

  }

);

// =====================================

// INICIAR PAISAJE

// =====================================

dibujar();

</script>
