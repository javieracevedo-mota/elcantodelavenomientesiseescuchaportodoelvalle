<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>registro 01 — la noche del tsuru blanco</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #d6ef43;
      --fg: #0b0b0b;
      --muted: rgba(0,0,0,0.75);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,0,0,0.04) 0px,
          rgba(0,0,0,0.04) 1px,
          transparent 2px,
          transparent 4px
        );
      pointer-events: none;
      opacity: 0.18;
      z-index: 10;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(0,0,0,0.09) 0.7px, transparent 0.8px);
      background-size: 8px 8px;
      opacity: 0.08;
      pointer-events: none;
      z-index: 9;
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 14px 18px 80px 18px;
    }

    .header-block {
      font-size: clamp(1.45rem, 2vw, 2rem);
      line-height: 1.02;
      white-space: pre-wrap;
      margin-bottom: 18px;
    }

    .loader-line {
      font-size: clamp(1.35rem, 1.9vw, 1.9rem);
      line-height: 1;
      margin: 8px 0 18px;
      white-space: pre-wrap;
    }

    .message {
      font-size: clamp(1.45rem, 2vw, 2rem);
      line-height: 1.02;
      white-space: pre-wrap;
      min-height: 40vh;
    }

    .cursor {
      animation: blink 0.9s steps(1) infinite;
    }

    .nav-next {
      margin-top: 56px;
      display: none;
      justify-content: flex-end;
    }

    .nav-next.show {
      display: flex;
    }

    .next-link {
      color: var(--fg);
      text-decoration: none;
      font-size: clamp(2rem, 3vw, 3rem);
      border: 2px solid var(--fg);
      padding: 8px 14px;
      background: rgba(0,0,0,0.03);
      line-height: 1;
    }

    .next-link:hover {
      background: rgba(0,0,0,0.08);
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 640px) {
      .page {
        padding: 10px 12px 64px 12px;
      }

      .header-block,
      .message,
      .loader-line {
        font-size: 1.28rem;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <main class="page">
    <div id="headerBlock" class="header-block"></div>
    <div id="loaderLine" class="loader-line"></div>
    <div id="message" class="message"></div>

    <div id="navNext" class="nav-next">
      <a class="next-link" href="carta2.html">→</a>
    </div>
  </main>
    <script>
    const finalCoords = '20° 08´30.06´´N / 99°17´10.74´´O';

    const headerTemplate = [
      '╔═══════════════════════════╗',
      ' ARCHIVO INTERCEPTADO',
      ' registro: 01',
      ' asunto: la noche del tsuru blanco',
      ' fecha de emisión: 19.07.2019',
      ' ubicación aproximada: {{COORDS}}',
      ' estado de señal: estable',
      '╚═══════════════════════════╝'
    ];

    const messageText = `[INICIO DEL MENSAJE]

Me dijiste que pienso mucho en el futuro.
En varias ocasiones me pediste que dejara de pensar en eso.

Posiblemente alguno de los dos no llegará al final.


Vivimos en un lugar donde la nostalgia de los errores
cometidos en el pasado
borra todo rastro de curiosidad
por cambiar el rumbo de las cosas.

Pero a mí me intriga
lo que nos deparará.

Sé que debo explicaciones
y espero algún día dártelas
en persona.


Descifré el mensaje que estaba en el coche
en las milpas cerca del Xicuco, ¿recuerdas?

Aquella noche que escuchamos la explosión
mientras mirábamos el cielo anaranjado
iluminado por la llama constante
de la refinería de Tula.

Estábamos sobre el cofre de tu camioneta.
Nos vestimos más rápido
que cuando nos desvestimos

y tratamos de huir
porque pensamos que habían picado mal otra toma de huachicol.

Pero nos topamos con el Tsuru blanco.


Aunque no querías que bajara de tu camioneta
la luz azul me hipnotizó como a un mosquito.

eran unas coordenadas
indicaban un cerro en Huichapan

Decidí buscarlo.

Quiero ver si existe tal cosa
y saber por qué
a nosotros se nos apareció.


Sabes que el presente no está bien.

Debemos escondernos en la oscuridad para poder estar juntos.

De noche,
como vampiros.

Donde aprendimos a mirar el valle
sin que nadie nos viera.


Las balaceras que están ocurriendo
entre bandas huachicoleras
refuerzan el rumor
de que se están disputando el territorio por la gasolina.

Pero sabes que también es por el agua.
Incluso por el agua negra.
Por eso quiero ir a buscar el garambullo.

Tal vez sea un mensaje del futuro.

Tal vez me ayude a descubrir otro lugar donde podamos estar felices.


o tal vez pueda detener
los problemas que se aproximan.


¿Qué haremos si vuelve a explotar
una fábrica del parque industrial de Atitalaquia
y nos cubren sus venenos?

¿Qué haremos sin agua?

¿Dónde nadaremos?

Si el control por la gasolina genera más balas
¿a dónde escaparemos?


No quiero perder a más amigos.

Hay algo en el aire.
en el agua.
en la tierra.
Algo nos vigila.

Nos somete silenciosamente.

Algo que no vemos,
pero que respira
con nosotros.


¿Será el diablo?

¿Será dios?
A veces siento que no pertenezco aquí.

Nunca encajé del todo en lo que esperan de un hombre en este valle.
Amar a otro hombre hace que automáticamente seas inservible.


Y no sólo eso.


Hay algo en mí que todavía no sé explicar bien.
Algo que no cabe
en las palabras
que aprendimos.

Tú también sabes lo que es amar distinto.

Pero a ti
te cuesta más aceptarlo.


Lo veo en la forma en que bajas la voz cuando alguien se acerca.
En la manera en que nuestro amor solo puede existir cuando cae la noche.

A veces pienso que yo podría ser un error para ti.
Algo que algún día quieras borrar
para que tu vida
sea más sencilla.

Lo entiendo.

Este valle enseña a tener miedo.



Quiero encontrar respuestas
al encuentro fortuito
que tuvimos
en nuestro lugar nocturno.
No te pude decir adiós.


Pero trataré de comunicarme.



Para que cada vez que salga la luna y se escuchen las ranas

sea un indicio

de que encontré nuevas pistas

para descifrar

por qué nos quieren quitar

la esperanza.



[FIN DE MENSAJE]
...
.....
........
..........
estado de señal: activo`;

    const headerBlock = document.getElementById('headerBlock');
    const loaderLine = document.getElementById('loaderLine');
    const message = document.getElementById('message');
    const navNext = document.getElementById('navNext');

    function randomCoordChar() {
      const chars = '0123456789NSEO°´/ .';
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function scrambleCoords(target) {
      return target.split('').map(ch => {
        if (ch === ' ') return ' ';
        return randomCoordChar();
      }).join('');
    }

    function renderHeader(coordsText, withCursor = false) {
      const content = headerTemplate
        .map(line => line.replace('{{COORDS}}', coordsText))
        .join('\n');

      headerBlock.innerHTML = content + (withCursor ? '<span class="cursor">_</span>' : '');
    }

    function typeMessage(text, i = 0) {
      if (i < text.length) {
        message.innerHTML = text.slice(0, i + 1) + '<span class="cursor">_</span>';
        const ch = text[i];
        const delay =
          ch === '\n' ? 26 :
          ch === '.' ? 70 :
          ch === ',' ? 55 :
          ch === ' ' ? 10 : 18;
        setTimeout(() => typeMessage(text, i + 1), delay);
      } else {
        message.textContent = text;
        navNext.classList.add('show');
      }
    }

    function runLoader(percent = 0) {
      const totalBars = 14;
      const filled = Math.round((percent / 100) * totalBars);
      const bar = '[' + '■'.repeat(filled) + '·'.repeat(totalBars - filled) + ']';
      loaderLine.textContent = percent === 100
        ? `[INICIO DEL MENSAJE]  ${String(percent).padStart(3,'0')}%  ${bar}`
        : `. [INICIO DEL MENSAJE]  ${String(percent).padStart(3,'0')}%  ${bar}`;

      if (percent < 100) {
        const next = percent + 2;
        setTimeout(() => runLoader(next), percent < 70 ? 22 : percent < 90 ? 40 : 65);
      } else {
        renderHeader(finalCoords, false);
        setTimeout(() => {
          loaderLine.textContent = '';
          typeMessage(messageText, 0);
        }, 450);
      }
    }

    let scrambleCount = 0;
    function animateHeaderScramble() {
      renderHeader(scrambleCoords(finalCoords), true);
      scrambleCount++;
      if (scrambleCount < 22) {
        setTimeout(animateHeaderScramble, 90);
      } else {
        renderHeader(scrambleCoords(finalCoords), false);
        setTimeout(() => runLoader(0), 180);
      }
    }

    animateHeaderScramble();
  </script>
</body>
</html>
