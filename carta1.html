<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<title>registro 01 — la noche del tsuru blanco</title>

<style>

* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  width: 100%;

  min-height: 100%;

  background: #000000;

  color: #00ff66;

  font-family: monospace;

}

/* TERMINAL */

#terminal {

  position: relative;

  width: 100%;

  height: 100vh;

  height: 100dvh;

  padding: 40px 24px 24px;

  overflow-y: auto;

  overflow-x: hidden;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  font-size: 22px;

  line-height: 1.45;

  overscroll-behavior: contain;

}

/* FLECHA DE REGRESO */

.volver {

  position: relative;

  display: flex;

  align-items: center;

  justify-content: flex-start;

  width: fit-content;

  height: 40px;

  margin-bottom: 16px;

  border: none;

  background: transparent;

  color: #00ff66;

  font-family: monospace;

  font-size: 24px;

  text-decoration: none;

  white-space: normal;

}

.volver:hover,

.volver:focus-visible {

  color: #80ffad;

}

/* CONTROL DE AUDIO */

.audio-control {

  position: absolute;

  top: 16px;

  right: 24px;

  z-index: 100;

  padding: 0;

  border: none;

  background: transparent;

  color: #00ff66;

  cursor: pointer;

  line-height: 1;

}

.audio-control svg {

  display: block;

  width: 25px;

  height: 25px;

}

.audio-control:hover,

.audio-control:focus-visible {

  color: #80ffad;

}

/* CURSOR */

.cursor {

  animation: blink 1s steps(1) infinite;

}

@keyframes blink {

  50% {

    opacity: 0;

  }

}

/* NAVEGACIÓN FINAL */

#nav {

  display: none;

  gap: 24px;

  justify-content: space-between;

  margin: 38px 0 20px;

  white-space: normal;

}

#nav.show {

  display: flex;

}

#nav a {

  color: #00ff66;

  text-decoration: none;

  border: 1px solid #00ff66;

  padding: 10px 14px;

  font-size: 18px;

}

#nav a:hover,

#nav a:focus-visible {

  background: #003319;

}

/* PANTALLAS PEQUEÑAS */

@media (max-width: 640px) {

  #terminal {

    padding: 32px 16px 16px;

    font-size: 18px;

  }

  .volver {

    height: 36px;

    margin-bottom: 12px;

    font-size: 22px;

  }

  .audio-control {

    top: 12px;

    right: 16px;

  }

  #nav {

    gap: 12px;

  }

  #nav a {

    font-size: 14px;

    padding: 8px 10px;

  }

}

</style>

</head>

<body>

<!-- AUDIO AMBIENTAL -->

<audio

  id="audioCarta"

  src="la-noche-del-tsuru-blanco.wav"

  loop

  preload="auto"

></audio>

<main id="terminal"><a

  class="volver"

  href="cartas.html"

  aria-label="Regresar al repositorio de cartas"

  title="Regresar a los archivos"

>←</a>

<!-- ICONO DE AUDIO -->

<button

  id="audioControl"

  class="audio-control"

  type="button"

  aria-label="Activar sonido"

  aria-pressed="false"

  title="Activar sonido"

>

  <svg

    viewBox="0 0 24 24"

    fill="none"

    stroke="currentColor"

    stroke-width="1.8"

    stroke-linecap="round"

    stroke-linejoin="round"

    aria-hidden="true"

  >

    <path d="M11 5 6 9H3v6h3l5 4V5Z"/>

    <path id="onda1" d="M15 9a5 5 0 0 1 0 6"/>

    <path id="onda2" d="M18 6a9 9 0 0 1 0 12"/>

    <path id="audioTachado" d="m16 9 5 6"/>

  </svg>

</button>

<span id="output"></span><span id="cursor" class="cursor">█</span>

<nav id="nav">

  <a href="cartas.html">← ARCHIVOS</a>

  <a href="carta2.html">REGISTRO 02 →</a>

</nav>

</main>

<script>
// ENCABEZADO DEL ARCHIVO
const encabezado = `ARCHIVO INTERCEPTADO
 registro: 01
 asunto: la noche del tsuru blanco
 fecha de emisión: 19.07.2019
 ubicación aproximada: 20°08´30.06´´N / 99°17´10.74´´O
 estado de señal: estable

`;

// CONTENIDO DE LA CARTA

const mensaje = `[INICIO DEL MENSAJE]

Me dijiste que pienso mucho en el futuro.
En varias ocasiones 
me pediste que dejara 
de pensar en eso.

Posiblemente alguno de los dos no llegará al final.

Vivimos en un lugar 
donde la nostalgia 
de los errores
cometidos 
en el pasado
borra todo rastro de curiosidad
por cambiar 
el rumbo de 
las cosas.

Pero a mí me intriga
lo que nos deparará.
Sé que debo explicaciones
y espero algún día dártelas
en persona.

Descifré el mensaje 
que estaba en el coche
en las milpas cerca del Xicuco, 
¿recuerdas?

Aquella noche que escuchamos 
la explosión
mientras mirábamos 
el cielo anaranjado
iluminado por la llama constante
de la refinería de Tula.

Estábamos sobre el cofre 
de tu camioneta.

Nos vestimos más rápido
que cuando nos desvestimos
y tratamos de huir
porque pensamos que habían picado mal otra toma de huachicol.

Pero nos topamos con el Tsuru blanco.

Aunque no querías que bajara de tu camioneta
la luz azul me hipnotizó 
como 
a 
un 
mosquito.

Eran unas coordenadas
indicaban un cerro 
en 
Huichapan

Decidí buscarlo.

Quiero ver si existe 
tal cosa
y saber por qué
a nosotros 
se nos apareció.

Sabes que el presente 
no está bien.

Debemos escondernos 
en 
la oscuridad 
para poder 
estar 
juntos.

De noche,
como vampiros.

Donde aprendimos a mirar 
el valle
sin que nadie 
nos viera.

Las balaceras que están ocurriendo
entre bandas 
huachicoleras
refuerzan el rumor
de que se están disputando 
el territorio 
por la gasolina.

Pero sabes 
que también 
es por el agua.

Incluso por el 
agua negra.

Por eso 
quiero 
ir a buscar 
el garambullo.

Tal vez sea un mensaje del futuro.
Tal vez me ayude a descubrir 
otro lugar 
donde podamos 
estar 
.
.
.
felices.

o tal vez pueda detener
los problemas que se aproximan.

¿Qué haremos si vuelve a explotar
una fábrica del parque industrial 
de Atitalaquia
y nos cubren sus venenos?

¿Qué haremos sin agua?
¿Dónde nadaremos?

Si el control por la gasolina 
genera más balas
¿a dónde escaparemos?

No quiero perder a más amigos.

Hay algo en el aire.
en el agua.
en la tierra.

Algo nos vigila.
Nos somete silenciosamente.
Algo que no vemos,
pero que respira
con nosotros.

¿Será el diablo?
¿Será dios?

A veces siento 
que no pertenezco aquí.

Nunca encajé del todo 
en lo que esperan 
de un hombre en este lugar.

Amar a otro hombre 
hace que automáticamente 
seas inservible.

Y no sólo eso.
Hay algo en mí que todavía 
no sé explicar bien.

Algo que no cabe
en las palabras
que aprendimos.

Tú también sabes lo que es amar distinto.

Pero a ti
te cuesta más aceptarlo.
Lo veo en la forma en que bajas 
la voz cuando 
alguien se acerca.

En la manera en que 
nuestro amor solo 
puede existir cuando 
cae la noche.

A veces pienso 
que 
yo 
podría 
ser un error 
para 
ti.

Algo que algún día quieras borrar
para que tu vida
sea más 
sencilla.

Este valle enseña a tener miedo.

Quiero encontrar respuestas
al encuentro fortuito
que tuvimos
en nuestro 
lugar nocturno.

No te pude 
decir 
adiós.

Pero trataré 
de comunicarme.

Para que cada vez 
que salga 
la luna
y se 
escuchen 
las ranas
sea un indicio
de que 
encontré 
nuevas pistas
para 
descifrar
por qué 
nos quieren 
quitar
la 
esperanza.

[FIN DE MENSAJE]

...

.....

........

..........
estado de señal: activo`;

// ELEMENTOS DE LA PÁGINA

const output = document.getElementById("output");

const cursor = document.getElementById("cursor");

const nav = document.getElementById("nav");

// CONFIGURACIÓN

const VELOCIDAD = 30;

const DURACION_DESCIFRADO = 3000;

const VELOCIDAD_DESCIFRADO = 55;

const caracteresAleatorios =

  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

  "abcdefghijklmnopqrstuvwxyz" +

  "0123456789#$%&/=?+*<>@";

const cambios = {

  o: "0",

  O: "0",

  a: "4",

  A: "4",

  e: "3",

  E: "3",

  i: "1",

  I: "1"

};

let indice = 0;

let interferenciaMostrada = false;

let salida = "";

let intervaloDescifrado = null;

// GENERAR UN CARÁCTER ALEATORIO

function caracterAleatorio() {

  const posicion = Math.floor(

    Math.random() * caracteresAleatorios.length

  );

  return caracteresAleatorios[posicion];

}

// ALTERAR LAS LETRAS DEL ENCABEZADO

function generarEncabezadoAlterado() {

  return Array.from(encabezado).map(caracter => {

    if (/[a-zA-ZáéíóúÁÉÍÓÚñÑ0-9]/.test(caracter)) {

      return caracterAleatorio();

    }

    return caracter;

  }).join("");

}

// DESCIFRAR EL ENCABEZADO DURANTE 3 SEGUNDOS

function iniciarDescifrado() {

  cursor.style.display = "none";

  output.textContent = generarEncabezadoAlterado();

  intervaloDescifrado = setInterval(() => {

    output.textContent = generarEncabezadoAlterado();

  }, VELOCIDAD_DESCIFRADO);

  setTimeout(() => {

    clearInterval(intervaloDescifrado);

    output.textContent = encabezado;

    salida = encabezado;

    cursor.style.display = "inline";

    setTimeout(escribir, 350);

  }, DURACION_DESCIFRADO);

}

// CORRUPCIÓN OCASIONAL DEL MENSAJE

function corromper(caracter) {

  if (

    cambios[caracter] &&

    Math.random() < 0.04

  ) {

    return cambios[caracter];

  }

  return caracter;

}

// ESCRITURA PROGRESIVA DE LA CARTA

function escribir() {

  if (indice >= mensaje.length) {

    output.textContent = salida;

    cursor.style.display = "none";

    nav.classList.add("show");

    return;

  }

  // INTERFERENCIA AL 75 % DEL MENSAJE

  if (

    !interferenciaMostrada &&

    indice > mensaje.length * 0.75

  ) {

    interferenciaMostrada = true;

    output.textContent =

      salida + "\n\n[ SEÑAL INESTABLE ]\n";

    setTimeout(() => {

      output.textContent =

        salida + "\n\n[ RECONECTANDO ]\n";

      setTimeout(() => {

        output.textContent = salida;

        escribir();

      }, 2500);

    }, 1500);

    return;

  }

  salida += corromper(mensaje[indice]);

  indice++;

  output.textContent = salida;

  // SIN DESPLAZAMIENTO AUTOMÁTICO

  setTimeout(escribir, VELOCIDAD);

}

// INICIAR EL SISTEMA

iniciarDescifrado();

// AUDIO AMBIENTAL EN BUCLE

const audioCarta = document.getElementById("audioCarta");

const audioControl = document.getElementById("audioControl");

const onda1 = document.getElementById("onda1");

const onda2 = document.getElementById("onda2");

const audioTachado = document.getElementById("audioTachado");

audioCarta.volume = 0.6;

function actualizarIconoAudio() {

  const encendido = !audioCarta.paused && !audioCarta.muted;

  onda1.style.display = encendido ? "" : "none";

  onda2.style.display = encendido ? "" : "none";

  audioTachado.style.display = encendido ? "none" : "";

  const etiqueta = encendido

    ? "Apagar sonido"

    : "Activar sonido";

  audioControl.setAttribute("aria-label", etiqueta);

  audioControl.setAttribute("aria-pressed", String(encendido));

  audioControl.title = etiqueta;

}

async function activarAudio() {

  try {

    audioCarta.muted = false;

    await audioCarta.play();

  } catch (error) {

    // Safari puede requerir un toque del visitante.

  }

  actualizarIconoAudio();

}

audioControl.addEventListener("click", async () => {

  if (!audioCarta.paused && !audioCarta.muted) {

    audioCarta.pause();

    actualizarIconoAudio();

  } else {

    await activarAudio();

  }

});

audioCarta.addEventListener("play", actualizarIconoAudio);

audioCarta.addEventListener("pause", actualizarIconoAudio);

audioCarta.addEventListener("volumechange", actualizarIconoAudio);

// INTENTAR INICIAR EL AUDIO AUTOMÁTICAMENTE

activarAudio();

</script>

</body>

</html>
