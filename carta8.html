<style>

/* BARRA SUPERIOR */

<script>
// ENCABEZADO DEL ARCHIVO
const encabezado =`ARCHIVO INTERCEPTADO
registro: 08
asunto: diablito robot
fecha estimada: 1972
ubicación aproximada: 20°09´43.00´´N / 99°23´43.09´´O
estado de señal: inestable

`;

// CONTENIDO DE LA CARTA

const mensaje = `[INICIO DEL MENSAJE]

Llevo haciendo 
micro saltos en el tiempo 
desde hace mucho.

No tengo idea 
si han sido días, 
semanas 
o meses.

Siento que alguien me persigue 
y sabe que conozco la profecía.
No es seguro 
estar en un 
mismo lugar
por mucho tiempo.

Están intentando 
detener 
la invocación.

Las notas de la científica 
están fragmentadas.
Apenas logro 
seguir algunas pistas.

He decidido refugiarme en el pasado 
para despistar a quién me sigue

Llegué a un campo 
lleno de magueyes.
Acampé un par de días.

Hasta que vi 
algo moverse 
entre las rocas.

Al principio pensé que era un animal.
Pero no.
Era una máquina.
Caminaba entre los nopales 
y las plantas espinosas.
Saltaba,
analizaba el suelo,
tenía patas cortas 
que se expandían.
Una 
forma 
extraña.
Parecía 
un 
pequeño 
diablito.

Lo observé de lejos.
Pero me detectó.
Giró violentamente.
Y empezó a perseguirme.
No de forma torpe.
Sabía exactamente 
lo que hacía.

Medía la distancia
aalculaba el terreno
me marcó como anomalía
como si mi sola presencia 
pudiera alterar su misión.

Corrí.

Lo escuchaba detrás
cada vez más cerca,
su zumbido 
se volvió agudo.
Intenté perderlo 
en una barranca.
Fue inútil.

Pensé que 
era 
el 
final. 

Entonces 
recordé cuando corríamos 
entre tus milpas,
después de amarrar 
las coliflores
nos aventábamos 
los restos de hojas.

Saltando entre el lodo
con el atardecer cayendo
y las garzas blancas 
comiendo 
gusanos 
entre los suelos inundados
de agua de canal.

Eso me hizo confiar 
en mi puntería.
Saqué una pequeña 
bomba de salto temporal.
La lancé. 

El diablito 
desapareció 
en un destello.

Seguí 
ocultándome 
en 
el tiempo.

Capturé varios de esos robots
Necesitaba entender su código.
Tal vez podía  mejorar
mis transmisiones hacia ti.

Los diablitos robot 
recorren el Valle 
día y noche.
Se esconden 
de los habitantes.

Es difícil que alguien 
llegue hasta donde están.
Pero algunos los han visto.

Señores
que regresan
borrachos
de tomar pulque.

Dicen que en el cerro aparecen cosas.
Que en las ramas del mezquite descansa un pequeño diablo.

Los llaman entes de la noche.
Brujas.
Nahuales.
Fantasmas.
Vampiros
como nosotros.

Pero nadie sabe que son tecnologías de otras eras,
los diablitos repiten 
siempre la misma frase:

“Al servicio del Sistema Nacional de Refinación.” 

Recorren los mismos caminos
una y otra vez
como si vigilaran el territorio.

Capturarlos no es fácil
pero a veces el sol los atonta
y entonces es así como los atrapo.

Desarmarlos es complicado
cada tornillo parece 
tener voluntad propia
Sus circuitos están cubiertos 
con restos de garambullo

Creo que puedo usarlos
para convertirlos en transmisores.

Necesito regresar al futuro
hay un lugar donde 
trituran tecnología vieja.

Un centro de reciclaje
antes fue un parque de energía solar

Usaban avionetas para disipar las nubes
decían que era para proteger los paneles
pero los pobladores detuvieron el proyecto.

Después todo cambió
las mismas tierras fueron ocupadas otra vez
con apoyo del gobierno.

Las empresas 
habían financiado 
las últimas campañas electorales.

Ahora fabrican tecnología para evitar la lluvia.

La llaman la Oposición de la lluvia
máquinas que calientan la atmósfera
drones que dispersan las nubes
torres que rompen la condensación.

Creo que ellos 
son los que están 
intentado detener 
a la Culebra Tormenta. 

Recuerdo haber 
visto los restos 
de un 
robot araña 
en ese 
centro de reciclaje,
creo que puedo
reconstruirlo
y
tal vez pueda 
armar una computadora 
lo suficientemente potente
para abrir un 
puente intertemporal estable.

Para hablar contigo.

Si una noche escuchas 
un zumbido no huyas
Si ves una araña no la aplastes
Si se detiene frente a ti
acércate.

Tal vez traiga mi voz
o mi sombra
o una ruta para encontrarnos.

Espero estés teniendo 
buena venta 
de tus betabeles.

[FIN DEL MENSAJE]
..
...
....
......
........
.............
estado de señal: degradado
registro archivado`;

// ELEMENTOS

const output = document.getElementById("output");

const cursor = document.getElementById("cursor");

const nav = document.getElementById("nav");

// CONFIGURACIÓN DE ESCRITURA

const VELOCIDAD = 30;

const DURACION_DESCIFRADO = 3000;

const VELOCIDAD_DESCIFRADO = 55;

const caracteresAleatorios =

  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

  "abcdefghijklmnopqrstuvwxyz" +

  "0123456789#$%&/=?+*<>@";

const cambios = {

  o: "0",

  O: "0",

  a: "4",

  A: "4",

  e: "3",

  E: "3",

  i: "1",

  I: "1"

};

let indice = 0;

let interferenciaMostrada = false;

let salida = "";

let intervaloDescifrado = null;

// GENERAR CARACTERES ALEATORIOS

function caracterAleatorio() {

  const posicion = Math.floor(

    Math.random() * caracteresAleatorios.length

  );

  return caracteresAleatorios[posicion];

}

// ALTERAR ENCABEZADO

function generarEncabezadoAlterado() {

  return Array.from(encabezado).map(caracter => {

    if (/[a-zA-ZáéíóúÁÉÍÓÚñÑ0-9]/.test(caracter)) {

      return caracterAleatorio();

    }

    return caracter;

  }).join("");

}

// DESCIFRADO INICIAL

function iniciarDescifrado() {

  cursor.style.display = "none";

  output.textContent = generarEncabezadoAlterado();

  intervaloDescifrado = setInterval(() => {

    output.textContent = generarEncabezadoAlterado();

  }, VELOCIDAD_DESCIFRADO);

  setTimeout(() => {

    clearInterval(intervaloDescifrado);

    output.textContent = encabezado;

    salida = encabezado;

    cursor.style.display = "inline";

    setTimeout(escribir, 350);

  }, DURACION_DESCIFRADO);

}

// CORRUPCIÓN OCASIONAL

function corromper(caracter) {

  if (cambios[caracter] && Math.random() < 0.04) {

    return cambios[caracter];

  }

  return caracter;

}

// ESCRITURA PROGRESIVA

function escribir() {

  if (indice >= mensaje.length) {

    output.textContent = salida;

    cursor.style.display = "none";

    nav.classList.add("show");

    return;

  }

  // INTERFERENCIA AL 75 % DEL MENSAJE

  if (

    !interferenciaMostrada &&

    indice > mensaje.length * 0.75

  ) {

    interferenciaMostrada = true;

    output.textContent =

      salida + "\n\n[ SEÑAL INESTABLE ]\n";

    setTimeout(() => {

      output.textContent =

        salida + "\n\n[ RECONECTANDO ]\n";

      setTimeout(() => {

        output.textContent = salida;

        escribir();

      }, 2500);

    }, 1500);

    return;

  }

  salida += corromper(mensaje[indice]);

  indice++;

  output.textContent = salida;

  // SIN DESPLAZAMIENTO AUTOMÁTICO

  setTimeout(escribir, VELOCIDAD);

}

// INICIAR ESCRITURA

iniciarDescifrado();

// CONTROL DE AUDIO

const audioCarta = document.getElementById("audioCarta");

const audioControl = document.getElementById("audioControl");

const onda1 = document.getElementById("onda1");

const onda2 = document.getElementById("onda2");

const audioTachado = document.getElementById("audioTachado");

audioCarta.volume = 0.6;

// ACTUALIZAR ICONO

function actualizarIconoAudio() {

  const encendido =

    !audioCarta.paused && !audioCarta.muted;

  onda1.style.display = encendido ? "" : "none";

  onda2.style.display = encendido ? "" : "none";

  audioTachado.style.display = encendido ? "none" : "";

  const etiqueta = encendido

    ? "Apagar sonido"

    : "Activar sonido";

  audioControl.setAttribute("aria-label", etiqueta);

  audioControl.setAttribute("aria-pressed", String(encendido));

  audioControl.title = etiqueta;

}

// ACTIVAR AUDIO

async function activarAudio() {

  try {

    audioCarta.muted = false;

    await audioCarta.play();

  } catch (error) {

    console.warn("No se pudo reproducir el audio:", error);

  }

  actualizarIconoAudio();

}

// BOTÓN DE AUDIO

audioControl.addEventListener("click", async () => {

  if (!audioCarta.paused && !audioCarta.muted) {

    audioCarta.pause();

    actualizarIconoAudio();

  } else {

    await activarAudio();

  }

});

audioCarta.addEventListener("play", actualizarIconoAudio);

audioCarta.addEventListener("pause", actualizarIconoAudio);

audioCarta.addEventListener("volumechange", actualizarIconoAudio);

audioCarta.addEventListener("error", () => {

  console.warn(

    "Error al cargar el archivo:",

    audioCarta.currentSrc

  );

});

// INTENTO DE REPRODUCCIÓN AUTOMÁTICA

actualizarIconoAudio();

activarAudio();

</script>
