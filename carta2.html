<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>registro 02 — explosión ATC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#d6ef43;
      color:#0b0b0b;
      font-family:'VT323', monospace;
      padding:14px 18px 80px 18px;
      min-height:100vh;
    }

    body::before {
      content:"";
      position:fixed;
      inset:0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.04) 0px,
        rgba(0,0,0,0.04) 1px,
        transparent 2px,
        transparent 4px
      );
      pointer-events:none;
      opacity:0.18;
    }

    .header {
      background:#000;
      color:#d6ef43;
      padding:12px;
      display:inline-block;
      white-space:pre-wrap;
      font-size:1.6rem;
      line-height:1.05;
    }

    .loader, .text {
      white-space:pre-wrap;
      font-size:1.6rem;
      line-height:1.05;
    }
    .text {
  animation: unstableText 3.5s infinite;
}

@keyframes unstableText {
  0%, 100% { opacity: 1; }
  48% { opacity: 1; }
  49% { opacity: 0.86; }
  50% { opacity: 1; }
  72% { transform: translateX(0); }
  73% { transform: translateX(1px); }
  74% { transform: translateX(0); }
}

    .loader { margin:12px 0 18px 0; }

    .cursor {
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity:0; }
    }

    .nav {
      display:none;
      margin-top:40px;
      justify-content:space-between;
    }

    .nav.show { display:flex; }

    .nav a {
      border:2px solid #000;
      padding:6px 12px;
      text-decoration:none;
      color:#000;
      font-size:2rem;
      background:rgba(0,0,0,0.03);
    }

    .nav a:hover {
      background:rgba(0,0,0,0.08);
    }

  </style>
</head>
<body>

<div id="header" class="header"></div>
<div id="loader" class="loader"></div>
<div id="text" class="text"></div>

<div id="nav" class="nav">
  <a href="carta1.html">←</a>
  <a href="carta3.html">→</a>
</div>
<script>
const headerTemplate = [
'╔════════════════════════════════════════════════════════════════════╗',
' ARCHIVO INTERCEPTADO',
' registro: 02',
' asunto: explosión de planta agroquímica ATC',
' fecha de emisión: 18.07.2013',
' ubicación aproximada: {{COORDS}}',
' estado de señal: inestable',
'╚════════════════════════════════════════════════════════════════════╝'
];

const finalCoords = '20° 02´03.61´´N / 99°14´29.60´´O';

const message = `[INICIO DEL MENSAJE]

No sé cómo empezar esto.
Al principio 
dudé de lo 
que viví.

Pensé que el cerro de Nopala juega con 
las mentes de quienes lo pisan.
La tierra guarda secretos 
que nadie se atreve 
a nombrar.

Encontré el garambullo.
Era el único en toda la ladera 
como si lo hubieran colocado ahí a propósito.

Cuando lo toqué 
la piel se me enchinó. 
Diferente a cuando nuestros 
cuerpos se tocan.

el aire cambió.

Sentí que el mundo
se desdoblaba.

Un resplandor me envolvió.

No fue un rayo
ni un relámpago.

Era algo más denso.
Algo que parecía atravesar la materia.

Sentí mis partículas dividirse.
No dolía.
Era una sensación extraña 
como si mi cuerpo se deslizara 
entre capas invisibles.

No sé cuánto tiempo pasó antes de darme cuenta 
de que ya no estaba en el cerro.

Había llegado a otro lugar.
Había retrocedido en el tiempo.

Estaba en el momento en que la fábrica de agroquímicos ATC 
en 
Atitalaquia explotó.

Lo supe porque frente a mí las llamas 
cubrían los laboratorios.

El humo lo cubría todo.

Los trabajadores corrían en todas direcciones.

Escapé del fuego buscando un lugar seguro.
Algo dentro de mí me decía que 
no había llegado ahí 
por accidente.


Entré en una oficina que aún seguía en pie.

Ahí encontré una libreta.


<la energía es clave> 
<ciertas frecuencias abren las puertas> 
<los garambullos son nodos naturales>


Viajar
en el tiempo.


Los garambullos 
no eran sólo cactus.
Eran puertas intertemporales.

Pero el suelo tembló.
La explosión me alcanzó.
El aire volvió a cambiar.

Aparecí en otro cerro.

He llegado a Tenango.
Creo que es el año 2040.


Te q(███████████
▓▓▓▓▓▓▓▓▓▓
▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒
█)

[SEÑAL INTERRUMPIDA]
..
...
....
.....
.............
estado de señal: degradado
fragmento incompleto
registro archivado`;


const headerEl = document.getElementById("header");
const loaderEl = document.getElementById("loader");
const textEl = document.getElementById("text");
const navEl = document.getElementById("nav");

function randChar(){
  const c="0123456789NSEO°´/";
  return c[Math.floor(Math.random()*c.length)];
}

function scrambleCoords(){
  return finalCoords.split('').map(x=>x===" "?" ":randChar()).join('');
}

function drawHeader(coords){
  headerEl.textContent = headerTemplate
    .map(l=>l.replace("{{COORDS}}",coords))
    .join("\n");
}

let s=0;
function animateHeader(){
  drawHeader(scrambleCoords());
  s++;
  if(s<20) setTimeout(animateHeader,80);
  else startLoad();
}

function startLoad(p=0){
  const bar="["+"■".repeat(p/5)+"·".repeat(20-p/5)+"]";
  loaderEl.textContent=`[INICIO DEL MENSAJE] ${String(p).padStart(3,"0")}% ${bar}`;

  if(p<100){
    setTimeout(()=>startLoad(p+5),40);
  }else{
    drawHeader(finalCoords);
    loaderEl.textContent="";
    setTimeout(typeText,300);
  }
}

function typeText(i=0){
  if(i<message.length){
    textEl.innerHTML=message.slice(0,i+1)+'<span class="cursor">_</span>';
    setTimeout(()=>typeText(i+1),18);
  }else{
    textEl.innerHTML=message;
    navEl.classList.add("show");
  }
}

animateHeader();
</script>

</body>
</html>
