<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>registro 02 — explosión ACT</title>

<style>

* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  width: 100%;

  min-height: 100%;

  background: #000000;

  color: #00ff66;

  font-family: monospace;

}

/* TERMINAL */

#terminal {

  width: 100%;

  height: 100vh;

  height: 100dvh;

  padding: 12px 24px 24px;

  overflow-y: auto;

  overflow-x: hidden;

  overflow-wrap: anywhere;

  font-size: 22px;

  line-height: 1.45;

  text-align: left;

  overscroll-behavior: contain;

}

/* BARRA SUPERIOR */

.barra-superior {

  display: flex;

  align-items: center;

  justify-content: space-between;

  height: 28px;

  margin-bottom: 0;

}

/* FLECHA DE REGRESO */

.volver {

  display: flex;

  align-items: center;

  height: 28px;

  color: #00ff66;

  font-family: monospace;

  font-size: 24px;

  text-decoration: none;

}

.volver:hover,

.volver:focus-visible {

  color: #80ffad;

}

/* CONTROL DE AUDIO */

.audio-control {

  display: flex;

  align-items: center;

  justify-content: center;

  height: 28px;

  padding: 0;

  border: none;

  background: transparent;

  color: #00ff66;

  cursor: pointer;

}

.audio-control svg {

  display: block;

  width: 25px;

  height: 25px;

}

.audio-control:hover,

.audio-control:focus-visible {

  color: #80ffad;

}

/* TEXTO */

#output {

  display: inline;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  text-align: left;

}

/* CURSOR */

.cursor {

  animation: blink 1s steps(1) infinite;

}

@keyframes blink {

  50% {

    opacity: 0;

  }

}

/* NAVEGACIÓN FINAL */

#nav {

  display: none;

  gap: 24px;

  justify-content: space-between;

  margin: 38px 0 20px;

}

#nav.show {

  display: flex;

}

#nav a {

  color: #00ff66;

  text-decoration: none;

  border: 1px solid #00ff66;

  padding: 10px 14px;

  font-size: 18px;

}

#nav a:hover,

#nav a:focus-visible {

  background: #003319;

}

/* PANTALLAS PEQUEÑAS */

@media (max-width: 640px) {

  #terminal {

    padding: 8px 16px 16px;

    font-size: 18px;

  }

  .barra-superior {

    height: 26px;

  }

  .volver {

    height: 26px;

    font-size: 22px;

  }

  .audio-control {

    height: 26px;

  }

  .audio-control svg {

    width: 23px;

    height: 23px;

  }

  #nav {

    gap: 12px;

  }

  #nav a {

    font-size: 14px;

    padding: 8px 10px;

  }

}

</style>

</head>

<body>

<!-- AUDIO AMBIENTAL -->

<audio

  id="audioCarta"

  src="explosion-planta-agroquimica-ACT.wav"

  loop

  preload="auto"

></audio>

<main id="terminal"><div class="barra-superior">

  <a

    class="volver"

    href="cartas.html"

    aria-label="Regresar a todas las cartas"

    title="Regresar a los archivos"

  >←</a>

  <button

    id="audioControl"

    class="audio-control"

    type="button"

    aria-label="Activar sonido"

    aria-pressed="false"

    title="Activar sonido"

  >

    <svg

      viewBox="0 0 24 24"

      fill="none"

      stroke="currentColor"

      stroke-width="1.8"

      stroke-linecap="round"

      stroke-linejoin="round"

      aria-hidden="true"

    >

      <path d="M11 5 6 9H3v6h3l5 4V5Z"/>

      <path id="onda1" d="M15 9a5 5 0 0 1 0 6"/>

      <path id="onda2" d="M18 6a9 9 0 0 1 0 12"/>

      <path id="audioTachado" d="m16 9 5 6"/>

    </svg>

  </button>

</div><span id="output"></span><span id="cursor" class="cursor">█</span>

<nav id="nav">

  <a href="cartas.html">← ARCHIVOS</a>

  <a href="carta3.html">REGISTRO 03 →</a>

</nav>

</main>

<script>
// ENCABEZADO DEL ARCHIVO
const encabezado =`ARCHIVO INTERCEPTADO
registro: 02
asunto: explosión de planta agroquímica ATC
fecha de emisión: 18.07.2013
ubicación aproximada: 20°02´03.61´´N / 99°14´29.60´´O
estado de señal: inestable

`;

// CONTENIDO DE LA CARTA

const mensaje = `[INICIO DEL MENSAJE]

No sé cómo empezar esto.
Al principio 
dudé de lo 
que viví.

Pensé que el cerro de 
Santa María Macua 
juega con 
las mentes de quienes lo pisan.

La tierra guarda secretos 
que nadie se atreve 
a nombrar.

Encontré las coordenadas 
y un garambullo.

Era el único en toda la ladera
como si lo hubieran colocado ahí a propósito.

Cuando lo toqué 
la piel se me enchinó. 

Diferente a cuando nuestros 
cuerpos se tocan.
el aire cambió.

Sentí que el mundo
se desdoblaba.

Un resplandor me envolvió.
No fue un rayo
ni un relámpago.

Era algo más denso.

Algo que parecía atravesar la materia.
Sentí mis partículas dividirse.
No dolía.

Era una sensación extraña 
como si mi cuerpo se deslizara 
entre capas invisibles.

No sé cuánto tiempo 
pasó 
antes de darme cuenta 
de que ya no estaba en el cerro.

Había llegado 
a otro lugar.
Había retrocedido 
en el tiempo.

Estaba en el momento en que 
la fábrica de agroquímicos ATC 
en 
Atitalaquia explotó.

Lo supe porque frente a mí las llamas 
cubrían los laboratorios.
El humo lo cubría todo.
Los trabajadores corrían en todas direcciones.
Escapé del fuego buscando un lugar seguro.
Algo dentro de mí me decía que 
no había llegado ahí 
por accidente.

Entré en una oficina que aún seguía en pie.
Las paredes tenían grietas.
Parecían a punto de colapsar.
Ahí encontré una libreta.
Estaba tirada en el suelo.
Le faltaban hojas.
Tenía fotografías muy antiguas.
En blanco y negro.
Deslavadas por el tiempo.
También había notas.
Fórmulas químicas.
Ecuaciones.

"la energía es clave"
"ciertas frecuencias abren las puertas" 
"los garambullos son nodos naturales"
Parecía pertenecer a un científico que 
estaba investigando 
la capacidad del 
garambullo 
para 
hacer lo mismo 
que me había pasado a mí.

Viajar
en el tiempo.

Los garambullos 
no eran sólo cactus.
Eran puertas intertemporales.

Al parecer no querían que se supiera.
Las fotografías mostraban 
experimentos en distintos 
lugares del 
Valle del Mezquital.

¿Te imaginas cuántas 
puertas se cerraron 
cuando comenzaron a cortarlos?

¿Por eso las naves industriales?
Por eso cada 
vez hay menos.

Quise seguir leyendo.
Pero el suelo tembló.
La explosión me alcanzó.
El aire volvió a cambiar.
Aparecí en otro cerro.

He llegado 
a 
Tenango.

Creo que es el año 2040.

Te q(███████████

▓▓▓▓▓▓▓▓▓▓

▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒

█)

[SEÑAL INTERRUMPIDA]

..

...

....

.....

.............
estado de señal: degradado
fragmento incompleto
registro archivado`;

// ELEMENTOS

const output = document.getElementById("output");

const cursor = document.getElementById("cursor");

const nav = document.getElementById("nav");

// CONFIGURACIÓN DE ESCRITURA

const VELOCIDAD = 30;

const DURACION_DESCIFRADO = 3000;

const VELOCIDAD_DESCIFRADO = 55;

const caracteresAleatorios =

  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

  "abcdefghijklmnopqrstuvwxyz" +

  "0123456789#$%&/=?+*<>@";

const cambios = {

  o: "0",

  O: "0",

  a: "4",

  A: "4",

  e: "3",

  E: "3",

  i: "1",

  I: "1"

};

let indice = 0;

let interferenciaMostrada = false;

let salida = "";

let intervaloDescifrado = null;

// CARACTERES ALEATORIOS

function caracterAleatorio() {

  const posicion = Math.floor(

    Math.random() * caracteresAleatorios.length

  );

  return caracteresAleatorios[posicion];

}

// ENCABEZADO ALTERADO

function generarEncabezadoAlterado() {

  return Array.from(encabezado).map(caracter => {

    if (/[a-zA-ZáéíóúÁÉÍÓÚñÑ0-9]/.test(caracter)) {

      return caracterAleatorio();

    }

    return caracter;

  }).join("");

}

// DESCIFRADO

function iniciarDescifrado() {

  cursor.style.display = "none";

  output.textContent = generarEncabezadoAlterado();

  intervaloDescifrado = setInterval(() => {

    output.textContent = generarEncabezadoAlterado();

  }, VELOCIDAD_DESCIFRADO);

  setTimeout(() => {

    clearInterval(intervaloDescifrado);

    output.textContent = encabezado;

    salida = encabezado;

    cursor.style.display = "inline";

    setTimeout(escribir, 350);

  }, DURACION_DESCIFRADO);

}

// CORRUPCIÓN OCASIONAL

function corromper(caracter) {

  if (

    cambios[caracter] &&

    Math.random() < 0.04

  ) {

    return cambios[caracter];

  }

  return caracter;

}

// ESCRITURA PROGRESIVA

function escribir() {

  if (indice >= mensaje.length) {

    output.textContent = salida;

    cursor.style.display = "none";

    nav.classList.add("show");

    return;

  }

  if (

    !interferenciaMostrada &&

    indice > mensaje.length * 0.75

  ) {

    interferenciaMostrada = true;

    output.textContent =

      salida + "\n\n[ SEÑAL INESTABLE ]\n";

    setTimeout(() => {

      output.textContent =

        salida + "\n\n[ RECONECTANDO ]\n";

      setTimeout(() => {

        output.textContent = salida;

        escribir();

      }, 2500);

    }, 1500);

    return;

  }

  salida += corromper(mensaje[indice]);

  indice++;

  output.textContent = salida;

  // SIN SCROLL AUTOMÁTICO

  setTimeout(escribir, VELOCIDAD);

}

// INICIAR ESCRITURA

iniciarDescifrado();

// CONTROL DE AUDIO

const audioCarta = document.getElementById("audioCarta");

const audioControl = document.getElementById("audioControl");

const onda1 = document.getElementById("onda1");

const onda2 = document.getElementById("onda2");

const audioTachado = document.getElementById("audioTachado");

audioCarta.volume = 0.6;

// ACTUALIZAR ICONO

function actualizarIconoAudio() {

  const encendido =

    !audioCarta.paused && !audioCarta.muted;

  onda1.style.display = encendido ? "" : "none";

  onda2.style.display = encendido ? "" : "none";

  audioTachado.style.display = encendido ? "none" : "";

  const etiqueta = encendido

    ? "Apagar sonido"

    : "Activar sonido";

  audioControl.setAttribute("aria-label", etiqueta);

  audioControl.setAttribute("aria-pressed", String(encendido));

  audioControl.title = etiqueta;

}

// ACTIVAR AUDIO

async function activarAudio() {

  try {

    audioCarta.muted = false;

    await audioCarta.play();

  } catch (error) {

    console.warn("No se pudo reproducir el audio:", error);

  }

  actualizarIconoAudio();

}

// BOTÓN DE AUDIO

audioControl.addEventListener("click", async () => {

  if (!audioCarta.paused && !audioCarta.muted) {

    audioCarta.pause();

    actualizarIconoAudio();

  } else {

    await activarAudio();

  }

});

audioCarta.addEventListener("play", actualizarIconoAudio);

audioCarta.addEventListener("pause", actualizarIconoAudio);

audioCarta.addEventListener("volumechange", actualizarIconoAudio);

audioCarta.addEventListener("error", () => {

  console.warn(

    "Error al cargar el archivo:",

    audioCarta.currentSrc

  );

});

// INTENTO DE REPRODUCCIÓN AUTOMÁTICA

actualizarIconoAudio();

activarAudio();

</script>

</body>

</html>
